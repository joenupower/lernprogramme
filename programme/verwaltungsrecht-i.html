<!DOCTYPE html>
<html lang="de-CH">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Verwaltungsrecht I – Lernprogramm (100 Aufgaben)</title>
<style>
:root {
  --navy: #1b3a5c;
  --navy-dunkel: #12283f;
  --blau: #2563a8;
  --blau-hell: #e8f0f9;
  --gold: #b8860b;
  --gruen: #15803d;
  --gruen-hell: #ecfdf3;
  --rot: #b91c1c;
  --rot-hell: #fef2f2;
  --grau: #5b6b7b;
  --grau-hell: #f4f6f8;
  --rand: #d7dfe8;
  --schatten: 0 1px 3px rgba(18, 40, 63, .10), 0 4px 14px rgba(18, 40, 63, .06);
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  margin: 0; padding: 0;
  font-family: "Segoe UI", system-ui, -apple-system, Roboto, "Helvetica Neue", sans-serif;
  color: #1d2b3a; background: #eef2f6;
  font-size: 16px; line-height: 1.55;
}
#app { max-width: 1080px; margin: 0 auto; padding: 24px 20px 80px; }
h1 { font-size: 1.7rem; color: var(--navy); margin: 0 0 4px; line-height: 1.25; }
h2 { font-size: 1.2rem; color: var(--navy); margin: 0 0 10px; }
h3 { font-size: 1.05rem; color: var(--navy); margin: 18px 0 8px; }
h4 { font-size: 1rem; color: var(--navy); margin: 16px 0 6px; }

.btn {
  font: inherit; font-size: .95rem; font-weight: 600;
  padding: 10px 18px; border-radius: 10px; cursor: pointer;
  border: 1.5px solid var(--rand); background: #fff; color: var(--navy);
  transition: all .15s;
}
.btn:hover { border-color: var(--blau); box-shadow: var(--schatten); }
.btn-primary { background: var(--navy); border-color: var(--navy); color: #fff; }
.btn-primary:hover { background: var(--blau); border-color: var(--blau); }
.btn-ghost { border-color: transparent; background: transparent; color: var(--grau); }
.btn-ghost:hover { color: var(--navy); border-color: var(--rand); box-shadow: none; }
.btn:disabled { opacity: .45; cursor: default; pointer-events: none; }

/* ---------- Startseite ---------- */
.home-header {
  background: linear-gradient(135deg, var(--navy) 0%, var(--blau) 100%);
  color: #fff; border-radius: 16px; padding: 32px 32px 26px; box-shadow: var(--schatten);
}
.home-header h1 { color: #fff; font-size: 1.9rem; }
.untertitel { margin: 4px 0 20px; opacity: .85; }
.home-stats { display: flex; gap: 28px; margin-bottom: 20px; flex-wrap: wrap; }
.stat { background: rgba(255,255,255,.12); border-radius: 12px; padding: 12px 22px; }
.stat-zahl { font-size: 1.5rem; font-weight: 700; }
.stat-label { font-size: .82rem; opacity: .85; }
.balken { background: rgba(255,255,255,.25); border-radius: 999px; height: 10px; overflow: hidden; margin: 4px 0 18px; }
.balken > div { background: var(--gold); height: 100%; border-radius: 999px; transition: width .3s; }
.home-actions { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
.home-actions .btn { border-color: rgba(255,255,255,.4); background: rgba(255,255,255,.95); }
.home-actions .btn-ghost { background: transparent; color: rgba(255,255,255,.8); }
.home-actions .btn-ghost:hover { color: #fff; border-color: rgba(255,255,255,.5); }
.hinweis-methodik { color: var(--grau); font-size: .88rem; margin: 16px 4px 20px; }
.teil-titel { font-size: .8rem; font-weight: 700; color: var(--grau); text-transform: uppercase; letter-spacing: .06em; margin: 22px 4px 8px; }

/* ---------- Themen-Grid ---------- */
.themen-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 14px; }
.thema-card {
  font: inherit; text-align: left; cursor: pointer;
  background: #fff; border: 1.5px solid var(--rand); border-radius: 14px;
  padding: 16px 18px 14px; transition: all .15s; display: flex; flex-direction: column; gap: 5px;
}
.thema-card:hover { border-color: var(--blau); box-shadow: var(--schatten); transform: translateY(-2px); }
.thema-nr { font-size: .78rem; font-weight: 700; color: var(--grau); text-transform: uppercase; letter-spacing: .05em; }
.thema-titel { font-weight: 700; color: var(--navy); font-size: 1.04rem; line-height: 1.3; }
.thema-kurz { color: var(--grau); font-size: .86rem; }
.thema-fuss { margin-top: 8px; display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
.qdots { display: flex; gap: 5px; flex-wrap: wrap; }
.qdot { width: 13px; height: 13px; border-radius: 999px; background: var(--grau-hell); border: 1.5px solid var(--rand); }
.qdot.d-geloest { background: var(--gruen); border-color: var(--gruen); }
.qdot.d-hilfe { background: #eab308; border-color: #ca9a04; }

.badge { display: inline-block; font-size: .76rem; font-weight: 700; padding: 3px 10px; border-radius: 999px; }
.badge-done { background: var(--gruen-hell); color: var(--gruen); border: 1px solid #bbe7cb; }
.badge-hilfe { background: #fff8e6; color: #92640a; border: 1px solid #f0dca4; }
.badge-open { background: var(--grau-hell); color: var(--grau); border: 1px solid var(--rand); }
.badge-thema { background: var(--blau-hell); color: var(--blau); border: 1px solid #c4d8ee; }

/* ---------- Themen-/Fragenansicht ---------- */
.top-bar { display: flex; justify-content: space-between; margin-bottom: 10px; gap: 10px; flex-wrap: wrap; }
.thema-header { background: #fff; border-radius: 14px; padding: 18px 24px; box-shadow: var(--schatten); border-left: 6px solid var(--navy); }
.thema-kopf { display: flex; justify-content: space-between; gap: 16px; flex-wrap: wrap; align-items: baseline; }
.frage-nav { display: flex; gap: 7px; margin-top: 12px; flex-wrap: wrap; }
.fnav {
  font: inherit; font-weight: 700; font-size: .88rem; cursor: pointer;
  width: 38px; height: 38px; border-radius: 999px; border: 1.5px solid var(--rand);
  background: #fff; color: var(--grau); transition: all .12s;
}
.fnav:hover { border-color: var(--blau); color: var(--blau); }
.fnav.f-aktiv { border-color: var(--navy); background: var(--navy); color: #fff; }
.fnav.f-geloest { border-color: var(--gruen); background: var(--gruen-hell); color: var(--gruen); }
.fnav.f-hilfe { border-color: #ca9a04; background: #fff8e6; color: #92640a; }
.fnav.f-geloest.f-aktiv { background: var(--gruen); color: #fff; }
.fnav.f-hilfe.f-aktiv { background: #ca9a04; color: #fff; }

.frage-card { background: #fff; border-radius: 14px; padding: 22px 26px; box-shadow: var(--schatten); margin-top: 16px; }
.frage-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.frage-nrchip { background: var(--navy); color: #fff; border-radius: 8px; padding: 2px 10px; font-size: .85rem; white-space: nowrap; }
.stufe-sterne { color: var(--gold); font-size: .95rem; letter-spacing: .12em; white-space: nowrap; }
.stern-leer { color: #d5dbe2; }
.stufe-text { color: var(--grau); font-size: .8rem; margin-left: 4px; }
.typ-label { font-size: .78rem; font-weight: 700; color: var(--grau); text-transform: uppercase; letter-spacing: .05em; }
.frage-text { font-weight: 600; color: var(--navy); margin: 12px 0 14px; font-size: 1.05rem; }

.sachverhalt { background: #fffdf5; border: 1.5px solid #ead9a8; border-radius: 12px; padding: 14px 18px; margin: 12px 0 14px; }
.sachverhalt-titel { color: #7c5e10; font-size: .8rem; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; margin-bottom: 4px; }
.norm { background: #f4f6f8; border-left: 4px solid var(--blau); border-radius: 8px; padding: 10px 14px; margin: 10px 0; font-style: italic; }
.hint { color: var(--grau); font-size: .9em; }

.art {
  display: inline-block; font-family: inherit; background: var(--blau-hell); color: var(--blau);
  border: 1px solid #c4d8ee; border-radius: 6px; padding: 2px 8px;
  font-size: .8rem; font-weight: 600; white-space: nowrap; margin: 1px 0;
}
.art:hover { background: #d8e6f5; }
.art:focus-visible { outline: 2px solid var(--blau); outline-offset: 2px; }
.art-zeile { margin-top: 14px; display: flex; flex-wrap: wrap; gap: 4px; align-items: baseline; }

/* Multiple Choice */
.mc-liste { display: flex; flex-direction: column; gap: 8px; }
.mc-opt { display: flex; gap: 10px; align-items: flex-start; border: 1.5px solid var(--rand); border-radius: 10px; padding: 11px 14px; cursor: pointer; background: #fff; transition: all .12s; }
.mc-opt:hover { border-color: var(--blau); }
.mc-opt input { margin-top: 4px; accent-color: var(--navy); flex-shrink: 0; }
.mc-opt.mc-ok { border-color: var(--gruen); background: var(--gruen-hell); }
.mc-opt.mc-bad { border-color: var(--rot); background: var(--rot-hell); }
.mc-opt.mc-dim { opacity: .6; }

/* Mehrfachauswahl-Chips */
.check-grid { display: flex; flex-wrap: wrap; gap: 8px; }
.check-chip input { position: absolute; opacity: 0; pointer-events: none; }
.check-chip span {
  display: inline-block; padding: 9px 16px; border: 1.5px solid var(--rand); border-radius: 999px;
  font-size: .93rem; font-weight: 600; color: var(--grau); cursor: pointer; transition: all .12s; background: #fff;
}
.check-chip input:checked + span { background: var(--navy); border-color: var(--navy); color: #fff; }
.check-chip input:focus-visible + span { box-shadow: 0 0 0 3px rgba(37, 99, 168, .3); }
.check-chip input:disabled + span { cursor: default; }
.check-chip span:hover { border-color: var(--blau); }
.check-chip.chip-ok span { background: var(--gruen); border-color: var(--gruen); color: #fff; }
.check-chip.chip-bad span { background: var(--rot-hell); border-color: var(--rot); color: var(--rot); }
.check-chip.chip-fehlt span { border-color: var(--rot); border-style: dashed; color: var(--rot); background: #fff; }

/* Zuordnen */
.aufgabe-tabelle { width: 100%; border-collapse: collapse; margin: 6px 0 10px; }
.aufgabe-tabelle th {
  text-align: left; font-size: .8rem; text-transform: uppercase; letter-spacing: .04em;
  color: var(--grau); padding: 8px 10px; border-bottom: 2px solid var(--rand);
}
.aufgabe-tabelle td { padding: 10px; border-bottom: 1px solid var(--grau-hell); vertical-align: middle; }
.aufgabe-tabelle tr:last-child td { border-bottom: none; }
.aufgabe-tabelle select {
  font: inherit; font-size: .92rem; padding: 9px 10px; border: 1.5px solid var(--rand); border-radius: 8px;
  max-width: 100%; background: #fff;
}
.aufgabe-tabelle select:focus { outline: none; border-color: var(--blau); box-shadow: 0 0 0 3px rgba(37, 99, 168, .15); }
.row-ok td { background: var(--gruen-hell); }
.row-ok td:first-child { box-shadow: inset 4px 0 0 var(--gruen); }
.row-bad td { background: var(--rot-hell); }
.row-bad td:first-child { box-shadow: inset 4px 0 0 var(--rot); }
.zeile-links { font-weight: 600; color: var(--navy); }

/* Reihenfolge */
.reihe-liste { display: flex; flex-direction: column; gap: 8px; }
.reihe-item {
  font: inherit; text-align: left; display: flex; gap: 12px; align-items: center;
  border: 1.5px solid var(--rand); border-radius: 10px; padding: 10px 14px;
  cursor: pointer; background: #fff; transition: all .12s;
}
.reihe-item:hover { border-color: var(--blau); }
.reihe-num {
  flex-shrink: 0; width: 30px; height: 30px; border-radius: 999px;
  border: 1.5px dashed var(--rand); color: var(--grau);
  display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: .9rem;
}
.reihe-item.gewaehlt .reihe-num { background: var(--navy); border: 1.5px solid var(--navy); color: #fff; }
.reihe-item.reihe-ok { border-color: var(--gruen); background: var(--gruen-hell); }
.reihe-item.reihe-ok .reihe-num { background: var(--gruen); border-color: var(--gruen); color: #fff; }
.reihe-item.reihe-bad { border-color: var(--rot); background: var(--rot-hell); }
.reihe-item.reihe-bad .reihe-num { background: var(--rot); border-color: var(--rot); color: #fff; }

/* Feedback & Lösung */
.frage-actions { display: flex; gap: 10px; margin-top: 16px; flex-wrap: wrap; }
.fb { border-radius: 10px; padding: 12px 16px; font-weight: 600; margin-top: 14px; }
.fb-ok { background: var(--gruen-hell); color: var(--gruen); border: 1px solid #bbe7cb; }
.fb-bad { background: var(--rot-hell); color: var(--rot); border: 1px solid #f3c6c6; }
.fb-info { background: var(--blau-hell); color: var(--blau); border: 1px solid #c4d8ee; }

.solution-box { background: var(--grau-hell); border: 1.5px solid var(--rand); border-radius: 12px; padding: 16px 20px; margin-top: 16px; font-size: .96rem; overflow-x: auto; }
.solution-box > h4 { margin-top: 0; }
.solution-box p { margin: 8px 0; }
.solution-box ul, .solution-box ol { margin: 6px 0; padding-left: 22px; }
.solution-box li { margin-bottom: 4px; }

.merkbox {
  background: #fffdf5; border: 1.5px solid #ead9a8; border-left: 5px solid var(--gold);
  border-radius: 10px; padding: 10px 14px; margin-top: 12px; font-size: .93rem;
}
.merkbox b:first-child { color: #7c5e10; }

/* Spickzettel-Modal */
.modal-hg {
  position: fixed; inset: 0; background: rgba(18, 40, 63, .55); z-index: 50;
  display: flex; align-items: flex-start; justify-content: center; padding: 30px 16px; overflow-y: auto;
}
.modal-box {
  background: #fff; border-radius: 16px; max-width: 880px; width: 100%;
  padding: 26px 30px 30px; box-shadow: 0 10px 40px rgba(0,0,0,.25); position: relative;
  overflow-x: auto;
}
.modal-schliessen { position: sticky; float: right; top: 0; }
.spick-tabelle { width: 100%; border-collapse: collapse; margin: 8px 0 18px; font-size: .9rem; }
.spick-tabelle th { text-align: left; background: var(--navy); color: #fff; padding: 7px 10px; font-size: .8rem; }
.spick-tabelle td { padding: 7px 10px; border-bottom: 1px solid var(--grau-hell); vertical-align: top; }
.spick-tabelle tr:nth-child(even) td { background: #f8fafc; }

@media (max-width: 640px) {
  #app { padding: 14px 10px 60px; }
  .home-header { padding: 22px 20px 20px; }
  .frage-card { padding: 16px 16px; }
}

/* ---------- Bedienung auf dem Handy ---------- */
html { -webkit-text-size-adjust: 100%; }
.art { cursor: pointer; }
.art.art-offen { background: var(--navy); border-color: var(--navy); color: #fff; }
.gesetz-popup {
  position: fixed; left: 12px; right: 12px; bottom: 12px; z-index: 90;
  max-width: 640px; margin: 0 auto; max-height: 45vh; overflow-y: auto;
  background: #fff; border: 1.5px solid var(--rand); border-left: 5px solid var(--blau);
  border-radius: 12px; padding: 14px 46px 14px 16px;
  box-shadow: 0 6px 28px rgba(18, 40, 63, .28); font-size: .93rem; line-height: 1.5;
}
.gesetz-popup b { display: block; color: var(--navy); margin-bottom: 4px; }
.gesetz-popup-zu {
  position: absolute; top: 7px; right: 8px; border: none; background: transparent;
  font: inherit; font-size: 1.15rem; line-height: 1; color: var(--grau);
  cursor: pointer; padding: 6px 8px;
}
.gesetz-popup-zu:hover { color: var(--navy); }
.modal-box, .spick, .solution-box { overflow-x: auto; }
@media (max-width: 640px) {
  select, .aufgabe-tabelle select { font-size: 16px; }
  .art { padding: 5px 10px; font-size: .82rem; }
}
</style>
</head>
<body>
<div id="app"></div>
<div id="modal"></div>
<script>
'use strict';

/* =====================  GESETZESTEXTE (Tooltip)  ===================== */
const GESETZ = {
  'Art. 5 BV': 'Grundsätze rechtsstaatlichen Handelns: Grundlage und Schranke staatlichen Handelns ist das Recht (Abs. 1). Staatliches Handeln muss im öffentlichen Interesse liegen und verhältnismässig sein (Abs. 2). Staatliche Organe und Private handeln nach Treu und Glauben (Abs. 3). Bund und Kantone beachten das Völkerrecht (Abs. 4).',
  'Art. 5 Abs. 1 BV': 'Grundlage und Schranke staatlichen Handelns ist das Recht (Legalitätsprinzip).',
  'Art. 5 Abs. 2 BV': 'Staatliches Handeln muss im öffentlichen Interesse liegen und verhältnismässig sein.',
  'Art. 5 Abs. 3 BV': 'Staatliche Organe und Private handeln nach Treu und Glauben.',
  'Art. 8 BV': 'Alle Menschen sind vor dem Gesetz gleich (Abs. 1). Niemand darf diskriminiert werden, namentlich nicht wegen der Herkunft, der Rasse, des Geschlechts, des Alters, der Sprache, der sozialen Stellung, der Lebensform, der religiösen, weltanschaulichen oder politischen Überzeugung oder wegen einer körperlichen, geistigen oder psychischen Behinderung (Abs. 2).',
  'Art. 9 BV': 'Jede Person hat Anspruch darauf, von den staatlichen Organen ohne Willkür und nach Treu und Glauben behandelt zu werden.',
  'Art. 10 BV': 'Jeder Mensch hat das Recht auf Leben (Abs. 1) und auf persönliche Freiheit, insbesondere auf körperliche und geistige Unversehrtheit und auf Bewegungsfreiheit (Abs. 2).',
  'Art. 15 BV': 'Die Glaubens- und Gewissensfreiheit ist gewährleistet. Jede Person hat das Recht, ihre Religion und ihre weltanschauliche Überzeugung frei zu wählen und allein oder in Gemeinschaft mit anderen zu bekennen (Abs. 1 und 2).',
  'Art. 22 BV': 'Die Versammlungsfreiheit ist gewährleistet. Jede Person hat das Recht, Versammlungen zu organisieren, an Versammlungen teilzunehmen oder Versammlungen fernzubleiben.',
  'Art. 26 BV': 'Das Eigentum ist gewährleistet (Abs. 1). Enteignungen und Eigentumsbeschränkungen, die einer Enteignung gleichkommen, werden voll entschädigt (Abs. 2).',
  'Art. 27 BV': 'Die Wirtschaftsfreiheit ist gewährleistet (Abs. 1). Sie umfasst insbesondere die freie Wahl des Berufes sowie den freien Zugang zu einer privatwirtschaftlichen Erwerbstätigkeit und deren freie Ausübung (Abs. 2).',
  'Art. 29 BV': 'Jede Person hat in Verfahren vor Gerichts- und Verwaltungsinstanzen Anspruch auf gleiche und gerechte Behandlung sowie auf Beurteilung innert angemessener Frist (Abs. 1). Die Parteien haben Anspruch auf rechtliches Gehör (Abs. 2). Jede Person, die nicht über die erforderlichen Mittel verfügt, hat Anspruch auf unentgeltliche Rechtspflege (Abs. 3).',
  'Art. 29 Abs. 2 BV': 'Die Parteien haben Anspruch auf rechtliches Gehör.',
  'Art. 30 BV': 'Jede Person, deren Sache in einem gerichtlichen Verfahren beurteilt werden muss, hat Anspruch auf ein durch Gesetz geschaffenes, zuständiges, unabhängiges und unparteiisches Gericht (Abs. 1).',
  'Art. 36 BV': 'Einschränkungen von Grundrechten bedürfen einer gesetzlichen Grundlage. Schwerwiegende Einschränkungen müssen im Gesetz selbst vorgesehen sein; ausgenommen sind Fälle ernster, unmittelbarer und nicht anders abwendbarer Gefahr (Abs. 1). Einschränkungen müssen durch ein öffentliches Interesse oder durch den Schutz von Grundrechten Dritter gerechtfertigt (Abs. 2) und verhältnismässig sein (Abs. 3). Der Kerngehalt der Grundrechte ist unantastbar (Abs. 4).',
  'Art. 48 BV': 'Die Kantone können miteinander Verträge schliessen sowie gemeinsame Organisationen und Einrichtungen schaffen (Konkordate, Abs. 1).',
  'Art. 73 BV': 'Bund und Kantone streben ein auf Dauer ausgewogenes Verhältnis zwischen der Natur und ihrer Erneuerungsfähigkeit einerseits und ihrer Beanspruchung durch den Menschen anderseits an (Nachhaltigkeit).',
  'Art. 74 BV': 'Der Bund erlässt Vorschriften über den Schutz des Menschen und seiner natürlichen Umwelt vor schädlichen oder lästigen Einwirkungen (Abs. 1). Er sorgt dafür, dass solche Einwirkungen vermieden werden; die Kosten der Vermeidung und Beseitigung tragen die Verursacher (Abs. 2, Verursacherprinzip).',
  'Art. 78 BV': 'Für den Natur- und Heimatschutz sind die Kantone zuständig (Abs. 1). Moore und Moorlandschaften von besonderer Schönheit und gesamtschweizerischer Bedeutung sind geschützt; es dürfen darin weder Anlagen gebaut noch Bodenveränderungen vorgenommen werden (Abs. 5) — direkt anwendbares materielles Verwaltungsrecht in der Verfassung.',
  'Art. 86 BV': 'Der Bund verwendet die Erträge aus den Abgaben auf Treibstoffen sowie die Nationalstrassenabgabe für Aufgaben und Aufwendungen im Zusammenhang mit dem Strassenverkehr — direkt anwendbares materielles Verwaltungsrecht in der Verfassung.',
  'Art. 127 BV': 'Die Ausgestaltung der Steuern, namentlich der Kreis der Steuerpflichtigen, der Gegenstand der Steuer und deren Bemessung, ist in den Grundzügen im Gesetz selbst zu regeln (Abs. 1 — strenges Legalitätsprinzip im Abgaberecht).',
  'Art. 164 BV': 'Alle wichtigen rechtsetzenden Bestimmungen sind in der Form des Bundesgesetzes zu erlassen (Abs. 1). Rechtsetzungsbefugnisse können durch Bundesgesetz übertragen werden, soweit dies nicht durch die Bundesverfassung ausgeschlossen wird (Abs. 2 — Gesetzesdelegation).',
  'Art. 185 BV': 'Der Bundesrat kann, unmittelbar gestützt auf diesen Artikel, Verordnungen und Verfügungen erlassen, um eingetretenen oder unmittelbar drohenden schweren Störungen der öffentlichen Ordnung oder der inneren oder äusseren Sicherheit zu begegnen (Abs. 3, Notrecht).',
  'Art. 5 VwVG': 'Als Verfügungen gelten Anordnungen der Behörden im Einzelfall, die sich auf öffentliches Recht des Bundes stützen und zum Gegenstand haben: Begründung, Änderung oder Aufhebung von Rechten oder Pflichten; Feststellung des Bestehens, Nichtbestehens oder Umfanges von Rechten oder Pflichten; Abweisung von Begehren auf Begründung, Änderung, Aufhebung oder Feststellung von Rechten oder Pflichten oder Nichteintreten auf solche Begehren (Abs. 1).',
  'Art. 25 VwVG': 'Die für die Beurteilung zuständige Behörde kann über den Bestand, den Nichtbestand oder den Umfang öffentlichrechtlicher Rechte oder Pflichten von Amtes wegen oder auf Begehren eine Feststellungsverfügung treffen (Abs. 1). Dem Begehren ist zu entsprechen, wenn der Gesuchsteller ein schutzwürdiges Interesse nachweist (Abs. 2).',

/* ==========  THEMA 5: Ermessen & unbestimmte Rechtsbegriffe (7)  ========== */

  erklaerung: '<p>Ermessen ist ein vom <b>Gesetzgeber gewollter Freiraum</b>: Er formuliert die Voraussetzungen oder die Rechtsfolgen offen und überlässt der Behörde die Feinsteuerung im Einzelfall.</p>' +

  ],
  richtig: [0, 1, 2],
  erklaerung: '<p>Das Gebot von Treu und Glauben ist einerseits <b>allgemeiner Rechtsgrundsatz</b> (Art. 5 Abs. 3 BV) und andererseits <b>verfassungsmässiges Recht</b> (Art. 9 BV), auf das sich der Einzelne direkt berufen kann.</p>' +
    '<ul><li><b>Verbot widersprüchlichen Verhaltens:</b> Ein einmal eingenommener Standpunkt darf nicht ohne sachlichen Grund gewechselt werden. Praxisänderungen aufgrund neuer konkreter Erkenntnisse bleiben erlaubt.</li>' +

  erklaerung: '<p>Musterantwort zu Übungsblatt Aufgabe 8. Ziele des Vertrauensschutzes: <b>Verlässlichkeit des Staates</b> sowie <b>Rechtssicherheit und Vorhersehbarkeit</b> staatlichen Handelns.</p>' +

{ id: 'T8F3', thema: 8, stufe: 3, typ: 'reihenfolge',

{ id: 'T8F4', thema: 8, stufe: 4, typ: 'mc',
  frage: 'In welchem Verhältnis stehen <b>Vertrauensschutz</b> und <b>Legalitätsprinzip</b>?',

{ id: 'T8F5', thema: 8, stufe: 5, typ: 'multi',

{ id: 'T8F6', thema: 8, stufe: 6, typ: 'multi',

{ id: 'T9F6', thema: 9, stufe: 6, typ: 'mc',
  sachverhalt: 'Eine Gemeinde bewilligt seit Jahren gesetzwidrig Verkaufsstände auf dem Dorfplatz — allerdings nur ortsansässigen Händlern. Ein auswärtiger Händler verlangt, gleich behandelt zu werden.',

  erklaerung: '<p><b>Grundsatz:</b> Wer sieht, dass andere rechtswidrig begünstigt werden, kann nicht verlangen, ebenfalls rechtswidrig begünstigt zu werden. Er kann nur verlangen, dass das Recht — auf ihn <i>und</i> die anderen — richtig angewendet wird.</p>' +

/* ==========  THEMA 10: Anspruch auf rechtliches Gehör (6)  ========== */
{ id: 'T10F1', thema: 10, stufe: 1, typ: 'mc',
  frage: 'Wo ist der Anspruch auf <b>rechtliches Gehör</b> heute verankert und was besagt er?',
  optionen: [

    'Art. 30 BV — er gilt nur in gerichtlichen, nicht in Verwaltungsverfahren',
    'Art. 8 BV — er ist Ausfluss der Rechtsgleichheit'
  ],
  richtig: 0,
  erklaerung: '<p>Das Script leitet den Gehörsanspruch aus dem Willkürverbot ab — historisch wurde er aus Art. 4 der alten BV abgeleitet. <b>Heute</b> ist er eine <b>selbständige Verfahrensgarantie</b> in Art. 29 Abs. 2 BV.</p>' +
    '<p>Art. 30 BV betrifft die Garantien im <b>gerichtlichen</b> Verfahren (unabhängiges Gericht); der Gehörsanspruch gilt dagegen in Verfahren vor <b>Gerichts- und Verwaltungsinstanzen</b>.</p>',
  artikel: ['Art. 29 Abs. 2 BV', 'Art. 29 BV', 'Art. 30 BV'] },

{ id: 'T10F2', thema: 10, stufe: 2, typ: 'multi',
  frage: 'Welche <b>Teilgehalte</b> umfasst der Anspruch auf rechtliches Gehör?',

    'Anspruch auf Prüfung der Vorbringen und auf Begründung des Entscheids',

  richtig: [0, 1, 2, 3],
  erklaerung: '<p>Für das Bundesverwaltungsverfahren sind die Teilgehalte konkretisiert: vorgängige Äusserung (Art. 30 VwVG), Akteneinsicht (Art. 26 VwVG), Begründungspflicht (Art. 35 VwVG).</p>' +

{ id: 'T10F3', thema: 10, stufe: 3, typ: 'mc',

  optionen: [
    'Der Anspruch ist formeller Natur — seine Verletzung führt grundsätzlich zur Aufhebung des Entscheids, unabhängig davon, ob dieser inhaltlich richtig wäre',

  erklaerung: '<p>Der Gehörsanspruch ist <b>formeller Natur</b>: Es kommt nicht darauf an, ob der Entscheid bei korrektem Vorgehen gleich ausgefallen wäre.</p>' +

    '<p>Nichtigkeit tritt nur bei besonders schweren und offensichtlichen Mängeln ein (Evidenztheorie, → Thema 13) — ein Gehörsverstoss führt in der Regel zur Anfechtbarkeit, nicht zur Nichtigkeit.</p>',

{ id: 'T10F5', thema: 10, stufe: 5, typ: 'mc',
  sachverhalt: 'Ein Kandidat hat ein schriftliches Examen nicht bestanden. Er vermutet eine rechtsungleiche Bewertung und verlangt Einsicht in die Prüfungsakten <b>aller anderen</b> Prüflinge.',

  erklaerung: '<p>Die Akteneinsicht nach Art. 29 Abs. 2 BV erstreckt sich auf alle <b>entscheidwesentlichen</b> Akten. Ihre Grenzen liegen bei öffentlichen Geheimhaltungsinteressen und berechtigten Interessen Dritter.</p>' +

{ id: 'T10F6', thema: 10, stufe: 6, typ: 'mc',
  sachverhalt: 'Eine Partei wirft ihre Stellungnahme am letzten Tag der Frist um 23.55 Uhr in einen Briefkasten der Schweizer Post ein und lässt dies von zwei Zeugen handschriftlich bestätigen. Die Rechtsmittelinstanz berücksichtigt die Eingabe nicht.',

  erklaerung: '<p>Musterantwort zu Übungsblatt Aufgabe 10. Der Kern liegt beim <b>Beweis</b>: Die Rechtzeitigkeit einer Postaufgabe darf mit <b>Zeugen</b> bewiesen werden — der Poststempel ist nicht das einzige zulässige Beweismittel. Verweigert die Instanz die Mitwirkung an dieser Beweiserhebung oder die Stellungnahme dazu, verletzt sie Art. 29 Abs. 2 BV.</p>' +

  erklaerung: '<p>Die EMPA ist eine Forschungsstelle der ETH; die ETH ist eine <b>öffentlich-rechtliche Anstalt des Bundes</b> und nimmt als Verwaltungseinheit Verwaltungsaufgaben wahr. Das Ausgiessen der Säure ist ein <b>Realakt</b> — es zielt auf einen Taterfolg, nicht auf die Regelung eines Rechtsverhältnisses.</p>' +

/* =====================  APP-LOGIK  ===================== */
const KEY = 'verwaltungsrecht-lernprogramm-v1';

function ladeStore() {
  try { return JSON.parse(localStorage.getItem(KEY)) || { status: {} }; }
  catch (e) { return { status: {} }; }
}
let store = ladeStore();
function speichern() {
  try { localStorage.setItem(KEY, JSON.stringify(store)); } catch (e) { /* z. B. Privatmodus: Fortschritt bleibt nur in dieser Sitzung */ }
}

const session = {};
function sess(q) {
  if (!session[q.id]) session[q.id] = { sel: null, set: new Set(), zuord: {}, ordnung: [], perm: null, hilfe: false, korrekt: false, geprueft: false, loesungOffen: false };
  return session[q.id];
}

/* Zufällige Anzeigereihenfolge der Antwortoptionen (pro Frage und Sitzung stabil) */
function permFuer(st, n) {
  if (!st.perm || st.perm.length !== n) {
    const a = Array.from({ length: n }, (_, i) => i);
    for (let i = n - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      const h = a[i]; a[i] = a[j]; a[j] = h;
    }
    st.perm = a;
  }
  return st.perm;
}

let ansicht = { seite: 'home', thema: 1, frage: 0 };

function fragenZu(nr) { return FRAGEN.filter(f => f.thema === nr); }
function statusVon(q) { return store.status[q.id] || null; }
function esc(t) { return String(t).replace(/&/g, '&amp;').replace(/</g, '&lt;'); }
function maxStufe(nr) { return fragenZu(nr).reduce((m, f) => Math.max(m, f.stufe), 1); }

function artBadges(liste) {
  if (!liste || !liste.length) return '';
  const b = liste.map(a => '<span class="art" title="' + esc(GESETZ[a] || '') + '">' + a + '</span>').join(' ');
  return '<div class="art-zeile"><span class="hint">Rechtsgrundlagen und Entscheide (antippen bzw. mit der Maus darüberfahren):</span> ' + b + '</div>';
}

/* Schwierigkeit: 5 Sterne, skaliert auf die Fragenzahl des Themas */
function sterne(stufe, max) {
  const voll = Math.max(1, Math.ceil(stufe / max * 5));
  let s = '';
  for (let i = 1; i <= 5; i++) s += i <= voll ? '★' : '<span class="stern-leer">★</span>';
  return '<span class="stufe-sterne" title="Schwierigkeitsstufe ' + stufe + ' von ' + max + '">' + s +
    '<span class="stufe-text">Stufe ' + stufe + '/' + max + '</span></span>';
}

const TYP_LABEL = { mc: 'Multiple Choice', multi: 'Mehrfachauswahl', zuordnen: 'Zuordnen', reihenfolge: 'Reihenfolge' };

  const total = FRAGEN.length;
  let gel = 0, hil = 0;
  FRAGEN.forEach(q => { const st = statusVon(q); if (st === 'geloest') gel++; else if (st === 'hilfe') hil++; });
  const pct = Math.round((gel + hil) / total * 100);

  let letzterTeil = '';

    const fs = fragenZu(t.nr);
    const fertig = fs.filter(q => statusVon(q)).length;

      return '<span class="qdot ' + (st === 'geloest' ? 'd-geloest' : st === 'hilfe' ? 'd-hilfe' : '') + '"></span>';

    const badge = fertig === fs.length
      ? '<span class="badge badge-done">✓ abgeschlossen</span>'

    const karte = '<button class="thema-card" onclick="oeffneThema(' + t.nr + ')">' +

      '<span class="thema-fuss"><span class="qdots">' + dots + '</span>' + badge + '</span>' +

    let vor = '';
    if (t.teil !== letzterTeil) {
      vor = (letzterTeil ? '</div>' : '') + '<div class="teil-titel">' + t.teil + '</div><div class="themen-grid">';
      letzterTeil = t.teil;

    return vor + karte;

      '<div class="home-actions">' +
        '<button class="btn" onclick="zeigeSpick()">📋 Spickzettel</button>' +
        '<button class="btn btn-ghost" onclick="allesZuruecksetzen()">Fortschritt zurücksetzen</button>' +
      '</div>' +
    '</div>' +
    '<p class="hinweis-methodik">Innerhalb jedes Themas steigt die Schwierigkeit: zuerst Grundwissen und Definitionen, dann Zuordnungen und Abgrenzungen, zuletzt Struktur- und Fallaufgaben (inkl. Leitentscheide). Grün = selbständig gelöst, Gelb = mit Lösungshilfe.</p>' +
    karten;
  window.scrollTo(0, 0);
}

function oeffneThema(nr) {
  ansicht = { seite: 'thema', thema: nr, frage: 0 };
  const fs = fragenZu(nr);
  const erste = fs.findIndex(q => !statusVon(q));
  if (erste > 0) ansicht.frage = erste;
  render();
}

function allesZuruecksetzen() {
  if (!confirm('Ganzen Fortschritt löschen?')) return;
  store = { status: {} };
  speichern();
  Object.keys(session).forEach(k => delete session[k]);
  render();
}

/* ---------- Fragenansicht ---------- */
function renderThema() {
  const t = THEMEN[ansicht.thema - 1];
  const fs = fragenZu(t.nr);
  const q = fs[ansicht.frage];
  const st = sess(q);
  const gespeichert = statusVon(q);

  const nav = fs.map((f, i) => {
    const s = statusVon(f);
    const cls = ['fnav'];
    if (i === ansicht.frage) cls.push('f-aktiv');
    if (s === 'geloest') cls.push('f-geloest');
    if (s === 'hilfe') cls.push('f-hilfe');
    return '<button class="' + cls.join(' ') + '" onclick="geheZuFrage(' + i + ')" title="Aufgabe ' + (i + 1) + '">' + (i + 1) + '</button>';
  }).join('');

  let inhalt = '';
  if (q.typ === 'mc') inhalt = uiMC(q, st);
  else if (q.typ === 'multi') inhalt = uiMulti(q, st);
  else if (q.typ === 'zuordnen') inhalt = uiZuordnen(q, st);
  else if (q.typ === 'reihenfolge') inhalt = uiReihenfolge(q, st);

  const fertig = st.korrekt || gespeichert;
  let feedback = '';
  if (st.korrekt) feedback = '<div class="fb fb-ok">✓ Richtig' + (st.hilfe ? ' — mit Lösungshilfe gelöst.' : ' gelöst!') + '</div>';
  else if (st.geprueft) feedback = '<div class="fb fb-bad">✗ Noch nicht richtig — ' + st.fbText + '</div>';
  else if (gespeichert && !st.korrekt) feedback = '<div class="fb fb-info">Diese Aufgabe hast du bereits ' + (gespeichert === 'geloest' ? 'selbständig gelöst' : 'mit Lösungshilfe gelöst') + '. Du kannst sie erneut bearbeiten.</div>';

  const loesung = st.loesungOffen ? '<div class="solution-box"><h4>Lösung &amp; Erklärung</h4>' + loesungsInhalt(q) + q.erklaerung + '</div>' : '';

  const weiter = ansicht.frage < fs.length - 1
    ? '<button class="btn btn-primary" onclick="geheZuFrage(' + (ansicht.frage + 1) + ')">Nächste Aufgabe →</button>'
    : '<button class="btn btn-primary" onclick="zurUebersicht()">Thema abschliessen ✓</button>';

  document.getElementById('app').innerHTML =
    '<div class="top-bar">' +
      '<button class="btn btn-ghost" onclick="zurUebersicht()">← Zur Übersicht</button>' +
      '<button class="btn" onclick="zeigeSpick()">📋 Spickzettel</button>' +
    '</div>' +
    '<div class="thema-header">' +
      '<div class="thema-kopf"><h2>' + t.icon + ' Thema ' + t.nr + ': ' + t.titel + '</h2><span class="badge badge-thema">Aufgabe ' + (ansicht.frage + 1) + ' von ' + fs.length + '</span></div>' +
      '<div class="frage-nav">' + nav + '</div>' +
    '</div>' +
    '<div class="frage-card">' +
      '<div class="frage-head">' +
        '<span><span class="frage-nrchip">Aufgabe ' + (ansicht.frage + 1) + '</span> ' + sterne(q.stufe, maxStufe(t.nr)) + '</span>' +
        '<span class="typ-label">' + TYP_LABEL[q.typ] + '</span>' +
      '</div>' +
      (q.sachverhalt ? '<div class="sachverhalt"><div class="sachverhalt-titel">Sachverhalt</div>' + q.sachverhalt + '</div>' : '') +
      '<div class="frage-text">' + q.frage + '</div>' +
      inhalt +
      '<div class="frage-actions">' +
        (!st.korrekt ? '<button class="btn btn-primary" onclick="pruefen()">Prüfen</button>' : '') +
        (!st.loesungOffen ? '<button class="btn" onclick="zeigeLoesung()">Lösung anzeigen</button>' : '') +
        (!st.korrekt ? '<button class="btn btn-ghost" onclick="frageZuruecksetzen()">Eingaben zurücksetzen</button>' : '') +
        (fertig ? weiter : '') +
      '</div>' +
      feedback +
      loesung +
      artBadges(q.artikel) +
    '</div>' +
    '<div class="frage-actions" style="justify-content:space-between">' +
      (ansicht.frage > 0 ? '<button class="btn" onclick="geheZuFrage(' + (ansicht.frage - 1) + ')">← Vorherige</button>' : '<span></span>') +
      (ansicht.frage < fs.length - 1 ? '<button class="btn" onclick="geheZuFrage(' + (ansicht.frage + 1) + ')">Nächste →</button>' : '') +
    '</div>';
}

function zurUebersicht() { ansicht = { seite: 'home', thema: 1, frage: 0 }; render(); }
function geheZuFrage(i) { ansicht.frage = i; render(); window.scrollTo(0, 0); }

/* ---------- UI-Bausteine pro Aufgabentyp ---------- */
function uiMC(q, st) {
  return '<div class="mc-liste">' + permFuer(st, q.optionen.length).map(i => {
    const o = q.optionen[i];
    const cls = ['mc-opt'];
    if (st.geprueft || st.korrekt) {
      if (st.korrekt && i === q.richtig) cls.push('mc-ok');
      else if (!st.korrekt && st.sel === i && i !== q.richtig) cls.push('mc-bad');
      else if (st.korrekt && i !== q.richtig) cls.push('mc-dim');
    }
    return '<label class="' + cls.join(' ') + '"><input type="radio" name="mc" ' + (st.sel === i ? 'checked' : '') + (st.korrekt ? ' disabled' : '') + ' onchange="waehleMC(' + i + ')"><span>' + o + '</span></label>';
  }).join('') + '</div>';
}
function waehleMC(i) { const q = aktuelleFrage(); const st = sess(q); st.sel = i; st.geprueft = false; }

function uiMulti(q, st) {
  return '<div class="check-grid">' + permFuer(st, q.optionen.length).map(i => {
    const o = q.optionen[i];
    const cls = ['check-chip'];
    if (st.geprueft || st.korrekt) {
      const soll = q.richtig.includes(i), ist = st.set.has(i);
      if (ist && soll) cls.push('chip-ok');
      else if (ist && !soll) cls.push('chip-bad');
      else if (!ist && soll) cls.push('chip-fehlt');
    }
    return '<label class="' + cls.join(' ') + '"><input type="checkbox" ' + (st.set.has(i) ? 'checked' : '') + (st.korrekt ? ' disabled' : '') + ' onchange="toggleMulti(' + i + ')"><span>' + o + '</span></label>';
  }).join('') + '</div><p class="hint" style="margin:8px 0 0">Alle zutreffenden Antworten anklicken.</p>';
}
function toggleMulti(i) { const q = aktuelleFrage(); const st = sess(q); if (st.set.has(i)) st.set.delete(i); else st.set.add(i); st.geprueft = false; }

function uiZuordnen(q, st) {
  const zeilen = q.zeilen.map((z, i) => {
    let cls = '';
    if (st.geprueft || st.korrekt) cls = (st.zuord[i] === z.rechts) ? 'row-ok' : 'row-bad';
    const opts = ['<option value="">– bitte wählen –</option>'].concat(
      q.optionen.map(o => '<option value="' + esc(o) + '" ' + (st.zuord[i] === o ? 'selected' : '') + '>' + o + '</option>')
    ).join('');
    return '<tr class="' + cls + '"><td class="zeile-links">' + z.links + '</td><td><select ' + (st.korrekt ? 'disabled' : '') + ' onchange="waehleZuord(' + i + ', this.value)">' + opts + '</select></td></tr>';
  }).join('');
  return '<table class="aufgabe-tabelle"><thead><tr><th>Sachverhalt / Aussage</th><th>Zuordnung</th></tr></thead><tbody>' + zeilen + '</tbody></table>';
}
function waehleZuord(i, v) { const q = aktuelleFrage(); const st = sess(q); st.zuord[i] = v; st.geprueft = false; }

function uiReihenfolge(q, st) {
  const anzeige = q.anzeige || q.items.map((_, i) => i);
  return '<p class="hint" style="margin:0 0 10px">Klicke die Einträge in der richtigen Reihenfolge an (1., 2., 3., …). Erneutes Klicken entfernt die Nummer.</p>' +
    '<div class="reihe-liste">' + anzeige.map(idx => {
      const pos = st.ordnung.indexOf(idx);
      const cls = ['reihe-item'];
      if (pos >= 0) cls.push('gewaehlt');
      if ((st.geprueft || st.korrekt) && pos >= 0) cls.push(pos === idx ? 'reihe-ok' : 'reihe-bad');
      return '<button class="' + cls.join(' ') + '" ' + (st.korrekt ? 'disabled' : '') + ' onclick="klickReihe(' + idx + ')"><span class="reihe-num">' + (pos >= 0 ? (pos + 1) + '.' : '') + '</span><span>' + q.items[idx] + '</span></button>';
    }).join('') + '</div>';
}
function klickReihe(idx) {
  const q = aktuelleFrage(); const st = sess(q);
  const pos = st.ordnung.indexOf(idx);
  if (pos >= 0) st.ordnung.splice(pos, 1); else st.ordnung.push(idx);
  st.geprueft = false;
  render();
}

function aktuelleFrage() { return fragenZu(ansicht.thema)[ansicht.frage]; }

/* ---------- Prüfen & Lösung ---------- */
function pruefen() {
  const q = aktuelleFrage(); const st = sess(q);
  let ok = false;

  if (q.typ === 'mc') {
    if (st.sel === null) { st.fbText = 'wähle zuerst eine Antwort aus.'; st.geprueft = true; render(); return; }
    ok = st.sel === q.richtig;
    st.fbText = 'die gewählte Antwort stimmt nicht. Überlege nochmals oder schau die Lösung an.';
  } else if (q.typ === 'multi') {
    const soll = new Set(q.richtig);
    const richtigGewaehlt = [...st.set].filter(i => soll.has(i)).length;
    const falschGewaehlt = [...st.set].filter(i => !soll.has(i)).length;
    ok = richtigGewaehlt === soll.size && falschGewaehlt === 0;
    st.fbText = richtigGewaehlt + ' von ' + soll.size + ' richtigen Antworten gewählt' + (falschGewaehlt ? ', ' + falschGewaehlt + ' falsche dabei' : '') + '.';
  } else if (q.typ === 'zuordnen') {
    const treffer = q.zeilen.filter((z, i) => st.zuord[i] === z.rechts).length;
    ok = treffer === q.zeilen.length;
    st.fbText = treffer + ' von ' + q.zeilen.length + ' Zuordnungen stimmen.';
  } else if (q.typ === 'reihenfolge') {
    if (st.ordnung.length < q.items.length) { st.fbText = 'nummeriere zuerst alle Einträge (' + st.ordnung.length + ' von ' + q.items.length + ').'; st.geprueft = true; render(); return; }
    const treffer = st.ordnung.filter((idx, pos) => idx === pos).length;
    ok = treffer === q.items.length;
    st.fbText = treffer + ' von ' + q.items.length + ' Positionen stimmen.';
  }

  st.geprueft = true;
  if (ok) {
    st.korrekt = true;
    const neu = st.hilfe ? 'hilfe' : 'geloest';
    if (store.status[q.id] !== 'geloest' || neu === 'geloest') store.status[q.id] = neu;
    speichern();
  }
  render();
}

function zeigeLoesung() {
  const q = aktuelleFrage(); const st = sess(q);
  if (!st.korrekt) st.hilfe = true;
  st.loesungOffen = true;
  render();
}

function loesungsInhalt(q) {
  if (q.typ === 'mc') return '<p><b>Richtige Antwort:</b> ' + q.optionen[q.richtig] + '</p>';
  if (q.typ === 'multi') return '<p><b>Richtige Antworten:</b></p><ul>' + q.richtig.map(i => '<li>' + q.optionen[i] + '</li>').join('') + '</ul>';
  if (q.typ === 'zuordnen') return '<p><b>Richtige Zuordnung:</b></p><ul>' + q.zeilen.map(z => '<li>' + z.links + ' → <b>' + z.rechts + '</b></li>').join('') + '</ul>';
  if (q.typ === 'reihenfolge') return '<p><b>Richtige Reihenfolge:</b></p><ol>' + q.items.map(t => '<li>' + t + '</li>').join('') + '</ol>';
  return '';
}

function frageZuruecksetzen() {
  const q = aktuelleFrage();
  delete session[q.id];
  render();
}

/* ---------- Bedienung auf dem Handy: Gesetzestext antippen ---------- */
(function () {
  var popup = null, aktiv = null;

  function zu() {
    if (popup) popup.hidden = true;
    if (aktiv) aktiv.classList.remove('art-offen');
    aktiv = null;
  }

  function holePopup() {
    if (!popup) {
      popup = document.createElement('div');
      popup.className = 'gesetz-popup';
      popup.hidden = true;
      popup.innerHTML = '<button type="button" class="gesetz-popup-zu" aria-label="Schliessen">&#10005;</button><b></b><div></div>';
      popup.querySelector('.gesetz-popup-zu').addEventListener('click', zu);
      document.body.appendChild(popup);
    }
    return popup;
  }

  /* Text entweder aus dem title-Attribut oder aus dem Gesetzesverzeichnis des Programms */
  function textVon(el) {
    var t = el.getAttribute('title');
    if (t) return t;
    var k = el.textContent.trim();
    try { if (typeof gesetzText === 'function') return gesetzText(k) || ''; } catch (e) {}
    try { if (typeof GESETZ === 'object' && GESETZ) return GESETZ[k] || ''; } catch (e) {}
    return '';
  }

  document.addEventListener('click', function (e) {
    if (!e.target || !e.target.closest) return;
    var el = e.target.closest('.art');
    var text = el ? textVon(el) : '';
    if (!el || !text) {
      if (!e.target.closest('.gesetz-popup')) zu();
      return;
    }
    if (el === aktiv) { zu(); return; }
    zu();
    var p = holePopup();
    p.querySelector('b').textContent = el.textContent.trim();
    p.querySelector('div').textContent = text;
    p.hidden = false;
    el.classList.add('art-offen');
    aktiv = el;
  });

  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') zu(); });
})();
</script>

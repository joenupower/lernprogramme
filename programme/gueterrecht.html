<!DOCTYPE html>
<html lang="de-CH">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Güterrecht – Lernprogramm güterrechtliche Auseinandersetzung</title>
<style>
:root {
  --navy: #1b3a5c;
  --navy-dunkel: #12283f;
  --blau: #2563a8;
  --blau-hell: #e8f0f9;
  --gold: #b8860b;
  --gruen: #15803d;
  --gruen-hell: #ecfdf3;
  --rot: #b91c1c;
  --rot-hell: #fef2f2;
  --grau: #5b6b7b;
  --grau-hell: #f4f6f8;
  --rand: #d7dfe8;
  --schatten: 0 1px 3px rgba(18, 40, 63, .10), 0 4px 14px rgba(18, 40, 63, .06);
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  margin: 0; padding: 0;
  font-family: "Segoe UI", system-ui, -apple-system, Roboto, "Helvetica Neue", sans-serif;
  color: #1d2b3a; background: #eef2f6;
  font-size: 16px; line-height: 1.55;
}
#app { max-width: 1080px; margin: 0 auto; padding: 24px 20px 80px; }
h1 { font-size: 1.7rem; color: var(--navy); margin: 0 0 4px; line-height: 1.25; }
h2 { font-size: 1.2rem; color: var(--navy); margin: 0 0 10px; }
h3 { font-size: 1.05rem; color: var(--navy); margin: 18px 0 8px; }
h4 { font-size: 1rem; color: var(--navy); margin: 16px 0 6px; }

/* ---------- Buttons ---------- */
.btn {
  font: inherit; font-size: .95rem; font-weight: 600;
  padding: 10px 18px; border-radius: 10px; cursor: pointer;
  border: 1.5px solid var(--rand); background: #fff; color: var(--navy);
  transition: all .15s;
}
.btn:hover { border-color: var(--blau); box-shadow: var(--schatten); }
.btn-primary { background: var(--navy); border-color: var(--navy); color: #fff; }
.btn-primary:hover { background: var(--blau); border-color: var(--blau); }
.btn-ghost { border-color: transparent; background: transparent; color: var(--grau); }
.btn-ghost:hover { color: var(--navy); border-color: var(--rand); box-shadow: none; }

/* ---------- Startseite ---------- */
.home-header {
  background: linear-gradient(135deg, var(--navy) 0%, var(--blau) 100%);
  color: #fff; border-radius: 16px; padding: 32px 32px 26px; box-shadow: var(--schatten);
}
.home-header h1 { color: #fff; font-size: 1.9rem; }
.untertitel { margin: 4px 0 20px; opacity: .85; }
.home-stats { display: flex; gap: 28px; margin-bottom: 20px; flex-wrap: wrap; }
.stat { background: rgba(255,255,255,.12); border-radius: 12px; padding: 12px 22px; }
.stat-zahl { font-size: 1.5rem; font-weight: 700; }
.stat-label { font-size: .82rem; opacity: .85; }
.home-actions { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
.home-actions .btn { border-color: rgba(255,255,255,.4); background: rgba(255,255,255,.95); }
.home-actions .btn-primary { background: var(--gold); border-color: var(--gold); color: #fff; }
.home-actions .btn-primary:hover { background: #d09a0c; }
.home-actions .btn-ghost { background: transparent; color: rgba(255,255,255,.8); }
.home-actions .btn-ghost:hover { color: #fff; border-color: rgba(255,255,255,.5); }
.alle-fertig { font-size: 1.1rem; font-weight: 700; }
.hinweis-methodik { color: var(--grau); font-size: .88rem; margin: 16px 4px 20px; }

.case-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(235px, 1fr)); gap: 14px; }
.case-card {
  font: inherit; text-align: left; cursor: pointer;
  background: #fff; border: 1.5px solid var(--rand); border-radius: 14px;
  padding: 16px 16px 14px; transition: all .15s; display: flex; flex-direction: column; gap: 4px;
}
.case-card:hover { border-color: var(--blau); box-shadow: var(--schatten); transform: translateY(-2px); }
.case-nr { font-size: .78rem; font-weight: 700; color: var(--grau); text-transform: uppercase; letter-spacing: .05em; }
.case-titel { font-weight: 700; color: var(--navy); font-size: 1.02rem; line-height: 1.3; }
.case-sterne { color: var(--gold); font-size: .95rem; letter-spacing: .1em; }
.stern-leer { color: #d5dbe2; }
.case-status { margin-top: 6px; }

.badge { display: inline-block; font-size: .76rem; font-weight: 700; padding: 3px 10px; border-radius: 999px; }
.badge-done { background: var(--gruen-hell); color: var(--gruen); border: 1px solid #bbe7cb; }
.badge-progress { background: #fff8e6; color: #92640a; border: 1px solid #f0dca4; }
.badge-open { background: var(--grau-hell); color: var(--grau); border: 1px solid var(--rand); }
.badge-aufloesung { background: var(--blau-hell); color: var(--blau); border: 1px solid #c4d8ee; }
.badge-schuld { background: var(--rot-hell); color: var(--rot); border: 1px solid #f3c6c6; }
.badge-forderung { background: var(--blau-hell); color: var(--blau); border: 1px solid #c4d8ee; }

/* ---------- Fallansicht ---------- */
.case-top { display: flex; justify-content: space-between; margin-bottom: 10px; }
.case-header { background: #fff; border-radius: 14px; padding: 20px 24px; box-shadow: var(--schatten); border-left: 6px solid var(--navy); }
.case-kopf { display: flex; justify-content: space-between; gap: 16px; flex-wrap: wrap; align-items: baseline; }
.case-meta { display: flex; gap: 12px; align-items: center; }
.lernziel { margin: 10px 0 0; color: var(--grau); font-size: .95rem; }

.sachverhalt { background: #fffdf5; border: 1.5px solid #ead9a8; border-radius: 14px; padding: 18px 24px; margin-top: 14px; }
.sachverhalt h2 { color: #7c5e10; font-size: 1.02rem; text-transform: uppercase; letter-spacing: .04em; }
.posten-liste { margin: 10px 0 0; padding-left: 22px; }
.posten-liste li { margin-bottom: 5px; }
.hint { color: var(--grau); font-size: .9em; }

/* Lösungsblatt (füllt sich von Phase zu Phase) */
.arbeitsblatt {
  background: #fff; border: 1.5px solid var(--rand); border-left: 6px solid var(--gold);
  border-radius: 14px; margin-top: 14px; box-shadow: var(--schatten);
}
.arbeitsblatt summary {
  cursor: pointer; font-weight: 700; color: var(--navy); padding: 13px 20px;
  list-style: none; user-select: none;
}
.arbeitsblatt summary::-webkit-details-marker { display: none; }
.arbeitsblatt summary::before { content: '▸ '; color: var(--gold); }
.arbeitsblatt[open] summary::before { content: '▾ '; }
.arbeitsblatt summary:hover { color: var(--blau); }
.ab-stand { font-weight: 600; color: var(--grau); font-size: .88rem; }
.ab-inhalt { padding: 0 20px 16px; }
.ab-inhalt h4 { margin: 14px 0 6px; }
.ab-tabelle td, .ab-tabelle th { padding: 7px 9px; font-size: .9rem; }
.ab-leer { color: #b6c2cd; }
.ab-schuld { color: var(--rot); }
.ab-platzhalter { color: var(--grau); font-size: .92rem; margin: 0; }

/* Stepper */
.stepper { display: flex; align-items: center; margin: 20px 0 14px; overflow-x: auto; padding: 4px 2px; }
.step {
  font: inherit; display: flex; flex-direction: column; align-items: center; gap: 5px;
  background: none; border: none; cursor: pointer; min-width: 108px; padding: 6px 4px; border-radius: 10px;
}
.step:disabled { cursor: not-allowed; opacity: .45; }
.step:not(:disabled):hover { background: var(--blau-hell); }
.step-nr {
  width: 34px; height: 34px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
  background: #fff; border: 2px solid var(--rand); font-weight: 700; color: var(--grau);
}
.step-active .step-nr { background: var(--navy); border-color: var(--navy); color: #fff; }
.step-done .step-nr { background: var(--gruen); border-color: var(--gruen); color: #fff; }
.step-label { font-size: .72rem; color: var(--grau); text-align: center; line-height: 1.2; max-width: 120px; }
.step-active .step-label { color: var(--navy); font-weight: 700; }
.step-line { flex: 1; height: 2px; background: var(--rand); min-width: 8px; }

/* Phasen-Karte */
.phase-card { background: #fff; border-radius: 14px; padding: 22px 26px; box-shadow: var(--schatten); }
.phase-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.phase-nr { background: var(--navy); color: #fff; border-radius: 8px; padding: 2px 10px; font-size: .85rem; margin-right: 6px; }
.phase-frage { color: var(--grau); margin: 8px 0 16px; }
.phase-done-banner { background: var(--gruen-hell); color: var(--gruen); border: 1px solid #bbe7cb; border-radius: 10px; padding: 10px 14px; font-weight: 600; margin-bottom: 14px; }

.art {
  display: inline-block; background: var(--blau-hell); color: var(--blau);
  border: 1px solid #c4d8ee; border-radius: 6px; padding: 1px 8px;
  font-size: .8rem; font-weight: 600; cursor: help; white-space: nowrap; margin: 1px 0;
}
.art-zeile { margin-top: 6px; display: flex; flex-wrap: wrap; gap: 4px; }

/* Aufgaben-Tabellen */
.aufgabe-tabelle { width: 100%; border-collapse: collapse; margin: 6px 0 10px; }
.aufgabe-tabelle th {
  text-align: left; font-size: .8rem; text-transform: uppercase; letter-spacing: .04em;
  color: var(--grau); padding: 8px 10px; border-bottom: 2px solid var(--rand);
}
.aufgabe-tabelle td { padding: 10px; border-bottom: 1px solid var(--grau-hell); vertical-align: middle; }
.aufgabe-tabelle tr:last-child td { border-bottom: none; }
.aufgabe-tabelle input[type="text"] {
  font: inherit; padding: 9px 12px; border: 1.5px solid var(--rand); border-radius: 8px;
  width: 170px; max-width: 100%; text-align: right; background: #fff;
}
.aufgabe-tabelle input[type="text"]:focus { outline: none; border-color: var(--blau); box-shadow: 0 0 0 3px rgba(37, 99, 168, .15); }
.aufgabe-tabelle select {
  font: inherit; font-size: .92rem; padding: 9px 10px; border: 1.5px solid var(--rand); border-radius: 8px;
  max-width: 100%; background: #fff;
}
.aufgabe-tabelle select:focus { outline: none; border-color: var(--blau); box-shadow: 0 0 0 3px rgba(37, 99, 168, .15); }
.select-richtung { margin-bottom: 6px; display: block; }
.input-betrag { display: block; }
.zeile-inaktiv td { color: #9aa7b4; }
.inaktiv-info { font-style: italic; font-size: .9rem; }

.row-ok td { background: var(--gruen-hell); }
.row-ok td:first-child { box-shadow: inset 4px 0 0 var(--gruen); }
.row-bad td { background: var(--rot-hell); }
.row-bad td:first-child { box-shadow: inset 4px 0 0 var(--rot); }

.seg { display: flex; flex-wrap: wrap; gap: 6px; }
.seg-opt input { position: absolute; opacity: 0; pointer-events: none; }
.seg-opt span {
  display: inline-block; padding: 7px 13px; border: 1.5px solid var(--rand); border-radius: 999px;
  font-size: .88rem; font-weight: 600; color: var(--grau); cursor: pointer; transition: all .12s; background: #fff;
}
.seg-opt input:checked + span { background: var(--navy); border-color: var(--navy); color: #fff; }
.seg-opt input:focus-visible + span { box-shadow: 0 0 0 3px rgba(37, 99, 168, .3); }
.seg-opt input:disabled + span { cursor: default; opacity: .75; }
.seg-opt span:hover { border-color: var(--blau); }

.sektion { margin-bottom: 18px; }
.sektion-info { color: var(--grau); font-size: .92rem; margin: 4px 0 8px; }
.sektion-memo { background: var(--blau-hell); border-radius: 10px; padding: 12px 16px; }
.sektion-memo ul { margin: 6px 0 0; padding-left: 20px; }
.memo-liste { margin: 4px 0 10px; padding-left: 20px; }

/* Feedback & Lösung */
.phase-actions { display: flex; gap: 10px; margin-top: 8px; flex-wrap: wrap; }
.fb { border-radius: 10px; padding: 12px 16px; font-weight: 600; margin-top: 14px; }
.fb-ok { background: var(--gruen-hell); color: var(--gruen); border: 1px solid #bbe7cb; }
.fb-bad { background: var(--rot-hell); color: var(--rot); border: 1px solid #f3c6c6; }
.fb-info { background: var(--blau-hell); color: var(--blau); border: 1px solid #c4d8ee; }

.solution-box { background: var(--grau-hell); border: 1.5px solid var(--rand); border-radius: 12px; padding: 16px 20px; margin-top: 16px; }
.solution-box > h3 { margin-top: 0; }
.loesung-tabelle { width: 100%; border-collapse: collapse; margin: 8px 0; background: #fff; border-radius: 8px; overflow: hidden; font-size: .93rem; }
.loesung-tabelle th { text-align: left; background: var(--navy); color: #fff; padding: 8px 10px; font-size: .82rem; }
.loesung-tabelle td { padding: 9px 10px; border-bottom: 1px solid var(--grau-hell); vertical-align: top; }
.loesung-tabelle tr:nth-child(even) td { background: #f8fafc; }
.zeile-total td { background: var(--blau-hell) !important; border-top: 2px solid var(--blau); }
.zeile-zwischen td { border-top: 1.5px dashed var(--rand); }
.nowrap { white-space: nowrap; }
.mw-tabelle td, .mw-tabelle th { text-align: right; }
.mw-tabelle td:first-child, .mw-tabelle th:first-child { text-align: left; }
.mw-erkl { font-size: .9rem; color: var(--grau); }
.schutz { cursor: help; }
.massen-tabelle td { font-size: .88rem; }
.mt-scroll { overflow-x: auto; }
.massen-tabelle { min-width: 640px; }
.eg-saldo { color: var(--grau); }
.memo-erkl { font-size: .9rem; color: var(--grau); }

.merkbox {
  background: #fffdf5; border: 1.5px solid #ead9a8; border-left: 5px solid var(--gold);
  border-radius: 10px; padding: 10px 14px; margin-top: 12px; font-size: .93rem;
}
.endbox {
  background: var(--gruen-hell); border: 1.5px solid #bbe7cb; border-left: 5px solid var(--gruen);
  border-radius: 10px; padding: 12px 16px; margin-top: 12px; font-size: 1.02rem;
}
.phase-nav { display: flex; gap: 10px; margin-top: 18px; flex-wrap: wrap; }

/* Abschluss */
.abschluss { text-align: center; padding: 40px 26px; }
.abschluss h2 { font-size: 1.5rem; }
.abschluss-ende { font-size: 1.08rem; }
.abschluss-score { color: var(--grau); }
.abschluss .phase-nav { justify-content: center; margin-top: 24px; }

/* Spickzettel */
dialog#spick-dialog {
  border: none; border-radius: 16px; padding: 0; max-width: 760px; width: calc(100vw - 40px);
  max-height: 85vh; box-shadow: 0 10px 40px rgba(18, 40, 63, .3);
}
dialog#spick-dialog::backdrop { background: rgba(18, 40, 63, .5); }
.spick { padding: 24px 28px; overflow-y: auto; max-height: 85vh; }
.spick-head { display: flex; justify-content: space-between; align-items: center; }
.spick-head h2 { margin: 0; }
.spick-phasen li { margin-bottom: 6px; }
.spick-tabelle { width: 100%; border-collapse: collapse; margin: 6px 0 14px; font-size: .92rem; }
.spick-tabelle td { border: 1px solid var(--rand); padding: 8px 10px; vertical-align: top; }
.spick-tabelle tr:nth-child(even) td { background: var(--grau-hell); }
.spick-liste li { margin-bottom: 4px; }

@media (max-width: 640px) {
  #app { padding: 14px 10px 60px; }
  .phase-card, .case-header { padding: 16px 14px; }
  .aufgabe-tabelle input[type="text"] { width: 130px; }
  .step { min-width: 84px; }
  .step-label { display: none; }
}


/* ---------- Bedienung auf dem Handy ---------- */
html { -webkit-text-size-adjust: 100%; }
.art { cursor: pointer; }
.art.art-offen { background: var(--navy); border-color: var(--navy); color: #fff; }
.gesetz-popup {
  position: fixed; left: 12px; right: 12px; bottom: 12px; z-index: 90;
  max-width: 640px; margin: 0 auto; max-height: 45vh; overflow-y: auto;
  background: #fff; border: 1.5px solid var(--rand); border-left: 5px solid var(--blau);
  border-radius: 12px; padding: 14px 46px 14px 16px;
  box-shadow: 0 6px 28px rgba(18, 40, 63, .28); font-size: .93rem; line-height: 1.5;
}
.gesetz-popup b { display: block; color: var(--navy); margin-bottom: 4px; }
.gesetz-popup-zu {
  position: absolute; top: 7px; right: 8px; border: none; background: transparent;
  font: inherit; font-size: 1.15rem; line-height: 1; color: var(--grau);
  cursor: pointer; padding: 6px 8px;
}
.gesetz-popup-zu:hover { color: var(--navy); }
.modal-box, .spick, .solution-box { overflow-x: auto; }
@media (max-width: 640px) {
  select, .aufgabe-tabelle select { font-size: 16px; }
  .art { padding: 5px 10px; font-size: .82rem; }
}
</style>
</head>
<body>
<div id="app"></div>
<script>
'use strict';
/* ============================================================
   Solver für die güterrechtliche Auseinandersetzung
   (Errungenschaftsbeteiligung, Art. 196 ff. ZGB)
   Berechnet aus einer Falldefinition sämtliche Lösungswerte
   der Phasen 3–6. Läuft in Node (Validierung) und im Browser.
   ============================================================ */

const MASSEN = ['EG_F', 'ER_F', 'ER_M', 'EG_M'];
const MASSE_LABEL = {
  EG_F: 'Eigengut Ehefrau',
  ER_F: 'Errungenschaft Ehefrau',
  ER_M: 'Errungenschaft Ehemann',
  EG_M: 'Eigengut Ehemann',
};
const MASSE_KURZ = { EG_F: 'EG F', ER_F: 'ER F', ER_M: 'ER M', EG_M: 'EG M' };

function gatte(masse) { return masse.endsWith('_F') ? 'F' : 'M'; }

function chf(n) {
  const neg = n < 0;
  const s = Math.round(Math.abs(n)).toString().replace(/\B(?=(\d{3})+(?!\d))/g, "'");
  return (neg ? '–' : '') + s;
}

/*
Falldefinition (pro Posten):
  id, name           – Bezeichnung
  owner              – Phase 1: 'F' | 'M' | 'MF' | 'NONE'
  masse              – Phase 2: 'EG_F'|'ER_F'|'ER_M'|'EG_M'|'MIT_ER'|'NONE'
                       (MIT_ER = Miteigentum, je ½ in beide Errungenschaften)
  phase2Label        – abweichender Lösungstext für Phase 2 (optional)
  wert               – massgeblicher Wert (Lösung Phase 3); bei Schuld: Schuldbetrag (positiv)
  schuld             – true: Passivum (wird von der Masse abgezogen)
  bewertbar          – false: in Phase 3 keine Eingabe (z. B. Gelegenheitsgeschenke)
  nurForderung       – true: kein Eintrag in der Massentabelle (nur Merkposten/Phase 6)
  phase6             – {glaeubiger:'F'|'M', betrag, art, grund}: Forderung zwischen den
                       Ehegatten, wird erst in Phase 6 verrechnet (Kursmethode)
  hinzurechnung      – {ziel:'ER_M'|'ER_F', betrag?}: Hinzurechnung nach Art. 208 ZGB
  keineHinzurechnung – {zielFrage:'ER_M'|'ER_F'}: Distraktor, korrekte Hinzurechnung = 0
  mehrwert           – {beitraege:[{masse, betrag}], endwert, hauptmasse}:
                       Finanzierung aus mehreren Massen; Solver verteilt
                       Mehr-/Minderwert nach Art. 206 / 209 Abs. 3 ZGB
  why1, why2, why3   – Erklärungstexte, art2/art3 – Gesetzesartikel
*/

function solveMehrwert(p) {
  const mw = p.mehrwert;
  const basis = mw.beitraege.reduce((s, b) => s + b.betrag, 0);
  const faktor = mw.endwert / basis;
  const eigentuemer = gatte(mw.hauptmasse);
  let rows;
  if (faktor >= 1) {
    rows = mw.beitraege.map(b => ({ masse: b.masse, beitrag: b.betrag, anteil: b.betrag * faktor, geschuetzt: false }));
  } else {
    // Minderwert: Massen des anderen Ehegatten sind nach Art. 206 Abs. 1 ZGB
    // geschützt (mindestens Nennwert); den Verlust tragen die Massen des
    // Eigentümer-Ehegatten im Verhältnis ihrer Beiträge (Art. 209 Abs. 3 ZGB).
    const eigene = mw.beitraege.filter(b => gatte(b.masse) === eigentuemer);
    const fremde = mw.beitraege.filter(b => gatte(b.masse) !== eigentuemer);
    const fremdNennwert = fremde.reduce((s, b) => s + b.betrag, 0);
    const rest = mw.endwert - fremdNennwert;
    const eigBasis = eigene.reduce((s, b) => s + b.betrag, 0);
    rows = mw.beitraege.map(b => gatte(b.masse) !== eigentuemer
      ? { masse: b.masse, beitrag: b.betrag, anteil: b.betrag, geschuetzt: true }
      : { masse: b.masse, beitrag: b.betrag, anteil: rest * b.betrag / eigBasis, geschuetzt: false });
  }
  return { rows, basis, faktor };
}

function artFuerBeitrag(row, hauptmasse, faktor) {
  const eigentuemer = gatte(hauptmasse);
  if (gatte(row.masse) !== eigentuemer) return 'Art. 206 Abs. 1 ZGB';
  if (faktor === 1) return 'Art. 209 Abs. 1 ZGB';
  return 'Art. 209 Abs. 3 ZGB';
}

function solveCase(c) {
  const pos = { EG_F: [], ER_F: [], ER_M: [], EG_M: [] };
  const memo = [];           // Phase-6-Forderungen zwischen den Ehegatten
  const mehrwerte = [];      // Daten für Phase-4-Eingaben (Anteile)
  const hinzurechnungen = [];// Daten für Phase-4-Eingaben (Art. 208), inkl. Distraktoren

  for (const p of c.posten) {
    if (p.phase6) {
      memo.push({
        postenId: p.id, label: p.phase6.grund || p.name,
        glaeubiger: p.phase6.glaeubiger, betrag: p.phase6.betrag,
        art: p.phase6.art || 'Art. 209 Abs. 1 ZGB',
      });
    }
    if (p.mehrwert) {
      const { rows, basis, faktor } = solveMehrwert(p);
      let fremdSum = 0;
      for (const r of rows) {
        if (r.masse === p.mehrwert.hauptmasse) continue;
        fremdSum += r.anteil;
        const art = artFuerBeitrag(r, p.mehrwert.hauptmasse, faktor);
        pos[r.masse].push({ label: `${p.name}: Anteil (${art})`, betrag: r.anteil });
        if (gatte(r.masse) !== gatte(p.mehrwert.hauptmasse)) {
          memo.push({
            postenId: p.id,
            label: `${p.name}: Anteil ${MASSE_LABEL[r.masse]}`,
            glaeubiger: gatte(r.masse), betrag: r.anteil, art,
          });
        }
      }
      const eigenAnteil = p.mehrwert.endwert - fremdSum;
      pos[p.mehrwert.hauptmasse].push({
        label: `${p.name}: Wert CHF ${chf(p.mehrwert.endwert)} ./. Anteile der übrigen Massen`,
        betrag: eigenAnteil,
      });
      mehrwerte.push({
        postenId: p.id, name: p.name, rows, basis, faktor,
        endwert: p.mehrwert.endwert, hauptmasse: p.mehrwert.hauptmasse,
      });
      continue;
    }
    if (p.hinzurechnung) {
      const betrag = p.hinzurechnung.betrag != null ? p.hinzurechnung.betrag : p.wert;
      pos[p.hinzurechnung.ziel].push({ label: `${p.name}: Hinzurechnung (Art. 208 ZGB)`, betrag });
      hinzurechnungen.push({ postenId: p.id, name: p.name, ziel: p.hinzurechnung.ziel, betrag });
      continue;
    }
    if (p.keineHinzurechnung) {
      hinzurechnungen.push({ postenId: p.id, name: p.name, ziel: p.keineHinzurechnung.zielFrage, betrag: 0 });
      continue;
    }
    if (p.nurForderung || p.masse === 'NONE' || !p.masse) continue;

    const w = p.schuld ? -p.wert : p.wert;
    if (p.masse === 'MIT_ER') {
      pos.ER_F.push({ label: `${p.name} (½ Miteigentum)`, betrag: w / 2 });
      pos.ER_M.push({ label: `${p.name} (½ Miteigentum)`, betrag: w / 2 });
    } else {
      pos[p.masse].push({ label: p.name, betrag: w });
    }
  }

  const saldo = {};
  for (const m of MASSEN) saldo[m] = pos[m].reduce((s, x) => s + x.betrag, 0);

  const vorschlagM = Math.max(0, saldo.ER_M);
  const vorschlagF = Math.max(0, saldo.ER_F);
  const rueckschlagM = saldo.ER_M < 0;
  const rueckschlagF = saldo.ER_F < 0;
  const anspruchF = vorschlagM / 2;   // Ehefrau erhält ½ des Vorschlags des Ehemannes
  const anspruchM = vorschlagF / 2;   // Ehemann erhält ½ des Vorschlags der Ehefrau
  const nettoAnF = anspruchF - anspruchM;            // > 0: Ehemann zahlt Ehefrau
  const forderungenAnF = memo.reduce((s, x) => s + (x.glaeubiger === 'F' ? x.betrag : -x.betrag), 0);
  const endAnF = nettoAnF + forderungenAnF;

  return {
    pos, memo, mehrwerte, hinzurechnungen, saldo,
    vorschlagM, vorschlagF, rueckschlagM, rueckschlagF,
    anspruchM, anspruchF, nettoAnF, forderungenAnF, endAnF,
  };
}

function gesetzText(artikel) {
  let key = artikel.replace(/\s*ZGB\s*$/, '').trim();
  if (GESETZ[key]) return GESETZ[key];
  const keys = Object.keys(GESETZ).sort((a, b) => b.length - a.length);
  for (const k of keys) if (key.startsWith(k)) return GESETZ[k];
  return '';
}

function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;'); }

function parseNum(str) {
  if (str == null) return NaN;
  let s = String(str).trim();
  if (s === '') return NaN;
  s = s.replace(/chf/i, '').trim();
  s = s.replace(/[\s'’`´ ]/g, '');
  s = s.replace(/–|−/g, '-');
  if (/^-?\d{1,3}(\.\d{3})+$/.test(s)) s = s.replace(/\./g, '');       // 1.000.000 → Tausenderpunkte
  s = s.replace(',', '.');
  if (/^-?\d+\.00?$/.test(s)) s = s.replace(/\.\d+$/, '');             // 500.00 → 500
  const n = Number(s);
  return n;
}

function sterne(stufe) { return '★'.repeat(stufe) + '<span class="stern-leer">' + '★'.repeat(5 - stufe) + '</span>'; }

function artBadges(arr) {

  return arr.map(a => `<span class="art" title="${esc(gesetzText(a))}">${esc(a)}</span>`).join(' ');

const LS_KEY = 'gueterrecht-lernprogramm-v1';
let store = { cases: {}, last: null };
try { const raw = localStorage.getItem(LS_KEY); if (raw) store = JSON.parse(raw); } catch (e) {}
function save() { try { localStorage.setItem(LS_KEY, JSON.stringify(store)); } catch (e) {} }
function caseProg(id) {
  if (!store.cases[id]) store.cases[id] = { phases: {} };
  return store.cases[id];
}
function phaseDone(id, n) { const p = caseProg(id).phases[n]; return !!(p && p.done); }
function caseDone(id) { for (let n = 1; n <= 6; n++) if (!phaseDone(id, n)) return false; return true; }
function caseScore(id) {
  const cp = caseProg(id); let c = 0, t = 0;
  for (let n = 1; n <= 6; n++) { const p = cp.phases[n]; if (p && p.tried) { c += p.correct; t += p.total; } }
  return t ? { c, t, pct: Math.round(100 * c / t) } : null;
}

  for (let i = 0; i < maxRows; i++) {
    mt += '<tr>' + spalten.map(m => {
      const e = s.pos[m][i];
      return `<td>${e ? `${esc(e.label)}: <span class="nowrap">${e.betrag < 0 ? '−' : ''}${chf(Math.abs(e.betrag))}</span>` : ''}</td>`;
    }).join('') + '</tr>';
  }
  mt += `<tr class="zeile-total">${spalten.map(m => {
    const er = m.startsWith('ER');
    return `<td>${er ? `<b>Saldo: ${chf(s.saldo[m])}</b>` : `<span class="eg-saldo">Bestand: ${chf(s.saldo[m])}</span>`}</td>`;
  }).join('')}</tr>`;
  mt += `</tbody></table></div>`;
  if (s.memo.length) {
    mt += `<p class="memo-erkl"><b>Merkposten (nicht in den Salden):</b> ${s.memo.map(m => `${esc(m.label)} – CHF ${chf(m.betrag)} zugunsten ${gatteName(c, m.glaeubiger)}`).join('; ')}. Diese Forderungen zwischen den Ehegatten werden erst in Phase 6 verrechnet.</p>`;
  }
  return mt;
}

function vorschlagKompaktHtml() {
  const { c, s } = cur;
  const em = gatteName(c, 'M');
  const ausgleich = s.nettoAnF === 0 ? 'Die Ansprüche decken sich – keine Zahlung.'
    : (s.nettoAnF > 0 ? `${em} zahlt der Ehefrau CHF ${chf(s.nettoAnF)}.`
      : `Die Ehefrau zahlt ${c.erbenM ? 'den Erben' : 'dem Ehemann'} CHF ${chf(-s.nettoAnF)}.`);
  return `<table class="loesung-tabelle"><tbody>
    <tr><td>Vorschlag ${em}</td><td class="nowrap"><b>CHF ${chf(s.vorschlagM)}</b>${s.rueckschlagM ? ` <span class="hint">(Rückschlag ${chf(s.saldo.ER_M)} → 0)</span>` : ''}</td>
        <td>Vorschlag Ehefrau</td><td class="nowrap"><b>CHF ${chf(s.vorschlagF)}</b>${s.rueckschlagF ? ` <span class="hint">(Rückschlag ${chf(s.saldo.ER_F)} → 0)</span>` : ''}</td></tr>
    <tr><td>Anspruch Ehefrau (½ × ${chf(s.vorschlagM)})</td><td class="nowrap"><b>CHF ${chf(s.anspruchF)}</b></td>
        <td>Anspruch ${em} (½ × ${chf(s.vorschlagF)})</td><td class="nowrap"><b>CHF ${chf(s.anspruchM)}</b></td></tr>
    <tr class="zeile-total"><td colspan="4"><b>Ausgleich der Vorschlagsbeteiligung: ${ausgleich}</b></td></tr>
  </tbody></table>`;
}

function verrechnungTabelleHtml() {
  const { c, s } = cur;
  let rows = '';
  if (s.memo.length) {
    rows += s.memo.map(m => `<tr><td>${esc(m.label)} ${m.art ? artBadges([m.art]) : ''}</td>
      <td class="nowrap">${m.glaeubiger === 'F' ? '+' : '−'} CHF ${chf(m.betrag)}</td></tr>`).join('');
    rows += `<tr class="zeile-zwischen"><td><i>Zwischentotal gegenseitige Forderungen</i></td><td class="nowrap"><i>${s.forderungenAnF >= 0 ? '+' : '−'} CHF ${chf(Math.abs(s.forderungenAnF))}</i></td></tr>`;
  }
  rows += `<tr><td>Vorschlagsbeteiligung (Phase 5)</td><td class="nowrap">${s.nettoAnF >= 0 ? '+' : '−'} CHF ${chf(Math.abs(s.nettoAnF))}</td></tr>`;
  rows += `<tr class="zeile-total"><td><b>Forderung aus güterrechtlicher Auseinandersetzung</b></td><td class="nowrap"><b>${s.endAnF >= 0 ? '' : '−'} CHF ${chf(Math.abs(s.endAnF))}</b></td></tr>`;
  return `<p class="sektion-info">Vorzeichen aus Sicht der Ehefrau: + = zu ihren Gunsten, − = zu ihren Lasten.</p>
    <table class="loesung-tabelle"><tbody>${rows}</tbody></table>`;
}

function arbeitsblattHtml() {
  const { c } = cur;
  const d = n => phaseDone(c.id, n);
  let stand = 0;
  for (let n = 1; n <= 6; n++) { if (d(n)) stand = n; else break; }
  let inner;
  if (stand === 0) {
    inner = '<p class="ab-platzhalter">Hier füllt sich Ihr Lösungsblatt automatisch, sobald Sie eine Phase geprüft haben – beim Weiterrechnen haben Sie so alle bisherigen Ergebnisse stets vor Augen.</p>';
  } else {
    inner = `<table class="loesung-tabelle ab-tabelle"><thead><tr><th>Vermögenswert</th><th>1 · Wem?</th><th>2 · Gütermasse</th><th>3 · Wert</th></tr></thead><tbody>` +
      c.posten.map(p => {
        const o = OWNER_OPTS.find(x => x.key === p.owner).label;
        const chip = masseChip(p);
        return `<tr><td>${esc(p.name)}</td>
          <td>${d(1) ? o : '<span class="ab-leer">·</span>'}</td>
          <td>${d(2) ? `<span title="${esc(chip.title)}">${esc(chip.txt)}</span>` : '<span class="ab-leer">·</span>'}</td>
          <td class="nowrap">${d(3) ? wertZelle(p) : '<span class="ab-leer">·</span>'}</td></tr>`;
      }).join('') + `</tbody></table>`;
    if (d(4)) inner += `<h4>Massentabelle (Phase 4)</h4>` + massentabelleHtml();
    if (d(5)) inner += `<h4>Vorschlagsbeteiligung (Phase 5)</h4>` + vorschlagKompaktHtml();
    if (d(6)) inner += `<h4>Erfüllung (Phase 6)</h4>` + verrechnungTabelleHtml() +
      `<div class="endbox">🏁 <b>Endergebnis:</b> ${endErgebnisText()}</div>`;
  }
  return `<details class="arbeitsblatt" id="arbeitsblatt" ${abOffen ? 'open' : ''}>
    <summary>📋 Lösungsblatt – bisherige Ergebnisse${stand ? ` <span class="ab-stand">(Stand: Phase ${stand} von 6)</span>` : ''}</summary>
    <div class="ab-inhalt">${inner}</div></details>`;
}

function wireArbeitsblatt() {
  const ab = $('#arbeitsblatt');
  if (ab) ab.addEventListener('toggle', () => { abOffen = ab.open; });
}
function updateArbeitsblatt() {
  const cont = $('#ab-container');
  if (cont) { cont.innerHTML = arbeitsblattHtml(); wireArbeitsblatt(); }
}

/* ---------- Fallansicht ---------- */
let cur = null; // {c, s, phase}

function openCase(id) {
  const c = CASES.find(x => x.id === id);
  cur = { c, s: solveCase(c), phase: 1 };
  for (let n = 1; n <= 6; n++) if (!phaseDone(id, n)) { cur.phase = n; break; }
  if (caseDone(id)) cur.phase = 7;
  store.last = id; save();
  renderCase();
}

function renderCase() {
  const { c, s } = cur;
  const postenListe = c.posten.map((p, i) =>
    `<li><b>${esc(p.name)}</b>${p.hint ? ` – <span class="hint">${esc(p.hint)}</span>` : ''}</li>`).join('');
  const steps = PHASEN.map(ph => {
    const done = phaseDone(c.id, ph.n);
    const active = cur.phase === ph.n;
    const reachable = done || ph.n <= maxReachable(c.id);
    return `<button class="step ${done ? 'step-done' : ''} ${active ? 'step-active' : ''}" data-step="${ph.n}" ${reachable ? '' : 'disabled'} title="${esc(ph.titel)}">
      <span class="step-nr">${done ? '✓' : ph.n}</span><span class="step-label">${esc(ph.titel)}</span></button>`;
  }).join('<span class="step-line"></span>');
  app().innerHTML = `
    <div class="case-top">
      <button class="btn btn-ghost" id="btn-home">← Übersicht</button>
      <button class="btn btn-ghost" id="btn-spick2">📖 Spickzettel</button>
    </div>
    <header class="case-header">
      <div class="case-kopf">
        <h1>Fall ${c.id}: ${esc(c.titel)}</h1>
        <div class="case-meta"><span class="case-sterne">${sterne(c.stufe)}</span> <span class="badge badge-aufloesung">Auflösungsgrund: ${esc(c.aufloesung)}</span></div>
      </div>
      <p class="lernziel"><b>Lernziel:</b> ${c.lernziel}</p>
    </header>
    <section class="sachverhalt">
      <h2>Sachverhalt</h2>
      <p>${c.intro}</p>
      <ol class="posten-liste">${postenListe}</ol>
    </section>
    <section id="ab-container">${arbeitsblattHtml()}</section>
    <nav class="stepper">${steps}</nav>
    <section id="phase-panel"></section>
    ${spickzettelHtml()}`;
  $('#btn-home').addEventListener('click', () => { cur = null; renderHome(); });
  $('#btn-spick2').addEventListener('click', () => $('#spick-dialog').showModal());
  wireSpick();
  wireArbeitsblatt();
  app().querySelectorAll('.step:not([disabled])').forEach(el =>
    el.addEventListener('click', () => { cur.phase = +el.dataset.step; renderCase(); }));
  if (cur.phase === 7) renderAbschluss();
  else renderPhase(cur.phase);
  window.scrollTo(0, 0);
}

function maxReachable(id) {
  for (let n = 1; n <= 6; n++) if (!phaseDone(id, n)) return n;
  return 7;
}

/* ---------- Phasen-Rendering ---------- */
function renderPhase(n) {
  const { c } = cur;
  const ph = PHASEN[n - 1];
  const done = phaseDone(c.id, n);
  const panel = $('#phase-panel');
  panel.innerHTML = `
    <div class="phase-card">
      <div class="phase-head">
        <h2><span class="phase-nr">Phase ${n}</span> ${esc(ph.titel)}</h2>
        <span class="art" title="${esc(gesetzText(ph.art))}">${esc(ph.art)}</span>
      </div>
      <p class="phase-frage">${esc(ph.frage)}</p>
      ${done ? '<div class="phase-done-banner">✓ Diese Phase haben Sie bereits gelöst – unten sehen Sie die Musterlösung mit Erklärungen.</div>' : ''}
      <form id="phase-form">${renderInputs(n, done)}</form>
      <div class="phase-actions" id="phase-actions"></div>
      <div id="feedback"></div>
      <div id="solution">${done ? solutionHtml(n) : ''}</div>
      <div class="phase-nav" id="phase-nav">${done ? navButtons(n) : ''}</div>
    </div>`;
  const form = $('#phase-form');
  form.addEventListener('submit', e => { e.preventDefault(); checkPhase(n); });
  if (!done) {
    $('#phase-actions').innerHTML = `<button class="btn btn-primary" id="btn-check">Phase prüfen</button>`;
    $('#btn-check').addEventListener('click', () => checkPhase(n));
  } else {
    form.querySelectorAll('input, select').forEach(el => el.disabled = true);
    wireNav();
  }
}

function navButtons(n) {
  return n < 6
    ? `<button class="btn btn-primary" id="btn-next">Weiter zu Phase ${n + 1} →</button>`
    : `<button class="btn btn-primary" id="btn-next">Fall abschliessen →</button>`;
}
function wireNav() {
  const b = $('#btn-next');
  if (b) b.addEventListener('click', () => { cur.phase++; renderCase(); });
}

/* ---------- Eingabe-Renderer pro Phase ---------- */
function renderInputs(n, done) {
  const { c, s } = cur;
  if (n === 1) {
    return `<table class="aufgabe-tabelle"><thead><tr><th>Vermögenswert</th><th>Zuordnung</th></tr></thead><tbody>` +
      c.posten.map(p => `<tr data-item="${p.id}"><td>${esc(p.name)}</td><td><div class="seg" role="radiogroup">` +
        OWNER_OPTS.map(o => `<label class="seg-opt"><input type="radio" name="p1_${p.id}" value="${o.key}" ${done && p.owner === o.key ? 'checked' : ''}><span>${o.label}</span></label>`).join('') +
        `</div></td></tr>`).join('') + `</tbody></table>`;
  }
  if (n === 2) {
    return `<table class="aufgabe-tabelle"><thead><tr><th>Vermögenswert</th><th>Gütermasse</th></tr></thead><tbody>` +
      c.posten.map(p => {
        const opts = p.p2opts ? shuffled(p.p2opts, p.id) : P2_STD_OPTS;
        const korrekt = p.p2key || p.masse;
        return `<tr data-item="${p.id}"><td>${esc(p.name)}</td><td><select name="p2_${p.id}">` +
          `<option value="">– bitte wählen –</option>` +
          opts.map(o => `<option value="${o.key}" ${done && o.key === korrekt ? 'selected' : ''}>${esc(o.label)}</option>`).join('') +
          `</select></td></tr>`;
      }).join('') + `</tbody></table>`;
  }
  if (n === 3) {
    return `<table class="aufgabe-tabelle"><thead><tr><th>Position</th><th>Massgeblicher Betrag (CHF)</th></tr></thead><tbody>` +
      c.posten.map(p => {
        if (p.bewertbar === false) {
          return `<tr class="zeile-inaktiv"><td>${esc(p.name)}</td><td class="inaktiv-info">keine Bewertung nötig</td></tr>`;
        }
        const badge = p.schuld ? '<span class="badge badge-schuld">Schuld</span> ' : (p.nurForderung ? '<span class="badge badge-forderung">Forderung</span> ' : '');
        return `<tr data-item="${p.id}"><td>${badge}${esc(p.name)}<div class="hint">${esc(p.hint || '')}</div></td>
          <td><input type="text" inputmode="decimal" name="p3_${p.id}" placeholder="CHF" value="${done ? chf(p.wert) : ''}" autocomplete="off"></td></tr>`;
      }).join('') + `</tbody></table>`;
  }
  if (n === 4) {
    let html = '';
    for (const mw of s.mehrwerte) {
      const p = c.posten.find(x => x.id === mw.postenId);
      html += `<div class="sektion"><h3>${mw.faktor === 1 ? 'Ersatzforderung' : (mw.faktor > 1 ? 'Mehrwertanteile' : 'Minderwertanteile')}: ${esc(mw.name)}</h3>
        <p class="sektion-info">Beiträge: ${mw.rows.map(r => `${MASSE_LABEL[r.masse]} CHF ${chf(r.beitrag)}`).join(' · ')} · aktueller Wert: CHF ${chf(mw.endwert)}.<br>
        Berechnen Sie den heutigen Anteil jeder beteiligten Masse (Kontrolle: Alle Anteile ergeben zusammen den aktuellen Wert).</p>
        <table class="aufgabe-tabelle"><thead><tr><th>Beteiligte Masse</th><th>Beitrag</th><th>Anteil heute (CHF)</th></tr></thead><tbody>` +
        mw.rows.map(r => `<tr data-item="mw_${mw.postenId}_${r.masse}"><td>${MASSE_LABEL[r.masse]}</td><td>CHF ${chf(r.beitrag)}</td>
          <td><input type="text" inputmode="decimal" name="p4mw_${mw.postenId}_${r.masse}" placeholder="CHF" value="${done ? chf(r.anteil) : ''}" autocomplete="off"></td></tr>`).join('') +
        `</tbody></table></div>`;
    }
    if (s.hinzurechnungen.length) {
      html += `<div class="sektion"><h3>Hinzurechnung (Art. 208 ZGB)</h3>
        <p class="sektion-info">Welcher Betrag wird der Errungenschaft rechnerisch hinzugerechnet? (0 eingeben, falls keine Hinzurechnung erfolgt.)</p>
        <table class="aufgabe-tabelle"><thead><tr><th>Vorgang</th><th>Hinzurechnung zur ER ${''}</th></tr></thead><tbody>` +
        s.hinzurechnungen.map(hz => `<tr data-item="hz_${hz.postenId}"><td>${esc(hz.name)}<div class="hint">Ziel: ${MASSE_LABEL[hz.ziel]}</div></td>
          <td><input type="text" inputmode="decimal" name="p4hz_${hz.postenId}" placeholder="CHF" value="${done ? chf(hz.betrag) : ''}" autocomplete="off"></td></tr>`).join('') +
        `</tbody></table></div>`;
    }
    if (s.memo.length) {
      html += `<div class="sektion sektion-memo"><h3>Merkposten für Phase 6</h3>
        <p class="sektion-info">Diese Forderungen zwischen den Ehegatten fliessen <b>nicht</b> in die Errungenschafts-Salden ein – sie werden erst in Phase 6 verrechnet:</p>
        <ul>${s.memo.map(m => `<li>${esc(m.label)}: CHF ${chf(m.betrag)} zugunsten ${gatteName(c, m.glaeubiger)} ${m.art ? artBadges([m.art]) : ''}</li>`).join('')}</ul></div>`;
    }
    html += `<div class="sektion"><h3>Salden der Errungenschaften</h3>
      <p class="sektion-info">Stellen Sie die Massentabelle auf und ermitteln Sie den Saldo jeder Errungenschaft (inkl. Anteile, Hinzurechnungen und abzüglich Schulden; negative Salden mit Minuszeichen).</p>
      <table class="aufgabe-tabelle"><tbody>
        <tr data-item="saldo_ER_M"><td>Saldo Errungenschaft ${gatteName(c, 'M')}</td>
          <td><input type="text" inputmode="decimal" name="p4s_ER_M" placeholder="CHF" value="${done ? chf(s.saldo.ER_M) : ''}" autocomplete="off"></td></tr>
        <tr data-item="saldo_ER_F"><td>Saldo Errungenschaft Ehefrau</td>
          <td><input type="text" inputmode="decimal" name="p4s_ER_F" placeholder="CHF" value="${done ? chf(s.saldo.ER_F) : ''}" autocomplete="off"></td></tr>
      </tbody></table></div>`;
    return html;
  }
  if (n === 5) {
    const rows = [
      ['p5_vm', `Vorschlag ${gatteName(c, 'M')}`, s.vorschlagM, 'Aktivsaldo seiner Errungenschaft (Rückschlag → 0)'],
      ['p5_vf', 'Vorschlag Ehefrau', s.vorschlagF, 'Aktivsaldo ihrer Errungenschaft (Rückschlag → 0)'],
      ['p5_af', `Anspruch Ehefrau (½ des Vorschlags ${c.erbenM ? 'des Ehemannes' : 'des Ehemannes'})`, s.anspruchF, ''],
      ['p5_am', `Anspruch ${gatteName(c, 'M')} (½ des Vorschlags der Ehefrau)`, s.anspruchM, ''],
    ];
    return `<table class="aufgabe-tabelle"><tbody>` +
      rows.map(([nm, label, val, sub]) => `<tr data-item="${nm}"><td>${label}${sub ? `<div class="hint">${sub}</div>` : ''}</td>
        <td><input type="text" inputmode="decimal" name="${nm}" placeholder="CHF" value="${cur && phaseDone(c.id, 5) ? chf(val) : ''}" autocomplete="off"></td></tr>`).join('') +
      `<tr data-item="p5_richtung"><td>Ausgleich der Vorschlagsbeteiligung</td><td>
        ${richtungSelect('p5_r', s.nettoAnF, phaseDone(c.id, 5))}
        <input type="text" inputmode="decimal" name="p5_betrag" placeholder="Betrag CHF" value="${phaseDone(c.id, 5) ? chf(Math.abs(s.nettoAnF)) : ''}" autocomplete="off" class="input-betrag"></td></tr>
      </tbody></table>`;
  }
  if (n === 6) {
    let html = '';
    if (s.memo.length) {
      html += `<div class="sektion"><h3>1. Gegenseitige Forderungen (aus den Phasen 2–4)</h3>
        <ul class="memo-liste">${s.memo.map(m => `<li>${esc(m.label)}: CHF ${chf(m.betrag)} zugunsten ${gatteName(c, m.glaeubiger)}</li>`).join('')}</ul>
        <table class="aufgabe-tabelle"><tbody><tr data-item="p6_ford"><td>Saldo dieser Forderungen (ohne Vorschlagsbeteiligung)</td><td>
          ${richtungSelect('p6_fr', s.forderungenAnF, phaseDone(c.id, 6))}
          <input type="text" inputmode="decimal" name="p6_fbetrag" placeholder="Betrag CHF" value="${phaseDone(c.id, 6) ? chf(Math.abs(s.forderungenAnF)) : ''}" autocomplete="off" class="input-betrag"></td></tr></tbody></table></div>`;
    } else {
      html += `<p class="sektion-info">Es bestehen keine weiteren Forderungen zwischen den Ehegatten – massgebend ist allein die Vorschlagsbeteiligung aus Phase 5.</p>`;
    }
    html += `<div class="sektion"><h3>${s.memo.length ? '2. ' : ''}Endergebnis der güterrechtlichen Auseinandersetzung</h3>
      <table class="aufgabe-tabelle"><tbody><tr data-item="p6_ende"><td>Wer bezahlt wem wie viel? (alles verrechnet)</td><td>
        ${richtungSelect('p6_er', s.endAnF, phaseDone(c.id, 6))}
        <input type="text" inputmode="decimal" name="p6_ebetrag" placeholder="Betrag CHF" value="${phaseDone(c.id, 6) ? chf(Math.abs(s.endAnF)) : ''}" autocomplete="off" class="input-betrag"></td></tr></tbody></table></div>`;
    return html;
  }
  return '';
}

function richtungSelect(name, anF, done) {
  const { c } = cur;
  const korrekt = anF > 0 ? 'MF' : (anF < 0 ? 'FM' : 'NONE');
  const opts = [
    ['MF', `${gatteName(c, 'M')} zahlt der Ehefrau`],
    ['FM', `Ehefrau zahlt ${c.erbenM ? 'den Erben des Ehemannes' : 'dem Ehemann'}`],
    ['NONE', 'Niemand schuldet etwas (0)'],
  ];
  return `<select name="${name}" class="select-richtung"><option value="">– Richtung wählen –</option>` +
    opts.map(([k, l]) => `<option value="${k}" ${done && k === korrekt ? 'selected' : ''}>${l}</option>`).join('') + `</select>`;
}

let shuffleCache = {};
function shuffled(arr, key) {
  const k = cur.c.id + '_' + key;
  if (!shuffleCache[k]) {
    const a = arr.slice();
    let seed = 0; for (const ch of k) seed = (seed * 31 + ch.charCodeAt(0)) % 997;
    for (let i = a.length - 1; i > 0; i--) { seed = (seed * 73 + 41) % 1009; const j = seed % (i + 1); [a[i], a[j]] = [a[j], a[i]]; }
    shuffleCache[k] = a;
  }
  return shuffleCache[k];
}

/* ---------- Prüfung ---------- */
function checkPhase(n) {
  const { c, s } = cur;
  const form = $('#phase-form');
  const results = [];
  const mark = (sel, ok) => {
    const row = form.querySelector(`[data-item="${sel}"]`);
    if (row) { row.classList.remove('row-ok', 'row-bad'); row.classList.add(ok ? 'row-ok' : 'row-bad'); }
    results.push(ok);
  };
  const numOk = (name, expected) => {
    const el = form.querySelector(`[name="${name}"]`);
    const v = parseNum(el ? el.value : '');
    return Number.isFinite(v) && Math.abs(v - expected) < 0.5;
  };

  if (n === 1) c.posten.forEach(p => {
    const v = (form.querySelector(`[name="p1_${p.id}"]:checked`) || {}).value;
    mark(p.id, v === p.owner);
  });
  if (n === 2) c.posten.forEach(p => {
    const v = form.querySelector(`[name="p2_${p.id}"]`).value;
    mark(p.id, v === (p.p2key || p.masse));
  });
  if (n === 3) c.posten.forEach(p => {
    if (p.bewertbar === false) return;
    mark(p.id, numOk(`p3_${p.id}`, p.wert));
  });
  if (n === 4) {
    for (const mw of s.mehrwerte) for (const r of mw.rows)
      mark(`mw_${mw.postenId}_${r.masse}`, numOk(`p4mw_${mw.postenId}_${r.masse}`, r.anteil));
    for (const hz of s.hinzurechnungen)
      mark(`hz_${hz.postenId}`, numOk(`p4hz_${hz.postenId}`, hz.betrag));
    mark('saldo_ER_M', numOk('p4s_ER_M', s.saldo.ER_M));
    mark('saldo_ER_F', numOk('p4s_ER_F', s.saldo.ER_F));
  }
  if (n === 5) {
    mark('p5_vm', numOk('p5_vm', s.vorschlagM));
    mark('p5_vf', numOk('p5_vf', s.vorschlagF));
    mark('p5_af', numOk('p5_af', s.anspruchF));
    mark('p5_am', numOk('p5_am', s.anspruchM));
    const r = form.querySelector('[name="p5_r"]').value;
    const korrekt = s.nettoAnF > 0 ? 'MF' : (s.nettoAnF < 0 ? 'FM' : 'NONE');
    mark('p5_richtung', r === korrekt && numOk('p5_betrag', Math.abs(s.nettoAnF)));
  }
  if (n === 6) {
    if (s.memo.length) {
      const r = form.querySelector('[name="p6_fr"]').value;
      const korrekt = s.forderungenAnF > 0 ? 'MF' : (s.forderungenAnF < 0 ? 'FM' : 'NONE');
      mark('p6_ford', r === korrekt && numOk('p6_fbetrag', Math.abs(s.forderungenAnF)));
    }
    const r2 = form.querySelector('[name="p6_er"]').value;
    const korrekt2 = s.endAnF > 0 ? 'MF' : (s.endAnF < 0 ? 'FM' : 'NONE');
    mark('p6_ende', r2 === korrekt2 && numOk('p6_ebetrag', Math.abs(s.endAnF)));
  }

  const correct = results.filter(Boolean).length, total = results.length;
  const cp = caseProg(c.id);
  if (!cp.phases[n] || !cp.phases[n].tried) {
    cp.phases[n] = { tried: true, correct, total, done: false };
  }
  const allOk = correct === total;
  if (allOk) { cp.phases[n].done = true; }
  save();

  const fb = $('#feedback');
  if (allOk) {
    fb.innerHTML = `<div class="fb fb-ok">✓ Alles richtig! ${correct} von ${total} Antworten korrekt.</div>`;
    $('#phase-actions').innerHTML = '';
    $('#solution').innerHTML = solutionHtml(n);
    $('#phase-nav').innerHTML = navButtons(n);
    form.querySelectorAll('input, select').forEach(el => el.disabled = true);
    wireNav();
    updateArbeitsblatt();
  } else {
    fb.innerHTML = `<div class="fb fb-bad">${correct} von ${total} richtig. Die rot markierten Zeilen stimmen noch nicht.</div>`;
    $('#phase-actions').innerHTML = `<button class="btn btn-primary" id="btn-check">Nochmals prüfen</button>
      <button class="btn" id="btn-reveal">Lösung anzeigen</button>`;
    $('#btn-check').addEventListener('click', () => checkPhase(n));
    $('#btn-reveal').addEventListener('click', () => revealPhase(n));
  }
  const target = allOk ? $('#solution') : fb;
  if (target && target.scrollIntoView) target.scrollIntoView({ behavior: 'smooth', block: allOk ? 'start' : 'center' });
}

function revealPhase(n) {
  const { c } = cur;
  const cp = caseProg(c.id);
  if (!cp.phases[n]) cp.phases[n] = { tried: true, correct: 0, total: 1, done: false };
  cp.phases[n].done = true;
  cp.phases[n].revealed = true;
  save();
  renderPhase(n); // rendert im "done"-Modus mit ausgefüllter Musterlösung
  updateArbeitsblatt();
  $('#feedback').innerHTML = `<div class="fb fb-info">Die Musterlösung ist nun eingesetzt – unten finden Sie die Erklärungen.</div>`;
}

/* ---------- Lösungs-/Erklärungsboxen ---------- */
function solutionHtml(n) {
  const { c, s } = cur;
  let inner = '';
  if (n === 1) {
    inner = `<table class="loesung-tabelle"><thead><tr><th>Vermögenswert</th><th>Lösung</th><th>Begründung</th></tr></thead><tbody>` +
      c.posten.map(p => `<tr><td>${esc(p.name)}</td><td class="nowrap"><b>${OWNER_OPTS.find(o => o.key === p.owner).label}</b></td><td>${p.why1}</td></tr>`).join('') +
      `</tbody></table>`;
  }
  if (n === 2) {
    inner = `<table class="loesung-tabelle"><thead><tr><th>Vermögenswert</th><th>Lösung</th><th>Begründung &amp; Gesetzesartikel</th></tr></thead><tbody>` +
      c.posten.map(p => {
        const opts = p.p2opts || P2_STD_OPTS;
        const korrekt = p.p2key || p.masse;
        const lbl = p.phase2Label || (opts.find(o => o.key === korrekt) || {}).label || korrekt;
        return `<tr><td>${esc(p.name)}</td><td><b>${esc(lbl)}</b></td><td>${p.why2}<div class="art-zeile">${artBadges(p.art2)}</div></td></tr>`;
      }).join('') + `</tbody></table>`;
  }
  if (n === 3) {
    inner = `<table class="loesung-tabelle"><thead><tr><th>Position</th><th>Betrag</th><th>Begründung</th></tr></thead><tbody>` +
      c.posten.map(p => {
        if (p.bewertbar === false) return `<tr><td>${esc(p.name)}</td><td class="nowrap">–</td><td>${p.why3 || 'Keine Bewertung nötig.'}</td></tr>`;
        return `<tr><td>${esc(p.name)}</td><td class="nowrap"><b>CHF ${chf(p.wert)}</b>${p.schuld ? ' (Schuld)' : ''}</td><td>${p.why3}<div class="art-zeile">${artBadges(p.art3)}</div></td></tr>`;
      }).join('') + `</tbody></table>
      <div class="merkbox">Grundsatz: Massgebend ist der <b>Verkehrswert</b> im Zeitpunkt der Auseinandersetzung (Art. 211 ZGB) – nicht der frühere Kaufpreis. Konten und Forderungen zum Nennwert.</div>`;
  }
  if (n === 4) {
    for (const mw of s.mehrwerte) {
      const p = c.posten.find(x => x.id === mw.postenId);
      const deltaLabel = mw.faktor > 1 ? 'Mehrwert' : (mw.faktor < 1 ? 'Minderwert' : 'Wertveränderung');
      const delta = mw.endwert - mw.basis;
      inner += `<h4>${esc(mw.name)}: Beiträge ${mw.rows.map(r => chf(r.beitrag)).join(' : ')} · ${deltaLabel} ${delta >= 0 ? '+' : ''}${chf(delta)}</h4>
        <table class="loesung-tabelle mw-tabelle"><thead><tr><th></th>${mw.rows.map(r => `<th>${MASSE_KURZ[r.masse]}</th>`).join('')}<th>Total</th></tr></thead><tbody>
        <tr><td>Beitrag</td>${mw.rows.map(r => `<td>${chf(r.beitrag)}</td>`).join('')}<td>${chf(mw.basis)}</td></tr>
        <tr><td>${deltaLabel} (${delta >= 0 ? '+' : ''}${chf(delta)})</td>${mw.rows.map(r => `<td>${r.anteil - r.beitrag >= 0 ? '+' : ''}${chf(r.anteil - r.beitrag)}${r.geschuetzt ? ' <span class="schutz" title="Art. 206 Abs. 1 ZGB: geschützt – mindestens Nennwert">🛡</span>' : ''}</td>`).join('')}<td>${delta >= 0 ? '+' : ''}${chf(delta)}</td></tr>
        <tr class="zeile-total"><td>Anteil total</td>${mw.rows.map(r => `<td><b>${chf(r.anteil)}</b></td>`).join('')}<td><b>${chf(mw.endwert)}</b></td></tr>
        </tbody></table>`;
      if (mw.faktor < 1 && mw.rows.some(r => r.geschuetzt)) {
        inner += `<p class="mw-erkl">🛡 Der beitragende Ehegatte ist nach Art. 206 Abs. 1 ZGB geschützt: Er erhält mindestens den Nennwert zurück. Den Verlust tragen die Massen des Eigentümer-Ehegatten anteilig (Art. 209 Abs. 3 ZGB).</p>`;
      }
    }
    inner += `<h4>Massentabelle</h4>` + massentabelleHtml();
    if (s.hinzurechnungen.length) {
      inner += `<h4>Hinzurechnung (Art. 208 ZGB)</h4><ul>` + s.hinzurechnungen.map(hz =>
        hz.betrag > 0
          ? `<li>${esc(hz.name)}: <b>CHF ${chf(hz.betrag)}</b> werden der ${MASSE_LABEL[hz.ziel]} rechnerisch hinzugerechnet.</li>`
          : `<li>${esc(hz.name)}: <b>keine Hinzurechnung (CHF 0)</b> – übliche Gelegenheitsgeschenke sind ausgenommen (Art. 208 Abs. 1 Ziff. 1 ZGB).</li>`).join('') + `</ul>`;
    }
    if (c.note4) inner += `<div class="merkbox">${c.note4}</div>`;
  }
  if (n === 5) {
    const em = gatteName(c, 'M');
    inner = `<table class="loesung-tabelle"><tbody>
      <tr><td>Vorschlag ${em}</td><td class="nowrap"><b>CHF ${chf(s.vorschlagM)}</b></td>
        <td>${s.rueckschlagM ? `Saldo der Errungenschaft: CHF ${chf(s.saldo.ER_M)} → <b>Rückschlag</b>, wird nicht berücksichtigt → Vorschlag 0 (Art. 210 Abs. 2 ZGB).` : 'Aktivsaldo seiner Errungenschaft (Art. 210 Abs. 1 ZGB).'}</td></tr>
      <tr><td>Vorschlag Ehefrau</td><td class="nowrap"><b>CHF ${chf(s.vorschlagF)}</b></td>
        <td>${s.rueckschlagF ? `Saldo der Errungenschaft: CHF ${chf(s.saldo.ER_F)} → <b>Rückschlag</b>, wird nicht berücksichtigt → Vorschlag 0 (Art. 210 Abs. 2 ZGB).` : 'Aktivsaldo ihrer Errungenschaft (Art. 210 Abs. 1 ZGB).'}</td></tr>
      <tr><td>Anspruch Ehefrau</td><td class="nowrap"><b>CHF ${chf(s.anspruchF)}</b></td><td>½ des Vorschlags des Ehemannes: ${chf(s.vorschlagM)} : 2 (Art. 215 Abs. 1 ZGB).</td></tr>
      <tr><td>Anspruch ${em}</td><td class="nowrap"><b>CHF ${chf(s.anspruchM)}</b></td><td>½ des Vorschlags der Ehefrau: ${chf(s.vorschlagF)} : 2 (Art. 215 Abs. 1 ZGB).</td></tr>
      <tr class="zeile-total"><td>Ausgleich</td><td class="nowrap"><b>${s.nettoAnF === 0 ? 'CHF 0' : 'CHF ' + chf(Math.abs(s.nettoAnF))}</b></td>
        <td>${s.nettoAnF === 0 ? 'Die Ansprüche decken sich – niemand schuldet etwas.' : `${chf(Math.max(s.anspruchF, s.anspruchM))} − ${chf(Math.min(s.anspruchF, s.anspruchM))} = ${chf(Math.abs(s.nettoAnF))} – ${s.nettoAnF > 0 ? `${em} zahlt der Ehefrau` : `die Ehefrau zahlt ${c.erbenM ? 'den Erben' : 'dem Ehemann'}`} (Verrechnung der gegenseitigen Beteiligungsforderungen).`}</td></tr>
    </tbody></table>
    <div class="merkbox">Schneller Weg: (Vorschlag ${em} − Vorschlag Ehefrau) : 2 = (${chf(s.vorschlagM)} − ${chf(s.vorschlagF)}) : 2 = ${chf((s.vorschlagM - s.vorschlagF) / 2)} ${s.nettoAnF > 0 ? 'zugunsten der Ehefrau' : (s.nettoAnF < 0 ? 'zugunsten des Ehemannes' : '– keine Zahlung')}.</div>`;
    if (c.note5) inner += `<div class="merkbox">${c.note5}</div>`;
  }
  if (n === 6) {
    inner = verrechnungTabelleHtml() + `<div class="endbox">🏁 <b>Endergebnis:</b> ${endErgebnisText()}</div>`;
    if (c.note6) inner += `<div class="merkbox">${c.note6}</div>`;
    inner += `<div class="merkbox">Zur Erfüllung: Jeder behält seine Gegenstände; der Ausgleich erfolgt in Geld. Würde die sofortige Zahlung den verpflichteten Ehegatten in ernstliche Schwierigkeiten bringen, kann er Zahlungsfristen verlangen (Art. 218 ZGB).</div>`;
  }
  return `<div class="solution-box"><h3>Lösung &amp; Erklärung</h3>${inner}</div>`;
}

/* ---------- Abschluss ---------- */
function renderAbschluss() {
  const { c, s } = cur;
  const sc = caseScore(c.id);
  const endTxt = endErgebnisText();
  const next = CASES.find(x => x.id > c.id);
  $('#phase-panel').innerHTML = `
    <div class="phase-card abschluss">
      <h2>🎉 Fall ${c.id} abgeschlossen!</h2>
      <p class="abschluss-ende"><b>Endergebnis:</b> ${endTxt}</p>
      ${sc ? `<p class="abschluss-score">Ihre Trefferquote (jeweils 1. Prüfversuch): <b>${sc.c} von ${sc.t}</b> Antworten (${sc.pct}%).</p>` : ''}
      <div class="phase-nav">
        <button class="btn" id="btn-repeat">Fall nochmals üben</button>
        ${next ? `<button class="btn btn-primary" id="btn-nextcase">Nächster Fall: ${next.id} – ${esc(next.titel)} →</button>` : ''}
        <button class="btn" id="btn-home2">Zur Übersicht</button>
      </div>
    </div>`;
  $('#btn-home2').addEventListener('click', () => { cur = null; renderHome(); });
  $('#btn-repeat').addEventListener('click', () => {
    delete store.cases[c.id]; save(); openCase(c.id);
  });
  if (next) $('#btn-nextcase').addEventListener('click', () => openCase(next.id));
}

/* ---------- Start ---------- */
renderHome();


/* ---------- Bedienung auf dem Handy: Gesetzestext antippen ---------- */
(function () {
  var popup = null, aktiv = null;

  function zu() {
    if (popup) popup.hidden = true;
    if (aktiv) aktiv.classList.remove('art-offen');
    aktiv = null;
  }

  function holePopup() {
    if (!popup) {
      popup = document.createElement('div');
      popup.className = 'gesetz-popup';
      popup.hidden = true;
      popup.innerHTML = '<button type="button" class="gesetz-popup-zu" aria-label="Schliessen">&#10005;</button><b></b><div></div>';
      popup.querySelector('.gesetz-popup-zu').addEventListener('click', zu);
      document.body.appendChild(popup);
    }
    return popup;
  }

  /* Text entweder aus dem title-Attribut oder aus dem Gesetzesverzeichnis des Programms */
  function textVon(el) {
    var t = el.getAttribute('title');
    if (t) return t;
    var k = el.textContent.trim();
    try { if (typeof gesetzText === 'function') return gesetzText(k) || ''; } catch (e) {}
    try { if (typeof GESETZ === 'object' && GESETZ) return GESETZ[k] || ''; } catch (e) {}
    return '';
  }

  document.addEventListener('click', function (e) {
    if (!e.target || !e.target.closest) return;
    var el = e.target.closest('.art');
    var text = el ? textVon(el) : '';
    if (!el || !text) {
      if (!e.target.closest('.gesetz-popup')) zu();
      return;
    }
    if (el === aktiv) { zu(); return; }
    zu();
    var p = holePopup();
    p.querySelector('b').textContent = el.textContent.trim();
    p.querySelector('div').textContent = text;
    p.hidden = false;
    el.classList.add('art-offen');
    aktiv = el;
  });

  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') zu(); });
})();
</script>

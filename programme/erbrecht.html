<!DOCTYPE html>
<html lang="de-CH">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Erbrecht – Lernprogramm gesetzliche Erbfolge, Pflichtteile &amp; Ehegattenbegünstigung</title>
<style>
:root {
  --navy: #1b3a5c;
  --navy-dunkel: #12283f;
  --blau: #2563a8;
  --blau-hell: #e8f0f9;
  --gold: #b8860b;
  --gruen: #15803d;
  --gruen-hell: #ecfdf3;
  --rot: #b91c1c;
  --rot-hell: #fef2f2;
  --grau: #5b6b7b;
  --grau-hell: #f4f6f8;
  --rand: #d7dfe8;
  --schatten: 0 1px 3px rgba(18, 40, 63, .10), 0 4px 14px rgba(18, 40, 63, .06);
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  margin: 0; padding: 0;
  font-family: "Segoe UI", system-ui, -apple-system, Roboto, "Helvetica Neue", sans-serif;
  color: #1d2b3a; background: #eef2f6;
  font-size: 16px; line-height: 1.55;
}
#app { max-width: 1080px; margin: 0 auto; padding: 24px 20px 80px; }
h1 { font-size: 1.7rem; color: var(--navy); margin: 0 0 4px; line-height: 1.25; }
h2 { font-size: 1.2rem; color: var(--navy); margin: 0 0 10px; }
h3 { font-size: 1.05rem; color: var(--navy); margin: 18px 0 8px; }
h4 { font-size: 1rem; color: var(--navy); margin: 16px 0 6px; }

/* ---------- Buttons ---------- */
.btn {
  font: inherit; font-size: .95rem; font-weight: 600;
  padding: 10px 18px; border-radius: 10px; cursor: pointer;
  border: 1.5px solid var(--rand); background: #fff; color: var(--navy);
  transition: all .15s;
}
.btn:hover { border-color: var(--blau); box-shadow: var(--schatten); }
.btn-primary { background: var(--navy); border-color: var(--navy); color: #fff; }
.btn-primary:hover { background: var(--blau); border-color: var(--blau); }
.btn-ghost { border-color: transparent; background: transparent; color: var(--grau); }
.btn-ghost:hover { color: var(--navy); border-color: var(--rand); box-shadow: none; }

/* ---------- Startseite ---------- */
.home-header {
  background: linear-gradient(135deg, var(--navy) 0%, var(--blau) 100%);
  color: #fff; border-radius: 16px; padding: 32px 32px 26px; box-shadow: var(--schatten);
}
.home-header h1 { color: #fff; font-size: 1.9rem; }
.untertitel { margin: 4px 0 20px; opacity: .85; }
.home-stats { display: flex; gap: 28px; margin-bottom: 20px; flex-wrap: wrap; }
.stat { background: rgba(255,255,255,.12); border-radius: 12px; padding: 12px 22px; }
.stat-zahl { font-size: 1.5rem; font-weight: 700; }
.stat-label { font-size: .82rem; opacity: .85; }
.balken { background: rgba(255,255,255,.25); border-radius: 999px; height: 10px; overflow: hidden; margin: 4px 0 18px; }
.balken > div { background: var(--gold); height: 100%; border-radius: 999px; transition: width .3s; }
.home-actions { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
.home-actions .btn { border-color: rgba(255,255,255,.4); background: rgba(255,255,255,.95); }
.home-actions .btn-primary { background: var(--gold); border-color: var(--gold); color: #fff; }
.home-actions .btn-primary:hover { background: #d09a0c; }
.home-actions .btn-ghost { background: transparent; color: rgba(255,255,255,.8); }
.home-actions .btn-ghost:hover { color: #fff; border-color: rgba(255,255,255,.5); }
.alle-fertig { font-size: 1.1rem; font-weight: 700; }
.hinweis-methodik { color: var(--grau); font-size: .88rem; margin: 16px 4px 20px; }

.stufe-kopf { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; margin: 26px 0 4px; }
.stufe-kopf h2 { margin: 0; }
.stufe-zaehler { font-size: .85rem; font-weight: 700; color: var(--grau); background: #fff; border: 1px solid var(--rand); border-radius: 999px; padding: 2px 10px; }
.stufe-intro { color: var(--grau); font-size: .92rem; margin: 0 0 12px; }

.case-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(235px, 1fr)); gap: 14px; }
.case-card {
  font: inherit; text-align: left; cursor: pointer;
  background: #fff; border: 1.5px solid var(--rand); border-radius: 14px;
  padding: 16px 16px 14px; transition: all .15s; display: flex; flex-direction: column; gap: 4px;
}
.case-card:hover { border-color: var(--blau); box-shadow: var(--schatten); transform: translateY(-2px); }
.case-nr { font-size: .78rem; font-weight: 700; color: var(--grau); text-transform: uppercase; letter-spacing: .05em; }
.case-titel { font-weight: 700; color: var(--navy); font-size: 1.02rem; line-height: 1.3; }
.case-sterne { color: var(--gold); font-size: .95rem; letter-spacing: .1em; }
.stern-leer { color: #d5dbe2; }
.case-status { margin-top: 6px; display: flex; gap: 6px; flex-wrap: wrap; }

.badge { display: inline-block; font-size: .76rem; font-weight: 700; padding: 3px 10px; border-radius: 999px; }
.badge-done { background: var(--gruen-hell); color: var(--gruen); border: 1px solid #bbe7cb; }
.badge-hilfe { background: #fff8e6; color: #92640a; border: 1px solid #f0dca4; }
.badge-progress { background: #fff8e6; color: #92640a; border: 1px solid #f0dca4; }
.badge-open { background: var(--grau-hell); color: var(--grau); border: 1px solid var(--rand); }
.badge-thema { background: var(--blau-hell); color: var(--blau); border: 1px solid #c4d8ee; }

/* ---------- Übungsansicht ---------- */
.case-top { display: flex; justify-content: space-between; margin-bottom: 10px; gap: 10px; flex-wrap: wrap; }
.case-header { background: #fff; border-radius: 14px; padding: 20px 24px; box-shadow: var(--schatten); border-left: 6px solid var(--navy); }
.case-kopf { display: flex; justify-content: space-between; gap: 16px; flex-wrap: wrap; align-items: baseline; }
.case-meta { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.lernziel { margin: 10px 0 0; color: var(--grau); font-size: .95rem; }

.sachverhalt { background: #fffdf5; border: 1.5px solid #ead9a8; border-radius: 14px; padding: 18px 24px; margin-top: 14px; }
.sachverhalt h2 { color: #7c5e10; font-size: 1.02rem; text-transform: uppercase; letter-spacing: .04em; }
.sachverhalt p { margin: 8px 0 0; }
.hint { color: var(--grau); font-size: .9em; }

/* Stammbaum */
.baum { background: #fff; border: 1.5px solid var(--rand); border-radius: 14px; margin-top: 14px; padding: 14px 14px 6px; box-shadow: var(--schatten); overflow-x: auto; }
.baum-titel { font-size: .8rem; font-weight: 700; color: var(--grau); text-transform: uppercase; letter-spacing: .05em; margin: 0 0 4px 6px; }
.baum svg { display: block; margin: 0 auto; }
.baum-legende { color: var(--grau); font-size: .8rem; margin: 4px 6px 8px; }

/* Lösungsblatt (füllt sich von Schritt zu Schritt) */
.arbeitsblatt {
  background: #fff; border: 1.5px solid var(--rand); border-left: 6px solid var(--gold);
  border-radius: 14px; margin-top: 14px; box-shadow: var(--schatten);
}
.arbeitsblatt summary {
  cursor: pointer; font-weight: 700; color: var(--navy); padding: 13px 20px;
  list-style: none; user-select: none;
}
.arbeitsblatt summary::-webkit-details-marker { display: none; }
.arbeitsblatt summary::before { content: '▸ '; color: var(--gold); }
.arbeitsblatt[open] summary::before { content: '▾ '; }
.arbeitsblatt summary:hover { color: var(--blau); }
.ab-stand { font-weight: 600; color: var(--grau); font-size: .88rem; }
.ab-inhalt { padding: 0 20px 16px; overflow-x: auto; }
.ab-tabelle { width: 100%; border-collapse: collapse; background: #fff; font-size: .92rem; }
.ab-tabelle th { text-align: left; background: var(--navy); color: #fff; padding: 7px 10px; font-size: .8rem; }
.ab-tabelle td { padding: 8px 10px; border-bottom: 1px solid var(--grau-hell); }
.ab-tabelle tr:nth-child(even) td { background: #f8fafc; }
.ab-leer { color: #b6c2cd; }
.ab-zeile-total td { background: var(--blau-hell) !important; border-top: 2px solid var(--blau); font-weight: 600; }
.ab-platzhalter { color: var(--grau); font-size: .92rem; margin: 10px 0 4px; }

/* Schritt-Karten */
.phase-card { background: #fff; border-radius: 14px; padding: 22px 26px; box-shadow: var(--schatten); margin-top: 16px; }
.phase-card.aktiv { border: 1.5px solid var(--blau); }
.phase-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.phase-nr { background: var(--navy); color: #fff; border-radius: 8px; padding: 2px 10px; font-size: .85rem; margin-right: 6px; white-space: nowrap; }
.phase-done .phase-nr { background: var(--gruen); }
.phase-frage { font-weight: 600; color: var(--navy); margin: 10px 0 14px; font-size: 1.02rem; }
.phase-done-banner { background: var(--gruen-hell); color: var(--gruen); border: 1px solid #bbe7cb; border-radius: 10px; padding: 10px 14px; font-weight: 600; margin-bottom: 14px; }
.phase-hilfe-banner { background: #fff8e6; color: #92640a; border: 1px solid #f0dca4; border-radius: 10px; padding: 10px 14px; font-weight: 600; margin-bottom: 14px; }

.art {
  display: inline-block; background: var(--blau-hell); color: var(--blau);
  border: 1px solid #c4d8ee; border-radius: 6px; padding: 1px 8px;
  font-size: .8rem; font-weight: 600; cursor: help; white-space: nowrap; margin: 1px 0;
}
.art-zeile { margin-top: 10px; display: flex; flex-wrap: wrap; gap: 4px; }

/* Multiple Choice */
.mc-liste { display: flex; flex-direction: column; gap: 8px; }
.mc-opt { display: flex; gap: 10px; align-items: flex-start; border: 1.5px solid var(--rand); border-radius: 10px; padding: 11px 14px; cursor: pointer; background: #fff; transition: all .12s; }
.mc-opt:hover { border-color: var(--blau); }
.mc-opt input { margin-top: 4px; accent-color: var(--navy); }
.mc-opt.mc-ok { border-color: var(--gruen); background: var(--gruen-hell); }
.mc-opt.mc-bad { border-color: var(--rot); background: var(--rot-hell); }
.mc-opt.mc-dim { opacity: .6; }

/* Erben-Auswahl (Checkbox-Chips) */
.check-grid { display: flex; flex-wrap: wrap; gap: 8px; }
.check-chip input { position: absolute; opacity: 0; pointer-events: none; }
.check-chip span {
  display: inline-block; padding: 9px 16px; border: 1.5px solid var(--rand); border-radius: 999px;
  font-size: .93rem; font-weight: 600; color: var(--grau); cursor: pointer; transition: all .12s; background: #fff;
}
.check-chip input:checked + span { background: var(--navy); border-color: var(--navy); color: #fff; }
.check-chip input:focus-visible + span { box-shadow: 0 0 0 3px rgba(37, 99, 168, .3); }
.check-chip input:disabled + span { cursor: default; }
.check-chip span:hover { border-color: var(--blau); }
.check-chip.chip-ok span { background: var(--gruen); border-color: var(--gruen); color: #fff; }
.check-chip.chip-bad span { background: var(--rot-hell); border-color: var(--rot); color: var(--rot); }
.check-chip.chip-fehlt span { border-color: var(--rot); border-style: dashed; color: var(--rot); background: #fff; }

/* Aufgaben-Tabellen (Quoten / CHF / Zuordnen) */
.aufgabe-tabelle { width: 100%; border-collapse: collapse; margin: 6px 0 10px; }
.aufgabe-tabelle th {
  text-align: left; font-size: .8rem; text-transform: uppercase; letter-spacing: .04em;
  color: var(--grau); padding: 8px 10px; border-bottom: 2px solid var(--rand);
}
.aufgabe-tabelle td { padding: 10px; border-bottom: 1px solid var(--grau-hell); vertical-align: middle; }
.aufgabe-tabelle tr:last-child td { border-bottom: none; }
.aufgabe-tabelle input[type="text"] {
  font: inherit; padding: 9px 12px; border: 1.5px solid var(--rand); border-radius: 8px;
  width: 150px; max-width: 100%; text-align: right; background: #fff;
}
.aufgabe-tabelle input[type="text"]:focus { outline: none; border-color: var(--blau); box-shadow: 0 0 0 3px rgba(37, 99, 168, .15); }
.aufgabe-tabelle input[type="text"]:disabled { background: var(--grau-hell); color: var(--navy); font-weight: 600; }
.aufgabe-tabelle select {
  font: inherit; font-size: .92rem; padding: 9px 10px; border: 1.5px solid var(--rand); border-radius: 8px;
  max-width: 100%; background: #fff;
}
.aufgabe-tabelle select:focus { outline: none; border-color: var(--blau); box-shadow: 0 0 0 3px rgba(37, 99, 168, .15); }
.row-ok td { background: var(--gruen-hell); }
.row-ok td:first-child { box-shadow: inset 4px 0 0 var(--gruen); }
.row-bad td { background: var(--rot-hell); }
.row-bad td:first-child { box-shadow: inset 4px 0 0 var(--rot); }
.zeile-person { font-weight: 600; color: var(--navy); }
.zeile-sub { font-size: .84rem; color: var(--grau); font-weight: 400; }

/* Feedback & Lösung */
.phase-actions { display: flex; gap: 10px; margin-top: 8px; flex-wrap: wrap; }
.fb { border-radius: 10px; padding: 12px 16px; font-weight: 600; margin-top: 14px; }
.fb-ok { background: var(--gruen-hell); color: var(--gruen); border: 1px solid #bbe7cb; }
.fb-bad { background: var(--rot-hell); color: var(--rot); border: 1px solid #f3c6c6; }
.fb-info { background: var(--blau-hell); color: var(--blau); border: 1px solid #c4d8ee; }

.solution-box { background: var(--grau-hell); border: 1.5px solid var(--rand); border-radius: 12px; padding: 16px 20px; margin-top: 16px; font-size: .96rem; }
.solution-box > h4 { margin-top: 0; }
.solution-box p { margin: 8px 0; }
.solution-box ul { margin: 6px 0; padding-left: 22px; }
.solution-box li { margin-bottom: 4px; }

.merkbox {
  background: #fffdf5; border: 1.5px solid #ead9a8; border-left: 5px solid var(--gold);
  border-radius: 10px; padding: 10px 14px; margin-top: 12px; font-size: .93rem;
}
.endbox {
  background: var(--gruen-hell); border: 1.5px solid #bbe7cb; border-left: 5px solid var(--gruen);
  border-radius: 10px; padding: 16px 20px; margin-top: 16px; font-size: 1.02rem;
}
.endbox-hilfe { background: #fff8e6; border-color: #f0dca4; border-left-color: var(--gold); }
.phase-nav { display: flex; gap: 10px; margin-top: 14px; flex-wrap: wrap; }
.nowrap { white-space: nowrap; }

/* Spickzettel */
dialog#spick-dialog {
  border: none; border-radius: 16px; padding: 0; max-width: 820px; width: calc(100vw - 40px);
  max-height: 88vh; box-shadow: 0 10px 40px rgba(18, 40, 63, .3);
}
dialog#spick-dialog::backdrop { background: rgba(18, 40, 63, .5); }
.spick { padding: 24px 28px; overflow-y: auto; max-height: 88vh; }
.spick-head { display: flex; justify-content: space-between; align-items: center; }
.spick-head h2 { margin: 0; }
.spick-tabelle { width: 100%; border-collapse: collapse; margin: 6px 0 14px; font-size: .9rem; }
.spick-tabelle th { border: 1px solid var(--rand); background: var(--navy); color: #fff; padding: 7px 9px; text-align: left; font-size: .82rem; }
.spick-tabelle td { border: 1px solid var(--rand); padding: 7px 9px; vertical-align: top; }
.spick-tabelle tr:nth-child(even) td { background: var(--grau-hell); }
.spick-liste li { margin-bottom: 5px; }
.spick .merkbox { margin-bottom: 12px; }

@media (max-width: 640px) {
  #app { padding: 14px 10px 60px; }
  .phase-card { padding: 16px 14px; }
  .case-header { padding: 16px 16px; }
  .sachverhalt { padding: 14px 16px; }
  .aufgabe-tabelle input[type="text"] { width: 110px; }
}
@media print {
  .btn, .home-actions, .phase-actions { display: none !important; }
}
</style>
</head>
<body>
<div id="app"></div>
<dialog id="spick-dialog"></dialog>
<script>
'use strict';

/* =========================================================
   Gesetzestexte (Kurzfassungen) für die Artikel-Badges
   ========================================================= */
const GESETZ = {
  'Art. 457': 'Die nächsten Erben sind die Nachkommen (Abs. 1). Die Kinder erben zu gleichen Teilen (Abs. 2). An die Stelle vorverstorbener Kinder treten ihre Nachkommen, und zwar in allen Graden nach Stämmen – Eintrittsprinzip (Abs. 3).',
  'Art. 458': 'Hinterlässt der Erblasser keine Nachkommen, so erbt der elterliche Stamm (Abs. 1). Vater und Mutter erben je die Hälfte (Abs. 2). An die Stelle vorverstorbener Eltern treten ihre Nachkommen nach Stämmen (Abs. 3). Fehlen Nachkommen auf einer Seite, so fällt die ganze Erbschaft an die Erben der anderen Seite (Abs. 4).',
  'Art. 459': 'Sind weder Nachkommen noch Erben des elterlichen Stammes vorhanden, so erbt der Stamm der Grosseltern; die Erbschaft wird hälftig auf die väterliche und die mütterliche Seite geteilt (Abs. 1). An die Stelle vorverstorbener Grosseltern treten ihre Nachkommen nach Stämmen (Abs. 2). Stirbt ein Grosselternteil ohne Nachkommen, so fällt sein Anteil an die Erben derselben Seite (Abs. 3); fehlt eine ganze Seite, fällt alles an die andere Seite (Abs. 4).',
  'Art. 460': 'Unter den Verwandten sind die letzten Erben die Grosseltern und ihre Nachkommenschaft. Urgrosseltern (4. Parentel) haben kein gesetzliches Erbrecht.',
  'Art. 462': 'Der überlebende Ehegatte bzw. die überlebende eingetragene Partnerin oder der Partner erhält: neben Nachkommen die Hälfte (Ziff. 1); neben Erben des elterlichen Stammes drei Viertel (Ziff. 2); wenn auch keine Erben des elterlichen Stammes vorhanden sind, die ganze Erbschaft (Ziff. 3).',
  'Art. 466': 'Hinterlässt der Erblasser keine Erben, so fällt die Erbschaft an den Kanton des letzten Wohnsitzes oder an die von diesem Kanton als berechtigt bezeichnete Gemeinde.',
  'Art. 467': 'Wer urteilsfähig ist und das 18. Altersjahr zurückgelegt hat, kann über sein Vermögen letztwillig verfügen (Testierfähigkeit).',
  'Art. 470': 'Wer Nachkommen, den Ehegatten, die eingetragene Partnerin oder den eingetragenen Partner hinterlässt, kann bis zu deren Pflichtteil über sein Vermögen von Todes wegen verfügen (Abs. 1). Wer keine dieser Erben hinterlässt, kann über sein ganzes Vermögen verfügen (Abs. 2).',
  'Art. 471': 'Der Pflichtteil beträgt die Hälfte des gesetzlichen Erbanspruchs (seit 1.1.2023; pflichtteilsgeschützt sind nur noch Nachkommen und Ehegatte / eingetragene Partner).',
  'Art. 472': 'Verstirbt ein Ehegatte während eines hängigen Scheidungsverfahrens, verliert der überlebende Ehegatte den Pflichtteilsanspruch, wenn das Verfahren auf gemeinsames Begehren eingeleitet/fortgesetzt wurde oder die Ehegatten mindestens zwei Jahre getrennt gelebt haben (Abs. 1). Er bleibt aber gesetzlicher Erbe, solange keine Verfügung von Todes wegen etwas anderes bestimmt. Gilt sinngemäss für eingetragene Partnerschaften (Abs. 2).',
  'Art. 473': 'Der Erblasser kann dem überlebenden Ehegatten / eingetragenen Partner gegenüber den GEMEINSAMEN Nachkommen die Nutzniessung am ganzen ihnen zufallenden Teil der Erbschaft zuwenden (Abs. 1). Diese Nutzniessung tritt an die Stelle des gesetzlichen Erbrechts neben diesen Nachkommen; der verfügbare Teil beträgt daneben die Hälfte des Nachlasses (Abs. 2). Bei Wiederverheiratung entfällt die Nutzniessung auf jenem Teil, der nach den ordentlichen Pflichtteilsregeln nicht hätte belastet werden dürfen (Abs. 3).',
  'Art. 216': 'Durch Ehevertrag kann eine andere Beteiligung am Vorschlag vereinbart werden, z.B. der ganze Vorschlag an den überlebenden Ehegatten (Abs. 1). Die überhälftige Zuweisung wird bei der Pflichtteilsberechnung des Ehegatten und der GEMEINSAMEN Kinder nicht hinzugerechnet (Abs. 2). Sie darf aber die Pflichtteile der NICHTGEMEINSAMEN Kinder und deren Nachkommen nicht beeinträchtigen (Abs. 3).',
  'Art. 495': 'Der Erblasser kann mit einem Erben einen Erbverzichtsvertrag schliessen (gegen Abfindung: Erbauskauf). Der Verzichtende fällt beim Erbgang als Erbe ausser Betracht – der Pflichtteil entfällt vollständig.',
  'Art. 512': 'Der Erbvertrag bedarf zu seiner Gültigkeit der Form der öffentlichen letztwilligen Verfügung: gleichzeitige Willenserklärung vor der Urkundsperson und Unterschrift vor ihr und zwei Zeugen.',
  'Art. 120': 'Geschiedene Ehegatten haben zueinander kein gesetzliches Erbrecht (Abs. 2) und können aus Verfügungen von Todes wegen, die sie vor der Scheidung errichtet haben, keine Ansprüche erheben (Abs. 3).',
  'Art. 560': 'Die Erben erwerben die Erbschaft als Ganzes mit dem Tode des Erblassers kraft Gesetzes (Universalsukzession).'
};

function gesetzText(artikel) {
  let key = artikel.replace(/\s*(ZGB|OR)\s*$/, '').replace(/\s(Abs|Ziff|lit)\..*$/, '').trim();
  if (GESETZ[key]) return GESETZ[key];
  const keys = Object.keys(GESETZ).sort((a, b) => b.length - a.length);
  for (const k of keys) if (key.startsWith(k)) return GESETZ[k];
  return '';
}

/* ---------- Hilfsfunktionen ---------- */
const $ = sel => document.querySelector(sel);
const app = () => $('#app');

function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;'); }

function chf(n) {
  const neg = n < 0; n = Math.abs(Math.round(n));
  let s = String(n).replace(/\B(?=(\d{3})+(?!\d))/g, "'");
  return (neg ? '– ' : '') + 'CHF ' + s;
}

function parseNum(str) {
  if (str == null) return NaN;
  let s = String(str).trim();
  if (s === '') return NaN;
  s = s.replace(/chf/i, '').trim();
  s = s.replace(/[\s'’`´ ]/g, '');
  s = s.replace(/–|−/g, '-');
  if (/^-?\d{1,3}(\.\d{3})+$/.test(s)) s = s.replace(/\./g, '');
  s = s.replace(',', '.');
  if (/^-?\d+\.00?$/.test(s)) s = s.replace(/\.\d+$/, '');
  return Number(s);
}

/* Bruch-Eingaben: akzeptiert "1/4", "2/8", "0.25", "0,25", "1", "0", "-" */
function parseFrac(str) {
  if (str == null) return NaN;
  let s = String(str).trim().replace(/\s/g, '');
  if (s === '') return NaN;
  if (s === '-' || s === '–' || s === '—') return 0;
  const uni = { '½': '1/2', '⅓': '1/3', '⅔': '2/3', '¼': '1/4', '¾': '3/4', '⅙': '1/6', '⅚': '5/6', '⅛': '1/8', '⅜': '3/8', '⅝': '5/8', '⅞': '7/8' };
  if (uni[s]) s = uni[s];
  const m = s.match(/^(\d+)\/(\d+)$/);
  if (m) { const z = Number(m[1]), n = Number(m[2]); return n === 0 ? NaN : z / n; }
  s = s.replace(',', '.');
  const n = Number(s);
  return n;
}

const FRAC_UNI = { '1/2': '½', '1/3': '⅓', '2/3': '⅔', '1/4': '¼', '3/4': '¾', '1/6': '⅙', '5/6': '⅚', '1/8': '⅛', '3/8': '⅜', '5/8': '⅝', '7/8': '⅞' };
function fmtFrac(f) {
  if (f === '0') return '0 (kein Anspruch)';
  if (f === '1' || f === '1/1') return '1/1 (alles)';
  const u = FRAC_UNI[f];
  return u ? (u + ' (' + f + ')') : f;
}
function fmtFracKurz(f) {
  if (f === '0') return '—';
  if (f === '1' || f === '1/1') return '1/1';
  return FRAC_UNI[f] || f;
}

function sterne(stufe) { return '★'.repeat(stufe) + '<span class="stern-leer">' + '★'.repeat(Math.max(0, 5 - stufe)) + '</span>'; }

function artBadges(arr) {
  if (!arr || !arr.length) return '';
  return '<div class="art-zeile">' + arr.map(a => `<span class="art" title="${esc(gesetzText(a))}">${esc(a)}</span>`).join(' ') + '</div>';
}

/* Artikel im Fliesstext automatisch als Badge markieren */
function artInText(html) {
  return html.replace(/Art\.\s?\d+[a-z]?(?:\s(?:Abs\.|Ziff\.|lit\.)\s?\d+[a-z]?)*(?:\s(?:i\.V\.m\.\s?Art\.\s?\d+[a-z]?))?\s?(?:ZGB|OR|StGB|PartG)/g,
    m => `<span class="art" title="${esc(gesetzText(m))}">${esc(m)}</span>`);
}

/* =========================================================
   Stammbaum-Renderer (SVG)
   Personen: {id, name, sub, gen, dead, e (Erblasser), par: id|[id,id], sp: id, ex: bool (geschieden), kon: bool (Konkubinat)}
   ========================================================= */
const BOX_W = 152, BOX_H = 48, GAP_X = 22, ROW_H = 92;

function baumSvg(ex, fertig) {
  if (!ex.personen || !ex.personen.length || ex.keinBaum) return '';
  const pers = ex.personen;
  const gens = [...new Set(pers.map(p => p.gen))].sort((a, b) => b - a);
  const rows = gens.map(g => pers.filter(p => p.gen === g));
  const maxN = Math.max(...rows.map(r => r.length));
  const W = Math.max(maxN * (BOX_W + GAP_X) + 30, 420);
  const H = gens.length * ROW_H + 10;
  const pos = {};
  rows.forEach((row, ri) => {
    const total = row.length * (BOX_W + GAP_X) - GAP_X;
    const x0 = (W - total) / 2;
    row.forEach((p, i) => {
      pos[p.id] = { x: x0 + i * (BOX_W + GAP_X), y: 14 + ri * ROW_H };
    });
  });
  const erbenSet = fertig ? new Set(ex.erbenIds || []) : new Set();
  let lines = '', boxes = '';
  /* Partner-Linien */
  pers.forEach(p => {
    if (!p.sp || !pos[p.sp]) return;
    const a = pos[p.id], b = pos[p.sp];
    const y = a.y + BOX_H / 2;
    const x1 = Math.min(a.x, b.x) + BOX_W, x2 = Math.max(a.x, b.x);
    const midX = (x1 + x2) / 2;
    const dash = p.ex ? ' stroke-dasharray="5 4"' : (p.kon ? ' stroke-dasharray="2 3"' : '');
    lines += `<line x1="${x1}" y1="${y}" x2="${x2}" y2="${y}" stroke="#9db2c5" stroke-width="1.8"${dash}/>`;
    const sym = p.ex ? '✕' : (p.kon ? '⚯' : '⚭');
    lines += `<text x="${midX}" y="${y - 5}" text-anchor="middle" font-size="11" fill="#5b6b7b">${sym}</text>`;
  });
  /* Eltern-Kind-Linien */
  pers.forEach(p => {
    if (!p.par) return;
    const c = pos[p.id];
    const cx = c.x + BOX_W / 2, cy = c.y;
    let sx, sy;
    const parArr = Array.isArray(p.par) ? p.par : [p.par];
    if (parArr.length === 2 && pos[parArr[0]] && pos[parArr[1]]) {
      const a = pos[parArr[0]], b = pos[parArr[1]];
      const x1 = Math.min(a.x, b.x) + BOX_W, x2 = Math.max(a.x, b.x);
      sx = (x1 + x2) / 2; sy = a.y + BOX_H / 2;
    } else if (pos[parArr[0]]) {
      sx = pos[parArr[0]].x + BOX_W / 2; sy = pos[parArr[0]].y + BOX_H;
    } else return;
    const my = cy - 14;
    lines += `<polyline points="${sx},${sy} ${sx},${my} ${cx},${my} ${cx},${cy}" fill="none" stroke="#9db2c5" stroke-width="1.5"/>`;
  });
  /* Boxen */
  pers.forEach(p => {
    const { x, y } = pos[p.id];
    const istErbe = erbenSet.has(p.id);
    let fill = '#fff', stroke = 'var(--rand)', sw = 1.5, dash = '', nameFill = '#1b3a5c', subFill = '#5b6b7b', op = 1;
    if (p.dead) { fill = '#f4f6f8'; dash = ' stroke-dasharray="4 3"'; op = .62; }
    if (p.e) { fill = '#1b3a5c'; stroke = '#1b3a5c'; nameFill = '#fff'; subFill = '#c3d2e2'; op = 1; }
    if (istErbe && !p.e && !p.dead) { stroke = '#15803d'; sw = 2.5; fill = '#ecfdf3'; }
    const name = (p.dead ? '† ' : '') + p.name;
    boxes += `<g opacity="${op}">
      <rect x="${x}" y="${y}" width="${BOX_W}" height="${BOX_H}" rx="9" fill="${fill}" stroke="${stroke}" stroke-width="${sw}"${dash}/>
      <text x="${x + BOX_W / 2}" y="${y + 20}" text-anchor="middle" font-size="12.5" font-weight="600" fill="${nameFill}">${esc(name)}</text>
      <text x="${x + BOX_W / 2}" y="${y + 36}" text-anchor="middle" font-size="10.5" fill="${subFill}">${esc(p.sub || '')}</text>
    </g>`;
  });
  const hatTote = pers.some(p => p.dead);
  let legende = [];
  if (hatTote) legende.push('† = vorverstorben');
  if (pers.some(p => p.ex)) legende.push('✕ = geschieden');
  if (pers.some(p => p.kon)) legende.push('⚯ = Konkubinat');
  if (fertig && (ex.erbenIds || []).length) legende.push('grün = erbberechtigt');
  if (ex.baumLegende) legende.push(ex.baumLegende);
  return `<div class="baum"><p class="baum-titel">Familienverhältnisse</p>
    <svg viewBox="0 0 ${W} ${H}" style="width:100%;max-width:${Math.min(W, 940)}px" role="img" aria-label="Stammbaum">${lines}${boxes}</svg>
    ${legende.length ? `<p class="baum-legende">${legende.join(' · ')}</p>` : ''}</div>`;
}

GESETZ['Art. 468'] = 'Erbvertrag – Erblasserseite: Wer einen Erbvertrag abschliessen will, muss urteilsfähig und volljährig sein; steht er unter einer Beistandschaft, die den Abschluss eines Erbvertrags umfasst, braucht er die Zustimmung des gesetzlichen Vertreters.';
GESETZ['Art. 469'] = 'Ungültig sind Verfügungen, die der Erblasser unter dem Einfluss von Irrtum, arglistiger Täuschung, Drohung oder Zwang errichtet hat (Abs. 1).';
GESETZ['Art. 478'] = 'Wirkungen der Enterbung: Der Enterbte kann weder an der Erbschaft teilnehmen noch die Herabsetzungsklage erheben (Abs. 1). Die Nachkommen des Enterbten behalten ihre Pflichtteile, wie wenn er vorverstorben wäre (Abs. 3).';
GESETZ['Art. 480'] = 'Präventiventerbung: Bestehen gegen einen Nachkommen Verlustscheine, kann ihm der Erblasser die Hälfte des Pflichtteils entziehen, wenn er diese Hälfte den vorhandenen und später geborenen Kindern desselben zuwendet (Abs. 1).';
GESETZ['Art. 477'] = 'Enterbungsgründe: schwere Straftat gegen den Erblasser oder eine ihm nahe verbundene Person; schwere Verletzung familienrechtlicher Pflichten gegenüber dem Erblasser oder dessen Angehörigen.';
GESETZ['Art. 481'] = 'Der Erblasser kann in den Schranken der Verfügungsfreiheit mit Testament oder Erbvertrag über sein Vermögen ganz oder teilweise verfügen (numerus clausus der Verfügungsarten).';
GESETZ['Art. 482'] = 'Der Erblasser kann seine Verfügungen mit Auflagen oder Bedingungen belasten; deren Vollziehung kann jedermann verlangen, der an ihnen ein Interesse hat (Abs. 1). Unsittliche oder rechtswidrige Auflagen und Bedingungen machen die Verfügung ungültig (Abs. 2); unsinnige oder bloss lästige gelten als nicht vorhanden (Abs. 3).';
GESETZ['Art. 483'] = 'Erbeinsetzung: Der Erblasser kann eine oder mehrere Personen für die ganze Erbschaft oder für einen Bruchteil als Erben einsetzen.';
GESETZ['Art. 484'] = 'Vermächtnis: Der Erblasser kann einem Bedachten einen Vermögensvorteil zuwenden, ohne ihn als Erben einzusetzen – z.B. eine einzelne Erbschaftssache, eine Nutzniessung oder einen Geldbetrag.';
GESETZ['Art. 493'] = 'Der Erblasser kann die verfügbare Quote ganz oder teilweise der Errichtung einer Stiftung widmen (i.V.m. Art. 81 ZGB: Errichtung durch öffentliche Urkunde oder Verfügung von Todes wegen).';
GESETZ['Art. 494'] = 'Erbeinsetzungs- und Vermächtnisvertrag binden den Erblasser bezüglich seines Nachlasses (Abs. 1). Über sein Vermögen kann er zu Lebzeiten weiterhin frei verfügen (Abs. 2). Verfügungen von Todes wegen und Zuwendungen unter Lebenden (ausser übliche Gelegenheitsgeschenke) unterliegen aber der Anfechtung, soweit sie mit dem Erbvertrag unvereinbar und dort nicht vorbehalten sind (Abs. 3).';
GESETZ['Art. 498'] = 'Der Erblasser kann seine letztwillige Verfügung mit öffentlicher Beurkundung, eigenhändig oder – im Notfall – mündlich errichten. Die drei Formen sind abschliessend.';
GESETZ['Art. 499'] = 'Die öffentliche letztwillige Verfügung erfolgt unter Mitwirkung von zwei Zeugen vor der Urkundsperson (Beamter, Notar), die nach kantonalem Recht zuständig ist.';
GESETZ['Art. 503'] = 'Ausschliessungsgründe: Handlungsunfähige, des Lesens/Schreibens Unkundige sowie die nahen Verwandten des Erblassers und deren Ehegatten können nicht als Urkundsperson oder Zeugen mitwirken (Abs. 1). Die Mitwirkenden und ihre nahen Angehörigen dürfen in der Verfügung nicht bedacht werden (Abs. 2).';
GESETZ['Art. 505'] = 'Die eigenhändige letztwillige Verfügung ist vom Erblasser von Anfang bis Ende – mit Einschluss von Jahr, Monat und Tag – von Hand niederzuschreiben und zu unterschreiben (Abs. 1). Die Kantone sorgen für eine Aufbewahrungsmöglichkeit (Abs. 2).';
GESETZ['Art. 506'] = 'Nottestament: Kann der Erblasser wegen ausserordentlicher Umstände (nahe Todesgefahr, Verkehrssperre, Epidemie, Kriegsereignisse) keine andere Form benützen, so kann er die letztwillige Verfügung mündlich vor zwei Zeugen errichten.';
GESETZ['Art. 507'] = 'Die Zeugen schreiben die Verfügung sofort nieder und übergeben sie unverzüglich einer Gerichtsbehörde – oder geben sie dort mündlich zu Protokoll. Im Militärdienst kann ein Offizier mit Hauptmanns- oder höherem Rang die Gerichtsbehörde ersetzen (Abs. 3).';
GESETZ['Art. 508'] = 'Das mündliche Testament verliert seine Gültigkeit, wenn seit dem Zeitpunkt, ab dem der Erblasser wieder eine der anderen Verfügungsformen benützen könnte, 14 Tage abgelaufen sind.';
GESETZ['Art. 509'] = 'Der Erblasser kann seine letztwillige Verfügung jederzeit in einer der Testamentsformen ganz oder teilweise widerrufen (Widerrufstestament).';
GESETZ['Art. 510'] = 'Widerruf durch Vernichtung der Urkunde (z.B. zerreissen, verbrennen, durchstreichen).';
GESETZ['Art. 511'] = 'Errichtet der Erblasser ein neues Testament, ohne das frühere ausdrücklich aufzuheben, so tritt es an dessen Stelle, soweit es sich nicht zweifellos als blosse Ergänzung darstellt.';
GESETZ['Art. 513'] = 'Der Erbvertrag kann von den Vertragschliessenden jederzeit durch schriftliche Übereinkunft aufgehoben werden – einfache Schriftlichkeit genügt (Abs. 1). Einseitige Aufhebung durch den Erblasser, wenn sich der eingesetzte Erbe nach Vertragsschluss eines Enterbungsgrundes ihm gegenüber schuldig macht (Abs. 2); Form: eine der Testamentsformen (Abs. 3).';
GESETZ['Art. 514'] = 'Wer aufgrund eines Erbvertrags Leistungen unter Lebenden zu fordern hat, kann bei Nichterfüllung nach Obligationenrecht vom Vertrag zurücktreten.';
GESETZ['Art. 515'] = 'Erlebt der eingesetzte Erbe oder Vermächtnisnehmer den Tod des Erblassers nicht, so fällt der Erbvertrag dahin (Abs. 1).';
GESETZ['Art. 517'] = 'Der Erblasser kann in einer letztwilligen Verfügung eine oder mehrere handlungsfähige Personen als Willensvollstrecker einsetzen (Abs. 1). Die Mitteilung erfolgt von Amtes wegen; Erklärung binnen 14 Tagen – Stillschweigen gilt als Annahme (Abs. 2). Anspruch auf angemessene Vergütung (Abs. 3).';
GESETZ['Art. 518'] = 'Der Willensvollstrecker vertritt den Willen des Erblassers: Er verwaltet die Erbschaft, bezahlt die Schulden, richtet die Vermächtnisse aus und bereitet die Teilung vor bzw. führt sie aus.';
GESETZ['Art. 520a'] = 'Fehlt beim eigenhändigen Testament die Angabe von Jahr, Monat oder Tag oder ist sie unrichtig, so wird die Verfügung nur dann für ungültig erklärt, wenn sich die zeitlichen Angaben nicht anders feststellen lassen und das Datum für die Verfügungsfähigkeit, die Reihenfolge mehrerer Verfügungen oder eine andere Gültigkeitsfrage nötig ist.';
GESETZ['Art. 537'] = 'Der Erbgang wird durch den Tod des Erblassers eröffnet (Abs. 1).';
GESETZ['Art. 539'] = 'Erbfähig ist jedermann, der nicht nach Gesetzesvorschrift unfähig ist, Erbe zu sein oder zu erwerben (Abs. 1). Zuwendungen an Personenmehrheiten ohne Rechtspersönlichkeit werden als Stiftungen behandelt (Abs. 2).';
GESETZ['Art. 540'] = 'Erbunwürdig ist, wer den Tod des Erblassers (versucht) herbeigeführt, ihn dauernd verfügungsunfähig gemacht, ihn durch Arglist, Zwang oder Drohung zu einer Verfügung bewogen oder daran gehindert oder eine Verfügung beseitigt bzw. ungültig gemacht hat (Abs. 1). Verzeihung hebt die Erbunwürdigkeit auf (Abs. 2).';

/* =========================================================
   Persistenz
   ========================================================= */
const LS_KEY = 'erbrecht-lernprogramm-v1';
let store = { u: {} };
try { const raw = localStorage.getItem(LS_KEY); if (raw) store = JSON.parse(raw); } catch (e) {}
if (!store.u) store.u = {};
function save() { try { localStorage.setItem(LS_KEY, JSON.stringify(store)); } catch (e) {} }

function prog(id) {
  if (!store.u[id]) store.u[id] = { done: [], hilfe: [] };
  return store.u[id];
}
function doneCount(ex) {
  const p = store.u[ex.id];
  if (!p) return 0;
  let n = 0;
  for (let i = 0; i < ex.schritte.length; i++) { if (p.done[i]) n++; else break; }
  return n;
}
function exFertig(ex) { return doneCount(ex) >= ex.schritte.length; }
function exHilfe(ex) { const p = store.u[ex.id]; return !!(p && p.hilfe.some(Boolean)); }
function uebungById(id) { return UEBUNGEN.find(u => u.id === id); }
function persArr(ex) { return ex.personen || []; }
function pers(ex, id) { return persArr(ex).find(p => p.id === id); }
function persLabel(ex, id) {
  const p = pers(ex, id);
  if (!p) return id;
  return `<span class="zeile-person">${esc(p.name)}</span>` + (p.sub ? ` <span class="zeile-sub">(${esc(p.sub)})</span>` : '');
}
function zuordLabel(ex, z) {
  return z.label ? `<span class="zeile-person">${esc(z.label)}</span>` : persLabel(ex, z.p);
}

/* =========================================================
   Router
   ========================================================= */
let scrollNaechster = false;
function route() {
  const h = location.hash;
  const m = h.match(/^#u\/(\d+)$/);
  if (m) {
    const ex = uebungById(Number(m[1]));
    if (ex) { renderUebung(ex); return; }
  }
  renderHome();
}
window.addEventListener('hashchange', route);

/* =========================================================
   Startseite
   ========================================================= */
function statusBadge(ex) {
  if (exFertig(ex)) {
    return exHilfe(ex) ? '<span class="badge badge-hilfe">✓ mit Lösungshilfe</span>' : '<span class="badge badge-done">✓ gelöst</span>';
  }
  if (doneCount(ex) > 0) return `<span class="badge badge-progress">Schritt ${doneCount(ex)}/${ex.schritte.length}</span>`;
  return '<span class="badge badge-open">offen</span>';
}

function renderHome() {
  const total = UEBUNGEN.length;
  const fertig = UEBUNGEN.filter(exFertig).length;
  const ohneHilfe = UEBUNGEN.filter(ex => exFertig(ex) && !exHilfe(ex)).length;
  const pct = Math.round(100 * fertig / total);
  const naechste = UEBUNGEN.find(ex => !exFertig(ex));
  let html = `
  <div class="home-header">
    <h1>Lernprogramm Erbrecht</h1>
    <p class="untertitel">Gesetzliche &amp; gewillkürte Erbfolge · Pflichtteile · Herabsetzung · Testament &amp; Erbvertrag · Willensvollstrecker · Erbgang — revidiertes Erbrecht (seit 1.1.2023)</p>
    <div class="home-stats">
      <div class="stat"><div class="stat-zahl">${fertig} / ${total}</div><div class="stat-label">Übungen gelöst</div></div>
      <div class="stat"><div class="stat-zahl">${ohneHilfe}</div><div class="stat-label">davon ohne Lösungshilfe</div></div>
      <div class="stat"><div class="stat-zahl">${pct}%</div><div class="stat-label">Fortschritt</div></div>
    </div>
    <div class="balken"><div style="width:${pct}%"></div></div>
    <div class="home-actions">
      ${naechste ? `<button class="btn btn-primary" onclick="location.hash='#u/${naechste.id}'">▶ Weiterlernen (Übung ${naechste.id})</button>` : '<span class="alle-fertig">🎉 Alle Übungen gelöst – bravo!</span>'}
      <button class="btn" onclick="openSpick()">📋 Spickzettel</button>
      <button class="btn btn-ghost" onclick="resetAll()">Fortschritt zurücksetzen</button>
    </div>
  </div>
  <p class="hinweis-methodik">Grundlage: Zusammenfassungen «ZGB – Das Erbrecht, Teil 1 und Teil 2». Alle Lösungen nach revidiertem Erbrecht (in Kraft seit 1. Januar 2023). Der Fortschritt wird lokal im Browser gespeichert.</p>`;
  for (const st of STUFEN) {
    const us = UEBUNGEN.filter(u => u.stufe === st.nr);
    const stFertig = us.filter(exFertig).length;
    html += `
    <div class="stufe-kopf">
      <h2>Stufe ${st.nr}: ${esc(st.titel)}</h2>
      ${st.keineSterne ? '' : `<span class="case-sterne">${sterne(st.nr)}</span>`}
      <span class="stufe-zaehler">${stFertig}/${us.length}</span>
    </div>
    <p class="stufe-intro">${esc(st.intro)} <span class="nowrap hint">(${esc(st.art)})</span></p>
    <div class="case-grid">`;
    for (const ex of us) {
      html += `
      <button class="case-card" onclick="location.hash='#u/${ex.id}'">
        <span class="case-nr">Übung ${ex.id}</span>
        <span class="case-titel">${esc(ex.titel)}</span>
        <span class="case-sterne">${sterne(ex.sterne)}</span>
        <span class="case-status"><span class="badge badge-thema">${esc(ex.thema)}</span> ${statusBadge(ex)}</span>
      </button>`;
    }
    html += `</div>`;
  }
  app().innerHTML = html;
  window.scrollTo(0, 0);
}

function resetAll() {
  if (!confirm('Wirklich den gesamten Fortschritt löschen?')) return;
  store = { u: {} };
  save();
  route();
}
function resetUebung(id) {
  if (!confirm('Diese Übung zurücksetzen und neu lösen?')) return;
  delete store.u[id];
  save();
  route();
}

/* =========================================================
   Übungsansicht
   ========================================================= */
function renderUebung(ex) {
  const dc = doneCount(ex);
  const fertig = exFertig(ex);
  const idx = UEBUNGEN.indexOf(ex);
  const prev = UEBUNGEN[idx - 1], next = UEBUNGEN[idx + 1];
  let html = `
  <div class="case-top">
    <button class="btn btn-ghost" onclick="location.hash=''">← Übersicht</button>
    <div style="display:flex;gap:8px">
      ${prev ? `<button class="btn btn-ghost" onclick="location.hash='#u/${prev.id}'">← Übung ${prev.id}</button>` : ''}
      ${next ? `<button class="btn btn-ghost" onclick="location.hash='#u/${next.id}'">Übung ${next.id} →</button>` : ''}
      <button class="btn btn-ghost" onclick="openSpick()">📋 Spickzettel</button>
    </div>
  </div>
  <div class="case-header">
    <div class="case-kopf">
      <h1>Übung ${ex.id}: ${esc(ex.titel)}</h1>
      <div class="case-meta">
        <span class="case-sterne">${sterne(ex.sterne)}</span>
        <span class="badge badge-thema">${esc(ex.thema)}</span>
        ${statusBadge(ex)}
      </div>
    </div>
    <p class="lernziel">🎯 ${esc(ex.lernziel)}</p>
  </div>
  <div class="sachverhalt"><h2>Sachverhalt</h2><p>${ex.sachverhalt}</p></div>
  ${baumSvg(ex, fertig)}
  ${arbeitsblattHtml(ex)}`;
  for (let i = 0; i < ex.schritte.length; i++) {
    if (i < dc) html += stepDoneHtml(ex, i);
    else if (i === dc) { html += stepActiveHtml(ex, i); break; }
  }
  if (fertig) {
    const hilfe = exHilfe(ex);
    html += `
    <div class="endbox ${hilfe ? 'endbox-hilfe' : ''}">
      <b>${hilfe ? '✓ Übung abgeschlossen (mit Lösungshilfe).' : '🎉 Übung vollständig selbst gelöst – stark!'}</b>
      ${hilfe ? 'Tipp: Setze die Übung zurück und löse sie später nochmals ohne Hilfe.' : ''}
      <div class="phase-nav">
        ${next ? `<button class="btn btn-primary" onclick="location.hash='#u/${next.id}'">Nächste Übung →</button>` : `<button class="btn btn-primary" onclick="location.hash=''">Zur Übersicht</button>`}
        <button class="btn btn-ghost" onclick="resetUebung(${ex.id})">Übung zurücksetzen</button>
      </div>
    </div>`;
  }
  app().innerHTML = html;
  wireActiveStep(ex);
  if (scrollNaechster) {
    scrollNaechster = false;
    const el = document.querySelector('.phase-card.aktiv') || document.querySelector('.endbox');
    if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
  } else {
    window.scrollTo(0, 0);
  }
}

/* ---------- Lösungsblatt ---------- */
function sheetDaten(ex) {
  const data = {};
  const p = store.u[ex.id];
  if (!ex.sheet || !p) return data;
  const put = (row, col, val) => { if (!data[row]) data[row] = {}; data[row][col] = val; };
  const rowKeys = new Set(ex.sheet.rows.map(r => r.p || r.k));
  const hatErbeCol = ex.sheet.cols.some(c => c.k === 'erbe');
  ex.schritte.forEach((s, i) => {
    if (!p.done[i]) return;
    if (s.typ === 'erben' && hatErbeCol) {
      for (const r of ex.sheet.rows) {
        if (r.p) put(r.p, 'erbe', s.richtig.includes(r.p) ? '✓ ja' : '— nein');
      }
    }
    if ((s.typ === 'quoten' || s.typ === 'chf') && s.col) {
      for (const z of s.zeilen) {
        const key = z.p || z.k;
        if (!rowKeys.has(key)) continue;
        put(key, s.col, s.typ === 'chf' ? chf(z.ans) : fmtFracKurz(z.ans));
      }
    }
  });
  return data;
}

function arbeitsblattHtml(ex) {
  if (!ex.sheet) return '';
  const dc = doneCount(ex);
  const data = sheetDaten(ex);
  let rows = '';
  for (const r of ex.sheet.rows) {
    const key = r.p || r.k;
    const label = r.p ? persLabel(ex, r.p) : `<span class="zeile-person">${esc(r.l)}</span>`;
    let tds = '';
    for (const c of ex.sheet.cols) {
      const v = data[key] && data[key][c.k];
      tds += `<td>${v != null ? v : '<span class="ab-leer">…</span>'}</td>`;
    }
    rows += `<tr class="${r.total ? 'ab-zeile-total' : ''}"><td>${label}</td>${tds}</tr>`;
  }
  return `
  <details class="arbeitsblatt" open>
    <summary>Lösungsblatt <span class="ab-stand">— füllt sich automatisch (${dc}/${ex.schritte.length} Schritte geprüft)${ex.nachlass ? ' · Nachlass: ' + chf(ex.nachlass) : ''}</span></summary>
    <div class="ab-inhalt">
      ${dc === 0 ? '<p class="ab-platzhalter">Noch keine Ergebnisse – löse den ersten Schritt, dann erscheinen die geprüften Werte hier und bleiben sichtbar.</p>' : ''}
      <table class="ab-tabelle">
        <tr><th>Person / Position</th>${ex.sheet.cols.map(c => `<th>${esc(c.l)}</th>`).join('')}</tr>
        ${rows}
      </table>
    </div>
  </details>`;
}

/* ---------- Schritt: gelöst ---------- */
function stepDoneHtml(ex, i) {
  const s = ex.schritte[i];
  const p = prog(ex.id);
  const mitHilfe = !!p.hilfe[i];
  let inhalt = '';
  if (s.typ === 'mc') {
    inhalt = '<div class="mc-liste">' + s.optionen.map((o, k) =>
      `<label class="mc-opt ${k === s.richtig ? 'mc-ok' : 'mc-dim'}"><input type="radio" disabled ${k === s.richtig ? 'checked' : ''}><span>${o}</span></label>`).join('') + '</div>';
  } else if (s.typ === 'erben') {
    inhalt = '<div class="check-grid">' + selectablePersonen(ex).map(pp =>
      `<label class="check-chip ${s.richtig.includes(pp.id) ? 'chip-ok' : ''}"><input type="checkbox" disabled ${s.richtig.includes(pp.id) ? 'checked' : ''}><span>${esc(pp.name)}</span></label>`).join('') + '</div>';
  } else if (s.typ === 'zuordnen') {
    inhalt = `<table class="aufgabe-tabelle"><tr><th>${esc(s.kopf1 || 'Person')}</th><th>Kategorie</th></tr>` + s.zeilen.map(z =>
      `<tr class="row-ok"><td>${zuordLabel(ex, z)}</td><td><b>${esc(s.kategorien[z.richtig])}</b></td></tr>`).join('') + '</table>';
  } else if (s.typ === 'quoten' || s.typ === 'chf') {
    inhalt = '<table class="aufgabe-tabelle"><tr><th>Position</th><th>Lösung</th></tr>' + s.zeilen.map(z => {
      const label = z.label ? `<span class="zeile-person">${esc(z.label)}</span>` : persLabel(ex, z.p);
      const val = s.typ === 'chf' ? chf(z.ans) : fmtFrac(z.ans);
      return `<tr class="row-ok"><td>${label}</td><td><b>${val}</b></td></tr>`;
    }).join('') + '</table>';
  }
  return `
  <div class="phase-card phase-done">
    <div class="phase-head"><div><span class="phase-nr">Schritt ${i + 1}/${ex.schritte.length}</span></div></div>
    <div class="${mitHilfe ? 'phase-hilfe-banner' : 'phase-done-banner'}">${mitHilfe ? '✓ Mit Lösungshilfe abgeschlossen' : '✓ Richtig gelöst'}</div>
    <p class="phase-frage">${s.frage}</p>
    ${inhalt}
    <div class="solution-box"><h4>Erklärung</h4>${artInText(s.erkl)}${artBadges(s.art)}</div>
  </div>`;
}

/* ---------- Schritt: aktiv ---------- */
function selectablePersonen(ex) {
  return persArr(ex).filter(p => !p.e && !p.dead);
}

function stepActiveHtml(ex, i) {
  const s = ex.schritte[i];
  let inhalt = '';
  if (s.typ === 'mc') {
    inhalt = '<div class="mc-liste">' + s.optionen.map((o, k) =>
      `<label class="mc-opt" data-opt="${k}"><input type="radio" name="mc" value="${k}"><span>${o}</span></label>`).join('') + '</div>';
  } else if (s.typ === 'erben') {
    inhalt = `<p class="hint" style="margin:0 0 8px">Wähle alle Personen aus, die gesetzliche Erben sind:</p><div class="check-grid">` +
      selectablePersonen(ex).map(pp =>
        `<label class="check-chip" data-pid="${pp.id}"><input type="checkbox" value="${pp.id}"><span>${esc(pp.name)}</span></label>`).join('') + '</div>';
  } else if (s.typ === 'zuordnen') {
    inhalt = `<table class="aufgabe-tabelle"><tr><th>${esc(s.kopf1 || 'Person')}</th><th>Kategorie</th></tr>` + s.zeilen.map((z, k) =>
      `<tr data-row="${k}"><td>${zuordLabel(ex, z)}</td><td><select data-sel="${k}"><option value="">– wählen –</option>${s.kategorien.map((kat, ki) => `<option value="${ki}">${esc(kat)}</option>`).join('')}</select></td></tr>`).join('') + '</table>';
  } else if (s.typ === 'quoten' || s.typ === 'chf') {
    const ph = s.typ === 'chf' ? "z.B. 120'000" : 'z.B. 1/4';
    inhalt = `<table class="aufgabe-tabelle"><tr><th>Position</th><th>${s.typ === 'chf' ? 'Betrag (CHF)' : 'Quote (Bruch)'}</th></tr>` + s.zeilen.map((z, k) => {
      const label = z.label ? `<span class="zeile-person">${esc(z.label)}</span>` : persLabel(ex, z.p);
      return `<tr data-row="${k}"><td>${label}</td><td><input type="text" data-inp="${k}" placeholder="${ph}" autocomplete="off" inputmode="${s.typ === 'chf' ? 'numeric' : 'text'}"></td></tr>`;
    }).join('') + '</table>' +
      (s.typ === 'quoten' ? '<p class="hint">Brüche wie «3/8» eingeben (auch «0.375» wird akzeptiert); <b>0</b> eingeben, wenn kein Anspruch besteht.</p>' : `<p class="hint">Zahlen mit oder ohne Trennzeichen: 120000 oder 120'000.</p>`);
  }
  return `
  <div class="phase-card aktiv" id="aktiver-schritt">
    <div class="phase-head"><div><span class="phase-nr">Schritt ${i + 1}/${ex.schritte.length}</span></div></div>
    <p class="phase-frage">${s.frage}</p>
    <form id="step-form">${inhalt}
      <div class="phase-actions">
        <button class="btn btn-primary" type="submit">Prüfen</button>
        <button class="btn btn-ghost" type="button" id="btn-reveal">Lösung anzeigen</button>
      </div>
      <div id="fb"></div>
    </form>
  </div>`;
}

function wireActiveStep(ex) {
  const form = document.getElementById('step-form');
  if (!form) return;
  const i = doneCount(ex);
  const s = ex.schritte[i];
  form.addEventListener('submit', e => { e.preventDefault(); checkStep(ex, i, s); });
  document.getElementById('btn-reveal').addEventListener('click', () => {
    solveStep(ex, i, true);
  });
}

function fbShow(cls, msg) {
  const fb = document.getElementById('fb');
  fb.innerHTML = `<div class="fb ${cls}">${msg}</div>`;
}

function checkStep(ex, i, s) {
  if (s.typ === 'mc') {
    const chosen = document.querySelector('input[name="mc"]:checked');
    if (!chosen) { fbShow('fb-info', 'Bitte eine Antwort auswählen.'); return; }
    const k = Number(chosen.value);
    document.querySelectorAll('.mc-opt').forEach(el => el.classList.remove('mc-bad'));
    if (k === s.richtig) { solveStep(ex, i, false); }
    else {
      document.querySelector(`.mc-opt[data-opt="${k}"]`).classList.add('mc-bad');
      fbShow('fb-bad', 'Leider falsch – versuch eine andere Antwort oder lass dir die Lösung anzeigen.');
    }
    return;
  }
  if (s.typ === 'erben') {
    const checked = [...document.querySelectorAll('.check-grid input:checked')].map(c => c.value);
    if (!checked.length) { fbShow('fb-info', 'Bitte mindestens eine Person auswählen.'); return; }
    const soll = new Set(s.richtig), ist = new Set(checked);
    const ok = soll.size === ist.size && [...soll].every(x => ist.has(x));
    if (ok) solveStep(ex, i, false);
    else fbShow('fb-bad', 'Noch nicht richtig. Prüfe: Welche Parentel geht vor? Wer ist nur verschwägert? Gilt das Eintrittsprinzip?');
    return;
  }
  if (s.typ === 'zuordnen') {
    let alle = true, korrekt = true;
    s.zeilen.forEach((z, k) => {
      const sel = document.querySelector(`select[data-sel="${k}"]`);
      const row = document.querySelector(`tr[data-row="${k}"]`);
      row.classList.remove('row-ok', 'row-bad');
      if (sel.value === '') { alle = false; return; }
      if (Number(sel.value) === z.richtig) row.classList.add('row-ok');
      else { row.classList.add('row-bad'); korrekt = false; }
    });
    if (!alle) { fbShow('fb-info', 'Bitte alle Personen zuordnen.'); return; }
    if (korrekt) solveStep(ex, i, false);
    else fbShow('fb-bad', 'Die rot markierten Zuordnungen stimmen noch nicht.');
    return;
  }
  if (s.typ === 'quoten' || s.typ === 'chf') {
    let alle = true, korrekt = true;
    s.zeilen.forEach((z, k) => {
      const inp = document.querySelector(`input[data-inp="${k}"]`);
      const row = document.querySelector(`tr[data-row="${k}"]`);
      row.classList.remove('row-ok', 'row-bad');
      const raw = inp.value;
      if (String(raw).trim() === '') { alle = false; return; }
      let ok;
      if (s.typ === 'chf') {
        ok = Math.abs(parseNum(raw) - z.ans) < 0.51;
      } else {
        const val = parseFrac(raw);
        ok = isFinite(val) && Math.abs(val - parseFrac(z.ans)) < 1e-6;
      }
      if (ok) row.classList.add('row-ok'); else { row.classList.add('row-bad'); korrekt = false; }
    });
    if (!alle) { fbShow('fb-info', 'Bitte alle Felder ausfüllen (0 eingeben, wenn kein Anspruch besteht).'); return; }
    if (korrekt) solveStep(ex, i, false);
    else fbShow('fb-bad', 'Die rot markierten Werte stimmen noch nicht – korrigiere sie und prüfe erneut, oder lass dir die Lösung anzeigen.');
    return;
  }
}

function solveStep(ex, i, hilfe) {
  const p = prog(ex.id);
  p.done[i] = true;
  if (hilfe) p.hilfe[i] = true;
  save();
  scrollNaechster = true;
  renderUebung(ex);
}

/* =========================================================
   Spickzettel
   ========================================================= */
function openSpick() {
  const d = document.getElementById('spick-dialog');
  d.innerHTML = `<div class="spick">
    <div class="spick-head"><h2>📋 Spickzettel Erbrecht</h2><button class="btn" onclick="document.getElementById('spick-dialog').close()">Schliessen</button></div>

    <div class="merkbox"><b>Vorgehen im Erbfall:</b>
      <ol style="margin:6px 0 0;padding-left:20px">
        <li><b>Güterrecht vor Erbrecht:</b> Zuerst güterrechtliche Auseinandersetzung – sie bestimmt, was überhaupt in den Nachlass fällt.</li>
        <li><b>Parentelen prüfen</b> (1. → 2. → 3.): Die nähere Parentel schliesst die entferntere aus; Vorverstorbene werden durch ihre Nachkommen vertreten (Eintrittsprinzip, Teilung nach Stämmen).</li>
        <li><b>Ehegatte / eingetragene Partner:</b> Quote nach Art. 462 ZGB dazurechnen.</li>
        <li><b>Pflichtteil</b> = ½ × gesetzliche Quote – nur für Nachkommen und Ehegatte/eingetragene Partner (Art. 471 ZGB).</li>
        <li><b>Verfügbare Quote</b> = 1 − Summe der Pflichtteile (Art. 470 ZGB).</li>
      </ol>
    </div>

    <h3>Die drei Parentelen</h3>
    <table class="spick-tabelle">

      <tr><td><b>2. Parentel</b></td><td>Eltern (je ½) und deren Nachkommen (Geschwister, Nichten/Neffen)</td><td>Art. 458 ZGB</td></tr>
      <tr><td><b>3. Parentel</b></td><td>Grosseltern (hälftig pro Seite) und deren Nachkommen (Onkel/Tanten, Cousins)</td><td>Art. 459 ZGB</td></tr>

    <ul class="spick-liste">
      <li>Adoptivkinder (Adoption nach 1.4.1973): gleichgestellt – kein Erbrecht mehr zu den leiblichen Eltern.</li>

      <li>Stiefkinder und Verschwägerte: <b>keine</b> gesetzlichen Erben. Geschiedene: kein Erbrecht (Art. 120 ZGB).</li>
      <li>Halbgeschwister: erben nur in der Linie des gemeinsamen Elternteils (immer weniger als Vollgeschwister).</li>

    <h3>Die Herabsetzungsklage (Art. 522–533 ZGB)</h3>
    <table class="spick-tabelle">
      <tr><th>Frage</th><th>Antwort</th></tr>
      <tr><td>Voraussetzung</td><td>Ein pflichtteilsberechtigter Erbe erhält <b>dem Werte nach weniger als seinen Pflichtteil</b> (Art. 522 ZGB). Das verletzende Testament ist nicht nichtig – es muss angefochten werden!</td></tr>
      <tr><td>Parteien</td><td>Aktiv: jeder verletzte Erbe <b>einzeln</b> (ausnahmsweise Gläubiger, Art. 524 ZGB). Passiv: jede übermässig begünstigte Person einzeln. <b>Nicht</b>: Erbengemeinschaft (passiv), Willensvollstrecker (weder noch).</td></tr>
      <tr><td>Fristen (Art. 533)</td><td>Relativ <b>1 Jahr</b> ab Kenntnis von Berufung und Verletzung; absolut <b>10 Jahre</b> ab Eröffnung der Verfügung bzw. Todestag. <b>Einredeweise jederzeit</b> (Abs. 3).</td></tr>
      <tr><td>Reihenfolge (Art. 532)</td><td>1. Erwerbungen gemäss <b>gesetzlicher Erbfolge</b> → 2. Zuwendungen <b>von Todes wegen</b> → 3. Zuwendungen <b>unter Lebenden</b> (dort: Ehevertrag → frei Widerrufliches + Säule 3a → übrige, die späteren vor den früheren).</td></tr>
      <tr><td>Verhältnis</td><td>Pflichtteilsberechtigte Miterben: nur im Umfang des <b>über den Pflichtteil hinaus</b> Erhaltenen (Art. 523 ZGB). Eingesetzte Erben/Bedachte ohne Pflichtteil: mit dem <b>vollen Betrag</b>, untereinander im gleichen Verhältnis (Art. 525 ZGB).</td></tr>
      <tr><td>Herabsetzbar unter Lebenden (Art. 527, abschliessend)</td><td>1. Zuwendungen auf Anrechnung an den Erbteil (soweit nicht ausgleichungspflichtig); 2. Erbabfindungen/Auskaufsbeträge; 3. frei widerrufliche Schenkungen + Schenkungen der <b>letzten 5 Jahre</b> (ausser Gelegenheitsgeschenke); 4. offensichtliche <b>Umgehungsgeschäfte</b>.</td></tr>
      <tr><td>Vermächtnisse</td><td>Übersteigen sie Erbschaft oder verfügbare Quote → <b>verhältnismässige</b> Herabsetzung (Art. 486 ZGB). Unteilbare Sache: Bedachter wählt Sache gegen <b>Vergütung des Mehrbetrags</b> oder den <b>verfügbaren Betrag</b> in Geld (Art. 526 ZGB).</td></tr>
    </table>
    <h3>Verfügungen von Todes wegen (Teil 2)</h3>
    <table class="spick-tabelle">
      <tr><th>Form</th><th>Voraussetzungen</th><th>Artikel</th></tr>
      <tr><td><b>Eigenhändiges Testament</b></td><td>Von A bis Z von Hand, mit Jahr/Monat/Tag, unterschrieben. Datumsmängel schaden nur, wenn das Datum nötig und nicht rekonstruierbar ist. Aufbewahrung frei (Hinterlegung möglich, ZH: Notariat)</td><td>Art. 505, 520a ZGB</td></tr>
      <tr><td><b>Öffentliches Testament</b></td><td>Urkundsperson + 2 Zeugen; Erblasser liest und unterschreibt; obligatorische Aufbewahrung. Ausschliessungsgründe: nahe Angehörige und Bedachte dürfen nicht mitwirken</td><td>Art. 499–504 ZGB</td></tr>
      <tr><td><b>Nottestament</b></td><td>Notsituation + andere Formen unmöglich + Erklärung vor 2 gleichzeitig anwesenden Zeugen; sofortige Niederschrift, unverzüglich ans Gericht (Militär: Offizier ab Hauptmann). Hinfällig 14 Tage nach Wegfall der Verhinderung</td><td>Art. 506–508 ZGB</td></tr>
      <tr><td><b>Erbvertrag</b></td><td>Form der öffentlichen letztwilligen Verfügung (gleichzeitige Erklärung, Unterschrift vor Urkundsperson und 2 Zeugen). Erblasser: urteilsfähig + volljährig (+ Zustimmung des Vertreters bei Beistandschaft)</td><td>Art. 512, 468 ZGB</td></tr>
    </table>
    <ul class="spick-liste">
      <li><b>Testierfähigkeit:</b> Urteilsfähigkeit + 18 Jahre (Art. 467 ZGB); höchstpersönlich – keine Stellvertretung. Formen abschliessend (kein Video!).</li>
      <li><b>Widerruf des Testaments:</b> Widerrufstestament (Art. 509), Vernichtung (Art. 510), neues Testament – jüngeres ersetzt älteres, soweit nicht blosse Ergänzung (Art. 511 ZGB).</li>
      <li><b>Auslegung:</b> Testament nach dem <b>Willensprinzip</b> (wirklicher Wille + äussere Umstände), Erbvertrag nach dem <b>Vertrauensprinzip</b>.</li>
      <li><b>Ungültigkeit</b> (Verfügungsunfähigkeit, Willensmangel, Rechts-/Sittenwidrigkeit, Formmangel) = anfechtbar mit Ungültigkeitsklage (1 Jahr / 10 Jahre / 30 Jahre bei Bösgläubigkeit); <b>Nichtigkeit</b> nur in Extremfällen (Fälschung, Entwurf, physischer Zwang, zugunsten Erbunwürdiger) – in jedem Prozess geltend zu machen.</li>
      <li><b>Gemeinsames Testament:</b> gibt es nicht; zulässig sind gleichzeitiges und reziprokes Testieren, unzulässig das korrespektive («falls sie das Gleiche verfügt»).</li>
      <li><b>Aufhebung des Erbvertrags:</b> gemeinsam schriftlich (Art. 513 Abs. 1!); einseitig bei Enterbungsgrund gegen den Erblasser (Abs. 2, Testamentsform); Rücktritt bei Nichterfüllung (Art. 514); Vorabsterben des Erben (Art. 515); Scheidung (Art. 120 ZGB). Zu Lebzeiten bleibt der Erblasser frei (Art. 494 Abs. 2), erbvertragswidrige Verfügungen/Schenkungen sind anfechtbar (Abs. 3).</li>
      <li><b>Inhalt:</b> Erbeinsetzung = Quote (Art. 483); Vermächtnis = bestimmte Sache/Betrag/Nutzniessung, nur obligatorischer Anspruch, fällig mit Annahme durch die Beschwerten, Klage verjährt in 10 Jahren (Art. 484, 562, 601). Merksatz: «Die Bedingung suspendiert, zwingt aber nicht – die Auflage zwingt, suspendiert aber nicht» (Art. 482). Ersatzerbe = statt; Nacherbe = nacheinander (nur EIN Nacherbe, Pflichtteil unbelastet, Nacherbe darf ungeboren sein). Stiftung: Art. 493 i.V.m. 81 ZGB.</li>
      <li><b>Willensvollstrecker:</b> nur vom Erblasser ernannt (Testament); Mitteilung von Amtes wegen, 14 Tage – <b>Stillschweigen = Annahme</b> (Art. 517); Aufgaben nach Verfügung, subsidiär Gesetz (Art. 518); Erben können ihn NICHT absetzen (nur Aufsichtsbehörde; ZH: Einzelgericht), aber gegen den Willen ALLER Erben kann er die Teilung nicht durchsetzen; Haftung: Art. 398 ff. OR; strafrechtlich Art. 138 StGB (Veruntreuung) / Art. 158 StGB (ungetreue Geschäftsbesorgung); angemessenes Honorar.</li>
      <li><b>Erbgang:</b> Eröffnung mit dem Tod (Art. 537), letzter Wohnsitz = einheitlicher Gerichtsstand (Art. 538). Erbe braucht: Erbfähigkeit (Art. 539; juristische Personen nie gesetzliche Erben), keine Erbunwürdigkeit (Art. 540: Tötung, Verfügungsunfähigmachen, Arglist/Zwang/Drohung, Testamentsunterdrückung – von Amtes wegen, wie vorverstorben, Nachkommen treten ein, Verzeihung möglich), Erleben des Erbgangs (Kommorienten: Art. 32 Abs. 2; Nasciturus: Art. 544, Teilung verschieben nach Art. 605).</li>
    </ul>

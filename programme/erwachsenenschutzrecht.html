<!DOCTYPE html>
<html lang="de-CH">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Erwachsenenschutzrecht – Lernprogramm (ZGB 360–456)</title>
<style>
:root {
  --navy: #1b3a5c;
  --navy-dunkel: #12283f;
  --blau: #2563a8;
  --blau-hell: #e8f0f9;
  --gold: #b8860b;
  --gruen: #15803d;
  --gruen-hell: #ecfdf3;
  --rot: #b91c1c;
  --rot-hell: #fef2f2;
  --grau: #5b6b7b;
  --grau-hell: #f4f6f8;
  --rand: #d7dfe8;
  --schatten: 0 1px 3px rgba(18, 40, 63, .10), 0 4px 14px rgba(18, 40, 63, .06);
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  margin: 0; padding: 0;
  font-family: "Segoe UI", system-ui, -apple-system, Roboto, "Helvetica Neue", sans-serif;
  color: #1d2b3a; background: #eef2f6;
  font-size: 16px; line-height: 1.55;
}
#app { max-width: 1080px; margin: 0 auto; padding: 24px 20px 80px; }
h1 { font-size: 1.7rem; color: var(--navy); margin: 0 0 4px; line-height: 1.25; }
h2 { font-size: 1.2rem; color: var(--navy); margin: 0 0 10px; }
h3 { font-size: 1.05rem; color: var(--navy); margin: 18px 0 8px; }
h4 { font-size: 1rem; color: var(--navy); margin: 16px 0 6px; }

.btn {
  font: inherit; font-size: .95rem; font-weight: 600;
  padding: 10px 18px; border-radius: 10px; cursor: pointer;
  border: 1.5px solid var(--rand); background: #fff; color: var(--navy);
  transition: all .15s;
}
.btn:hover { border-color: var(--blau); box-shadow: var(--schatten); }
.btn-primary { background: var(--navy); border-color: var(--navy); color: #fff; }
.btn-primary:hover { background: var(--blau); border-color: var(--blau); }
.btn-ghost { border-color: transparent; background: transparent; color: var(--grau); }
.btn-ghost:hover { color: var(--navy); border-color: var(--rand); box-shadow: none; }
.btn:disabled { opacity: .45; cursor: default; pointer-events: none; }

/* ---------- Startseite ---------- */
.home-header {
  background: linear-gradient(135deg, var(--navy) 0%, var(--blau) 100%);
  color: #fff; border-radius: 16px; padding: 32px 32px 26px; box-shadow: var(--schatten);
}
.home-header h1 { color: #fff; font-size: 1.9rem; }
.untertitel { margin: 4px 0 20px; opacity: .85; }
.home-stats { display: flex; gap: 28px; margin-bottom: 20px; flex-wrap: wrap; }
.stat { background: rgba(255,255,255,.12); border-radius: 12px; padding: 12px 22px; }
.stat-zahl { font-size: 1.5rem; font-weight: 700; }
.stat-label { font-size: .82rem; opacity: .85; }
.balken { background: rgba(255,255,255,.25); border-radius: 999px; height: 10px; overflow: hidden; margin: 4px 0 18px; }
.balken > div { background: var(--gold); height: 100%; border-radius: 999px; transition: width .3s; }
.home-actions { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
.home-actions .btn { border-color: rgba(255,255,255,.4); background: rgba(255,255,255,.95); }
.home-actions .btn-ghost { background: transparent; color: rgba(255,255,255,.8); }
.home-actions .btn-ghost:hover { color: #fff; border-color: rgba(255,255,255,.5); }
.hinweis-methodik { color: var(--grau); font-size: .88rem; margin: 16px 4px 20px; }

/* ---------- Themen-Grid ---------- */
.themen-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 14px; }
.thema-card {
  font: inherit; text-align: left; cursor: pointer;
  background: #fff; border: 1.5px solid var(--rand); border-radius: 14px;
  padding: 16px 18px 14px; transition: all .15s; display: flex; flex-direction: column; gap: 5px;
}
.thema-card:hover { border-color: var(--blau); box-shadow: var(--schatten); transform: translateY(-2px); }
.thema-nr { font-size: .78rem; font-weight: 700; color: var(--grau); text-transform: uppercase; letter-spacing: .05em; }
.thema-titel { font-weight: 700; color: var(--navy); font-size: 1.04rem; line-height: 1.3; }
.thema-kurz { color: var(--grau); font-size: .86rem; }
.thema-fuss { margin-top: 8px; display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
.qdots { display: flex; gap: 5px; }
.qdot { width: 13px; height: 13px; border-radius: 999px; background: var(--grau-hell); border: 1.5px solid var(--rand); }
.qdot.d-geloest { background: var(--gruen); border-color: var(--gruen); }
.qdot.d-hilfe { background: #eab308; border-color: #ca9a04; }

.badge { display: inline-block; font-size: .76rem; font-weight: 700; padding: 3px 10px; border-radius: 999px; }
.badge-done { background: var(--gruen-hell); color: var(--gruen); border: 1px solid #bbe7cb; }
.badge-hilfe { background: #fff8e6; color: #92640a; border: 1px solid #f0dca4; }
.badge-open { background: var(--grau-hell); color: var(--grau); border: 1px solid var(--rand); }
.badge-thema { background: var(--blau-hell); color: var(--blau); border: 1px solid #c4d8ee; }

/* ---------- Themen-/Fragenansicht ---------- */
.top-bar { display: flex; justify-content: space-between; margin-bottom: 10px; gap: 10px; flex-wrap: wrap; }
.thema-header { background: #fff; border-radius: 14px; padding: 18px 24px; box-shadow: var(--schatten); border-left: 6px solid var(--navy); }
.thema-kopf { display: flex; justify-content: space-between; gap: 16px; flex-wrap: wrap; align-items: baseline; }
.frage-nav { display: flex; gap: 7px; margin-top: 12px; flex-wrap: wrap; }
.fnav {
  font: inherit; font-weight: 700; font-size: .88rem; cursor: pointer;
  width: 38px; height: 38px; border-radius: 999px; border: 1.5px solid var(--rand);
  background: #fff; color: var(--grau); transition: all .12s;
}
.fnav:hover { border-color: var(--blau); color: var(--blau); }
.fnav.f-aktiv { border-color: var(--navy); background: var(--navy); color: #fff; }
.fnav.f-geloest { border-color: var(--gruen); background: var(--gruen-hell); color: var(--gruen); }
.fnav.f-hilfe { border-color: #ca9a04; background: #fff8e6; color: #92640a; }
.fnav.f-geloest.f-aktiv { background: var(--gruen); color: #fff; }
.fnav.f-hilfe.f-aktiv { background: #ca9a04; color: #fff; }

.frage-card { background: #fff; border-radius: 14px; padding: 22px 26px; box-shadow: var(--schatten); margin-top: 16px; }
.frage-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.frage-nrchip { background: var(--navy); color: #fff; border-radius: 8px; padding: 2px 10px; font-size: .85rem; white-space: nowrap; }
.stufe-sterne { color: var(--gold); font-size: .95rem; letter-spacing: .12em; white-space: nowrap; }
.stern-leer { color: #d5dbe2; }
.typ-label { font-size: .78rem; font-weight: 700; color: var(--grau); text-transform: uppercase; letter-spacing: .05em; }
.frage-text { font-weight: 600; color: var(--navy); margin: 12px 0 14px; font-size: 1.05rem; }

.sachverhalt { background: #fffdf5; border: 1.5px solid #ead9a8; border-radius: 12px; padding: 14px 18px; margin: 12px 0 14px; }
.sachverhalt-titel { color: #7c5e10; font-size: .8rem; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; margin-bottom: 4px; }
.hint { color: var(--grau); font-size: .9em; }

.art {
  display: inline-block; background: var(--blau-hell); color: var(--blau);
  border: 1px solid #c4d8ee; border-radius: 6px; padding: 1px 8px;
  font-size: .8rem; font-weight: 600; cursor: help; white-space: nowrap; margin: 1px 0;
}
.art-zeile { margin-top: 14px; display: flex; flex-wrap: wrap; gap: 4px; align-items: baseline; }

/* Multiple Choice */
.mc-liste { display: flex; flex-direction: column; gap: 8px; }
.mc-opt { display: flex; gap: 10px; align-items: flex-start; border: 1.5px solid var(--rand); border-radius: 10px; padding: 11px 14px; cursor: pointer; background: #fff; transition: all .12s; }
.mc-opt:hover { border-color: var(--blau); }
.mc-opt input { margin-top: 4px; accent-color: var(--navy); flex-shrink: 0; }
.mc-opt.mc-ok { border-color: var(--gruen); background: var(--gruen-hell); }
.mc-opt.mc-bad { border-color: var(--rot); background: var(--rot-hell); }
.mc-opt.mc-dim { opacity: .6; }

/* Mehrfachauswahl-Chips */
.check-grid { display: flex; flex-wrap: wrap; gap: 8px; }
.check-chip input { position: absolute; opacity: 0; pointer-events: none; }
.check-chip span {
  display: inline-block; padding: 9px 16px; border: 1.5px solid var(--rand); border-radius: 999px;
  font-size: .93rem; font-weight: 600; color: var(--grau); cursor: pointer; transition: all .12s; background: #fff;
}
.check-chip input:checked + span { background: var(--navy); border-color: var(--navy); color: #fff; }
.check-chip input:focus-visible + span { box-shadow: 0 0 0 3px rgba(37, 99, 168, .3); }
.check-chip input:disabled + span { cursor: default; }
.check-chip span:hover { border-color: var(--blau); }
.check-chip.chip-ok span { background: var(--gruen); border-color: var(--gruen); color: #fff; }
.check-chip.chip-bad span { background: var(--rot-hell); border-color: var(--rot); color: var(--rot); }
.check-chip.chip-fehlt span { border-color: var(--rot); border-style: dashed; color: var(--rot); background: #fff; }

/* Zuordnen */
.aufgabe-tabelle { width: 100%; border-collapse: collapse; margin: 6px 0 10px; }
.aufgabe-tabelle th {
  text-align: left; font-size: .8rem; text-transform: uppercase; letter-spacing: .04em;
  color: var(--grau); padding: 8px 10px; border-bottom: 2px solid var(--rand);
}
.aufgabe-tabelle td { padding: 10px; border-bottom: 1px solid var(--grau-hell); vertical-align: middle; }
.aufgabe-tabelle tr:last-child td { border-bottom: none; }
.aufgabe-tabelle select {
  font: inherit; font-size: .92rem; padding: 9px 10px; border: 1.5px solid var(--rand); border-radius: 8px;
  max-width: 100%; background: #fff;
}
.aufgabe-tabelle select:focus { outline: none; border-color: var(--blau); box-shadow: 0 0 0 3px rgba(37, 99, 168, .15); }
.row-ok td { background: var(--gruen-hell); }
.row-ok td:first-child { box-shadow: inset 4px 0 0 var(--gruen); }
.row-bad td { background: var(--rot-hell); }
.row-bad td:first-child { box-shadow: inset 4px 0 0 var(--rot); }
.zeile-links { font-weight: 600; color: var(--navy); }

/* Reihenfolge */
.reihe-liste { display: flex; flex-direction: column; gap: 8px; }
.reihe-item {
  font: inherit; text-align: left; display: flex; gap: 12px; align-items: center;
  border: 1.5px solid var(--rand); border-radius: 10px; padding: 10px 14px;
  cursor: pointer; background: #fff; transition: all .12s;
}
.reihe-item:hover { border-color: var(--blau); }
.reihe-num {
  flex-shrink: 0; width: 30px; height: 30px; border-radius: 999px;
  border: 1.5px dashed var(--rand); color: var(--grau);
  display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: .9rem;
}
.reihe-item.gewaehlt .reihe-num { background: var(--navy); border: 1.5px solid var(--navy); color: #fff; }
.reihe-item.reihe-ok { border-color: var(--gruen); background: var(--gruen-hell); }
.reihe-item.reihe-ok .reihe-num { background: var(--gruen); border-color: var(--gruen); color: #fff; }
.reihe-item.reihe-bad { border-color: var(--rot); background: var(--rot-hell); }
.reihe-item.reihe-bad .reihe-num { background: var(--rot); border-color: var(--rot); color: #fff; }

/* Feedback & Lösung */
.frage-actions { display: flex; gap: 10px; margin-top: 16px; flex-wrap: wrap; }
.fb { border-radius: 10px; padding: 12px 16px; font-weight: 600; margin-top: 14px; }
.fb-ok { background: var(--gruen-hell); color: var(--gruen); border: 1px solid #bbe7cb; }
.fb-bad { background: var(--rot-hell); color: var(--rot); border: 1px solid #f3c6c6; }
.fb-info { background: var(--blau-hell); color: var(--blau); border: 1px solid #c4d8ee; }

.solution-box { background: var(--grau-hell); border: 1.5px solid var(--rand); border-radius: 12px; padding: 16px 20px; margin-top: 16px; font-size: .96rem; }
.solution-box > h4 { margin-top: 0; }
.solution-box p { margin: 8px 0; }
.solution-box ul, .solution-box ol { margin: 6px 0; padding-left: 22px; }
.solution-box li { margin-bottom: 4px; }

.merkbox {
  background: #fffdf5; border: 1.5px solid #ead9a8; border-left: 5px solid var(--gold);
  border-radius: 10px; padding: 10px 14px; margin-top: 12px; font-size: .93rem;
}
.merkbox b:first-child { color: #7c5e10; }

/* Spickzettel-Modal */
.modal-hg {
  position: fixed; inset: 0; background: rgba(18, 40, 63, .55); z-index: 50;
  display: flex; align-items: flex-start; justify-content: center; padding: 30px 16px; overflow-y: auto;
}
.modal-box {
  background: #fff; border-radius: 16px; max-width: 880px; width: 100%;
  padding: 26px 30px 30px; box-shadow: 0 10px 40px rgba(0,0,0,.25); position: relative;
}
.modal-schliessen { position: sticky; float: right; top: 0; }
.spick-tabelle { width: 100%; border-collapse: collapse; margin: 8px 0 18px; font-size: .9rem; }
.spick-tabelle th { text-align: left; background: var(--navy); color: #fff; padding: 7px 10px; font-size: .8rem; }
.spick-tabelle td { padding: 7px 10px; border-bottom: 1px solid var(--grau-hell); vertical-align: top; }
.spick-tabelle tr:nth-child(even) td { background: #f8fafc; }

@media (max-width: 640px) {
  #app { padding: 14px 10px 60px; }
  .home-header { padding: 22px 20px 20px; }
  .frage-card { padding: 16px 16px; }
}
</style>
</head>
<body>
<div id="app"></div>
<div id="modal"></div>
<script>
'use strict';

/* =====================  GESETZESTEXTE (Tooltip)  ===================== */
const GESETZ = {
  'Art. 13 ZGB': 'Die Handlungsfähigkeit besitzt, wer volljährig und urteilsfähig ist.',
  'Art. 16 ZGB': 'Urteilsfähig ist jede Person, der nicht wegen ihres Kindesalters, infolge geistiger Behinderung, psychischer Störung, Rausch oder ähnlicher Zustände die Fähigkeit mangelt, vernunftgemäss zu handeln.',
  'Art. 19d ZGB': 'Die Handlungsfähigkeit kann durch eine Massnahme des Erwachsenenschutzes eingeschränkt werden.',
  'Art. 166 ZGB': 'Jeder Ehegatte vertritt während des Zusammenlebens die eheliche Gemeinschaft für die laufenden Bedürfnisse der Familie.',
  'Art. 298a ZGB': 'Sind die Eltern nicht miteinander verheiratet, so sind sie gemeinsam Inhaber der elterlichen Sorge, wenn sie dies in einer gemeinsamen Erklärung festhalten (seit 1.7.2014 ist die gemeinsame Sorge der Regelfall).',
  'Art. 360 ZGB': 'Eine handlungsfähige Person kann eine natürliche oder juristische Person beauftragen, im Fall ihrer Urteilsunfähigkeit die Personensorge oder die Vermögenssorge zu übernehmen oder sie im Rechtsverkehr zu vertreten (Abs. 1). Sie muss die Aufgaben umschreiben und kann Weisungen erteilen (Abs. 2) sowie Ersatzverfügungen treffen (Abs. 3).',
  'Art. 361 ZGB': 'Der Vorsorgeauftrag ist eigenhändig zu errichten oder öffentlich zu beurkunden (Abs. 1). Eigenhändig: von Anfang bis Ende von Hand niederzuschreiben, zu datieren und zu unterzeichnen (Abs. 2). Das Zivilstandsamt trägt Errichtung und Hinterlegungsort auf Antrag in eine zentrale Datenbank ein (Abs. 3).',
  'Art. 362 ZGB': 'Widerruf jederzeit: in einer der Errichtungsformen (Abs. 1) oder durch Vernichtung der Urkunde (Abs. 2). Ein neuer Vorsorgeauftrag tritt an die Stelle des früheren, sofern er nicht zweifellos eine blosse Ergänzung darstellt (Abs. 3).',
  'Art. 363 ZGB': 'Erfährt die KESB von der Urteilsunfähigkeit, prüft sie, ob der Vorsorgeauftrag gültig errichtet worden ist, ob die Voraussetzungen für seine Wirksamkeit eingetreten sind, ob die beauftragte Person geeignet ist und ob weitere Massnahmen erforderlich sind (Abs. 2). Bei Annahme: Hinweis auf die Pflichten nach OR-Auftragsrecht und Aushändigung einer Urkunde über die Befugnisse (Abs. 3).',
  'Art. 370 ZGB': 'Eine urteilsfähige Person kann in einer Patientenverfügung festlegen, welchen medizinischen Massnahmen sie im Fall ihrer Urteilsunfähigkeit zustimmt oder nicht zustimmt (Abs. 1). Sie kann eine natürliche Person bezeichnen, die mit dem Arzt die Massnahmen bespricht und in ihrem Namen entscheidet (Abs. 2).',
  'Art. 371 ZGB': 'Die Patientenverfügung ist schriftlich zu errichten, zu datieren und zu unterzeichnen (Abs. 1 — einfache Schriftlichkeit, Text darf vorgedruckt sein). Errichtung und Hinterlegungsort können auf der Versichertenkarte eingetragen werden (Abs. 2).',
  'Art. 372 ZGB': 'Der Arzt klärt anhand der Versichertenkarte ab, ob eine Patientenverfügung vorliegt (Abs. 1). Er entspricht ihr, ausser sie verstösst gegen gesetzliche Vorschriften oder es bestehen begründete Zweifel, dass sie auf freiem Willen beruht oder noch dem mutmasslichen Willen entspricht (Abs. 2).',
  'Art. 373 ZGB': 'Jede der betroffenen Person nahestehende Person kann schriftlich die KESB anrufen, u. a. wenn der Patientenverfügung nicht entsprochen wird.',
  'Art. 374 ZGB': 'Wer als Ehegatte oder eingetragener Partner mit einer urteilsunfähig gewordenen Person einen gemeinsamen Haushalt führt oder ihr regelmässig und persönlich Beistand leistet, hat von Gesetzes wegen ein Vertretungsrecht (Abs. 1). Es umfasst Rechtshandlungen zur Deckung des Unterhaltsbedarfs, die ordentliche Verwaltung des Einkommens und der übrigen Vermögenswerte und nötigenfalls das Öffnen und Erledigen der Post (Abs. 2).',
  'Art. 375 ZGB': 'Die Ausübung des Vertretungsrechts richtet sich sinngemäss nach den Bestimmungen des OR über den einfachen Auftrag (Art. 394 ff. OR).',
  'Art. 377 ZGB': 'Hat eine urteilsunfähige Person zur medizinischen Behandlung keine Patientenverfügung erlassen, plant der Arzt die Behandlung unter Beizug der zur Vertretung berechtigten Person.',
  'Art. 378 ZGB': 'Vertretungsberechtigt sind der Reihe nach: 1. die in Patientenverfügung oder Vorsorgeauftrag bezeichnete Person; 2. der Beistand mit Vertretungsrecht bei medizinischen Massnahmen; 3. der Ehegatte / eingetragene Partner (gemeinsamer Haushalt oder regelmässiger persönlicher Beistand); 4. die Person im gemeinsamen Haushalt, die Beistand leistet; 5. die Nachkommen; 6. die Eltern; 7. die Geschwister (je wenn sie Beistand leisten). Fehlt eine berechtigte Person, entscheidet die KESB.',
  'Art. 380 ZGB': 'Die Behandlung einer psychischen Störung einer urteilsunfähigen Person in einer psychiatrischen Klinik richtet sich nach den Bestimmungen über die fürsorgerische Unterbringung.',
  'Art. 382 ZGB': 'Wird eine urteilsunfähige Person für längere Dauer in einer Wohn- oder Pflegeeinrichtung betreut, ist schriftlich in einem Betreuungsvertrag festzulegen, welche Leistungen die Einrichtung erbringt und welches Entgelt dafür geschuldet ist.',
  'Art. 383 ZGB': 'Die Einrichtung darf die Bewegungsfreiheit einer urteilsunfähigen Person nur einschränken, wenn eine ernsthafte Gefahr für ihr Leben oder ihre körperliche Integrität oder für Dritte besteht oder eine schwerwiegende Störung des Gemeinschaftslebens beseitigt werden soll — und mildere Massnahmen nicht ausreichen (Abs. 1).',
  'Art. 384 ZGB': 'Über jede Einschränkung der Bewegungsfreiheit wird Protokoll geführt; festzuhalten sind insbesondere der Name der anordnenden Person sowie Zweck, Art und Dauer der Massnahme (Abs. 1).',
  'Art. 388 ZGB': 'Die behördlichen Massnahmen stellen das Wohl und den Schutz hilfsbedürftiger Personen sicher (Abs. 1). Sie sollen die Selbstbestimmung so weit wie möglich erhalten und fördern (Abs. 2).',
  'Art. 389 ZGB': 'Die Behörde ordnet eine Massnahme nur an, wenn die Unterstützung durch Familie, nahestehende Personen oder private/öffentliche Dienste nicht ausreicht und die eigene Vorsorge bzw. Massnahmen von Gesetzes wegen nicht genügen (Abs. 1 — Subsidiarität). Jede Massnahme muss erforderlich und geeignet sein (Abs. 2 — Verhältnismässigkeit).',
  'Art. 392 ZGB': 'Erscheint die Errichtung einer Beistandschaft wegen des Umfangs der Aufgaben als offensichtlich unverhältnismässig, kann die KESB von sich aus das Erforderliche vorkehren, namentlich die Zustimmung zu einem Rechtsgeschäft erteilen oder einer Drittperson für einzelne Aufgaben einen Auftrag erteilen.',
  'Art. 393 ZGB': 'Eine Begleitbeistandschaft wird mit Zustimmung der hilfsbedürftigen Person errichtet, wenn sie für die Erledigung bestimmter Angelegenheiten begleitende Unterstützung braucht (Abs. 1). Sie schränkt die Handlungsfähigkeit nicht ein (Abs. 2).',
  'Art. 394 ZGB': 'Eine Vertretungsbeistandschaft wird errichtet, wenn die hilfsbedürftige Person bestimmte Angelegenheiten nicht erledigen kann und deshalb vertreten werden muss (Abs. 1). Die KESB kann die Handlungsfähigkeit entsprechend einschränken (Abs. 2). Die Person muss sich die Handlungen des Beistands anrechnen oder gefallen lassen (Abs. 3).',
  'Art. 395 ZGB': 'Errichtet die KESB eine Vertretungsbeistandschaft für die Vermögensverwaltung, bestimmt sie die zu verwaltenden Vermögenswerte (Abs. 1 — Vermögensverwaltungsbeistandschaft für Einkommen und/oder Vermögen).',
  'Art. 396 ZGB': 'Eine Mitwirkungsbeistandschaft wird errichtet, wenn bestimmte Handlungen der hilfsbedürftigen Person zu ihrem Schutz der Zustimmung des Beistands bedürfen (Abs. 1). Die Handlungsfähigkeit ist von Gesetzes wegen entsprechend eingeschränkt (Abs. 2).',
  'Art. 397 ZGB': 'Die Begleit-, die Vertretungs- und die Mitwirkungsbeistandschaft können miteinander kombiniert werden.',
  'Art. 398 ZGB': 'Eine umfassende Beistandschaft wird errichtet, wenn eine Person, namentlich wegen dauernder Urteilsunfähigkeit, besonders hilfsbedürftig ist (Abs. 1). Sie bezieht sich auf alle Angelegenheiten der Personensorge, der Vermögenssorge und des Rechtsverkehrs (Abs. 2). Die Handlungsfähigkeit der betroffenen Person entfällt von Gesetzes wegen (Abs. 3).',

  'Art. 432 ZGB': 'Wer in einer Einrichtung untergebracht wird, kann eine Person ihres Vertrauens beiziehen, die sie während des Aufenthalts und bis zum Abschluss aller damit zusammenhängenden Verfahren unterstützt.',
  'Art. 433 ZGB': 'Bei Unterbringung zur Behandlung einer psychischen Störung erstellt der behandelnde Arzt unter Beizug der betroffenen Person (und ggf. ihrer Vertrauensperson) einen schriftlichen Behandlungsplan; er wird der Person zur Zustimmung unterbreitet und laufend angepasst; umfassende Information über alle Umstände der Behandlung.',
  'Art. 434 ZGB': 'Fehlt die Zustimmung, kann der Chefarzt die im Behandlungsplan vorgesehenen Massnahmen schriftlich anordnen, wenn ohne Behandlung ein ernsthafter gesundheitlicher Schaden oder eine erhebliche Gefährdung Dritter droht, die Person urteilsunfähig bezüglich ihrer Behandlungsbedürftigkeit ist und keine mildere Massnahme zur Verfügung steht.',
  'Art. 435 ZGB': 'In einer Notfallsituation können die zum Schutz der betroffenen Person oder Dritter unerlässlichen medizinischen Massnahmen sofort ergriffen werden.',

  'Art. 440 ZGB': 'Die Erwachsenenschutzbehörde ist eine Fachbehörde; die Kantone bestimmen sie (Abs. 1). Sie fällt ihre Entscheide in der Regel mit mindestens drei Mitgliedern; Ausnahmen (Einzelzuständigkeit) sind möglich (Abs. 2). Sie ist zugleich Kindesschutzbehörde (Abs. 3).',

{ id: 'T2F7', thema: 2, stufe: 7, typ: 'mc',
  sachverhalt: 'Die betagte Frau B kommt mit ihrer Post und ihren Zahlungen nicht mehr zurecht. Ihre Tochter wohnt im gleichen Haus, hat eine Bankvollmacht und erledigt seit Jahren zuverlässig alle administrativen und finanziellen Angelegenheiten. Ein besorgter Nachbar meldet der KESB, Frau B sei «offensichtlich überfordert und brauche einen Beistand».',

    'Sie errichtet eine Begleitbeistandschaft (Art. 393 ZGB), da dies der mildeste Eingriff ist',

  richtig: 0,
  artikel: ['Art. 389 ZGB', 'Art. 443 ZGB'],
  erklaerung: '<p><b>Subsidiarität (Art. 389 Abs. 1 ZGB):</b> Die KESB ordnet eine Massnahme nur an, wenn die Unterstützung durch die <b>Familie</b>, nahestehende Personen oder private/öffentliche Dienste <b>nicht ausreicht</b>.</p><p>Hier funktioniert die private Lösung (Tochter mit Vollmacht) — es besteht kein Schutzbedürfnis, also keine Massnahme. Die Meldung des Nachbarn (Melderecht, Art. 443 ZGB) löst zwar eine Prüfung aus, verpflichtet die KESB aber nicht zur Anordnung.</p>' },

{ id: 'T3F7', thema: 3, stufe: 7, typ: 'mc',
  sachverhalt: 'Die 84-jährige Frau K leidet an fortgeschrittener Demenz. Sie kann weder ihre administrativen und finanziellen Angelegenheiten besorgen noch rechtsgültig eine Vollmacht erteilen; Angehörige fehlen. Ein KESB-Mitglied schlägt vor, wegen der dauernden Urteilsunfähigkeit eine umfassende Beistandschaft zu errichten.',

    'Nein — bei Demenz ist einzig die fürsorgerische Unterbringung zulässig (Art. 426 ZGB)',
    'Ja — ohne Angehörige ist die umfassende Beistandschaft zwingend (Art. 390 ZGB)'

  richtig: 0,
  artikel: ['Art. 394 ZGB', 'Art. 395 ZGB', 'Art. 398 ZGB'],
  erklaerung: '<p><b>Kurs-Merksatz: Keine umfassende Beistandschaft für demente Betagte!</b></p><p>In der Regel genügt die <b>Vertretungsbeistandschaft mit Vermögensverwaltung (Art. 394 i.V.m. Art. 395 ZGB)</b> — sie ist massgeschneidert und verhältnismässig.</p><p>Die umfassende Beistandschaft (398) bleibt Fällen besonderer Hilfsbedürftigkeit vorbehalten (Kursbeispiel: Herr X, der sich für Napoleon hält, Grossprojekte plant und laufend krass nachteilige Verträge schliesst).</p>' },

  ],
  richtig: 0,
  artikel: ['Art. 454 ZGB', 'Art. 455 ZGB', 'Art. 456 ZGB'],
  erklaerung: '<p><b>Art. 454 ZGB:</b> Wer im Rahmen behördlicher Massnahmen durch widerrechtliches Handeln oder Unterlassen verletzt wird, hat Anspruch auf <b>Schadenersatz</b> und — sofern die Schwere der Verletzung es rechtfertigt — auf <b>Genugtuung</b> (Abs. 1).</p><p>Haftbar ist <b>ausschliesslich der Kanton</b> (Abs. 3 — Kausalhaftung); die geschädigte Person hat <b>keinen</b> direkten Anspruch gegen die verursachende Person. Der Rückgriff des Kantons richtet sich nach kantonalem Recht.</p><p><b>Verjährung:</b> nach den OR-Regeln über die unerlaubten Handlungen (Art. 455 ZGB). Die Haftung der <b>vorsorgebeauftragten Person</b> und des vertretungsberechtigten Ehegatten richtet sich dagegen nach dem <b>OR-Auftragsrecht</b> (Art. 456 ZGB).</p>' },

/* ---------- THEMA 5: Der Vorsorgeauftrag ---------- */
{ id: 'T5F1', thema: 5, stufe: 1, typ: 'multi',
  frage: 'Für welche Bereiche kann mit einem Vorsorgeauftrag vorgesorgt werden (Art. 360 Abs. 1 ZGB)? <span class="hint">(mehrere Antworten richtig)</span>',
  optionen: [
    'Personensorge',
    'Vermögenssorge',
    'Vertretung im Rechtsverkehr',
    'Verteilung des Nachlasses',
    'Bestimmung der Grabstätte'
  ],
  richtig: [0, 1, 2],
  artikel: ['Art. 360 ZGB'],
  erklaerung: '<p>Mit dem Vorsorgeauftrag kann eine Person für den Fall ihrer Urteilsunfähigkeit eine andere Person beauftragen mit</p><ul><li>der <b>Personensorge</b>,</li><li>der <b>Vermögenssorge</b> oder</li><li>der <b>Vertretung im Rechtsverkehr</b>.</li></ul><p>Der Auftrag kann eine <b>Generalvollmacht</b> sein (faktisch wie eine umfassende Beistandschaft nach Art. 398) oder sich auf konkrete Rechtsgeschäfte beschränken. Nachlassverteilung und Bestattung gehören ins Erbrecht bzw. zu den Anordnungen für den Todesfall.</p>' },

{ id: 'T5F2', thema: 5, stufe: 2, typ: 'mc',
  frage: 'Wer kann einen Vorsorgeauftrag errichten — und wer kann beauftragt werden?',
  optionen: [
    'Errichten kann ihn nur eine <b>handlungsfähige</b> Person; beauftragt werden kann eine natürliche <b>oder juristische</b> Person',
    'Errichten kann ihn jede urteilsfähige Person; beauftragt werden können nur Familienangehörige',
    'Errichten kann ihn jede volljährige Person; beauftragt werden kann nur eine natürliche Person',
    'Errichten kann ihn nur, wer bereits verbeiständet ist; beauftragt wird immer die KESB'
  ],
  richtig: 0,
  artikel: ['Art. 360 ZGB', 'Art. 13 ZGB'],
  erklaerung: '<p><b>Art. 360 Abs. 1 ZGB:</b> Die auftraggebende Person muss <b>handlungsfähig</b> sein (volljährig und urteilsfähig, Art. 13).</p><p>Beauftragt werden kann eine <b>natürliche oder juristische Person</b> — z. B. auch eine Bank oder Treuhandgesellschaft.</p><div class="merkbox"><b>Vergleich:</b> Für die Patientenverfügung genügt die <b>Urteilsfähigkeit</b> — dort kann nur eine natürliche Person als Vertretung bezeichnet werden.</div>' },

{ id: 'T5F3', thema: 5, stufe: 3, typ: 'mc',
  frage: 'Welche Formen sind für den Vorsorgeauftrag zulässig (Art. 361 ZGB)?',
  optionen: [
    'Öffentliche Beurkundung <b>oder</b> eigenhändige Errichtung: von Anfang bis Ende von Hand niedergeschrieben, datiert und unterzeichnet',

    'Nur die öffentliche Beurkundung beim Notar'
  ],
  richtig: 0,
  artikel: ['Art. 361 ZGB', 'Art. 505 ZGB'],
  erklaerung: '<p><b>Art. 361 Abs. 1 ZGB:</b> Der Vorsorgeauftrag wird <b>öffentlich beurkundet</b> oder <b>eigenhändig</b> errichtet.</p><p>Für die eigenhändige Errichtung gelten wie beim eigenhändigen Testament (vgl. Art. 505 ZGB) erhöhte Anforderungen (Abs. 2): <b>von A–Z handschriftlich</b>, datiert und unterzeichnet.</p><p>Blosse einfache Schriftlichkeit (Computertext + Unterschrift) genügt <b>nicht</b> — das reicht nur für die Patientenverfügung.</p>' },

{ id: 'T5F4', thema: 5, stufe: 4, typ: 'mc',
  frage: 'Wann entfaltet der Vorsorgeauftrag seine Wirkung?',
  optionen: [
    'Wenn die auftraggebende Person urteilsunfähig geworden ist — die Urteilsunfähigkeit muss nicht endgültig sein, aber von einer gewissen Dauer; die KESB prüft die Wirksamkeit (Validierung)',
    'Sofort mit der Unterzeichnung',
    'Erst mit dem Tod der auftraggebenden Person',
    'Automatisch bei der ersten Spitaleinweisung, ohne jede behördliche Prüfung'
  ],
  richtig: 0,
  artikel: ['Art. 363 ZGB'],
  erklaerung: '<p>Der Vorsorgeauftrag entfaltet Wirkung, sobald die auftraggebende Person <b>urteilsunfähig</b> geworden ist. Vorausgesetzt ist keine endgültige, aber eine Urteilsunfähigkeit <b>von einer gewissen Dauer</b>.</p><p>Die Wirksamkeit tritt nicht «automatisch» ein: Die KESB <b>validiert</b> den Auftrag (Art. 363 ZGB) und händigt der beauftragten Person bei Annahme eine <b>Urkunde</b> über ihre Befugnisse aus.</p><div class="merkbox"><b>Wichtig:</b> Amtliche Schutzmassnahmen gehen den Weisungen des Vorsorgeauftrags vor.</div>' },

{ id: 'T5F5', thema: 5, stufe: 5, typ: 'multi',
  frage: 'Was prüft die KESB bei der Validierung des Vorsorgeauftrags (Art. 363 Abs. 2 ZGB)? <span class="hint">(mehrere Antworten richtig)</span>',
  optionen: [
    'Ob der Vorsorgeauftrag gültig errichtet worden ist',
    'Ob die Voraussetzungen für seine Wirksamkeit eingetreten sind',
    'Ob die beauftragte Person für ihre Aufgaben geeignet ist',
    'Ob weitere Massnahmen des Erwachsenenschutzes erforderlich sind',
    'Ob die gesetzlichen Erben mit dem Auftrag einverstanden sind',
    'Ob der Auftrag bei einem Notar hinterlegt wurde'
  ],
  richtig: [0, 1, 2, 3],
  artikel: ['Art. 363 ZGB'],
  erklaerung: '<p>Erfährt die KESB, dass eine Person urteilsunfähig geworden ist (nötigenfalls Nachfrage beim Zivilstandsamt), prüft sie <b>vier Punkte</b> (Art. 363 Abs. 2 ZGB):</p><ol><li>gültige <b>Errichtung</b>,</li><li>Eintritt der <b>Wirksamkeitsvoraussetzungen</b> (Urteilsunfähigkeit),</li><li><b>Eignung</b> der beauftragten Person,</li><li>Erforderlichkeit <b>weiterer Massnahmen</b>.</li></ol><p>Nimmt die beauftragte Person den Auftrag an, weist die Behörde sie auf die Pflichten nach den <b>OR-Auftragsregeln</b> hin und händigt ihr eine Urkunde über ihre Befugnisse aus (Abs. 3). Die Zustimmung der Erben ist irrelevant.</p>' },

{ id: 'T5F6', thema: 5, stufe: 6, typ: 'mc',

    'Jederzeit in einer der Errichtungsformen oder durch Vernichtung der Urkunde; ein neuer Vorsorgeauftrag tritt an die Stelle des früheren, sofern er nicht zweifellos eine blosse Ergänzung darstellt',
    'Nur mit Zustimmung der beauftragten Person und der KESB',
    'Nur durch öffentliche Beurkundung des Widerrufs',
    'Ein einmal errichteter Vorsorgeauftrag ist unwiderruflich'
  ],
  richtig: 0,
  artikel: ['Art. 362 ZGB', 'Art. 361 ZGB'],
  erklaerung: '<p><b>Art. 362 ZGB</b> — Widerruf <b>jederzeit</b> möglich:</p><ul><li>in einer der <b>Errichtungsformen</b> (eigenhändig oder öffentlich beurkundet, Abs. 1),</li><li>durch <b>Vernichtung</b> der Urkunde (Abs. 2),</li><li>durch <b>Neuerstellung</b>: der neue Auftrag ersetzt den früheren, sofern er nicht zweifellos eine blosse Ergänzung ist (Abs. 3).</li></ul><p><b>Hinterlegung:</b> je nach Kanton bei der KESB (z. B. ZH) oder Mitteilungsvermerk beim Zivilstandsamt mit Hinterlegungsort (z. B. LU); Eintrag in die zentrale Datenbank auf Antrag (Art. 361 Abs. 3).</p>' },

{ id: 'T5F7', thema: 5, stufe: 7, typ: 'mc',
  sachverhalt: 'Herr M (62, handlungsfähig) schreibt seinen Vorsorgeauftrag am Computer, druckt ihn aus und versieht ihn eigenhändig mit Ort, Datum und Unterschrift. Er setzt seine Ehefrau als Beauftragte ein. Drei Jahre später erleidet er einen schweren Hirnschlag und wird dauerhaft urteilsunfähig.',
  frage: 'Kann die Ehefrau gestützt auf diesen Vorsorgeauftrag handeln?',
  optionen: [
    'Nein — der Auftrag ist formungültig: Er wurde weder öffentlich beurkundet noch von A–Z handschriftlich errichtet; die KESB wird dies bei der Validierung feststellen',
    'Ja — Datum und Unterschrift von Hand genügen, der Text darf am Computer erstellt sein',
    'Ja — als Ehefrau braucht sie ohnehin keinen Vorsorgeauftrag, sie hat automatisch eine unbeschränkte Generalvollmacht',
    'Nein — Vorsorgeaufträge zugunsten des Ehegatten sind unzulässig'
  ],
  richtig: 0,
  artikel: ['Art. 361 ZGB', 'Art. 363 ZGB', 'Art. 374 ZGB'],
  erklaerung: '<p>Der Auftrag ist <b>formungültig</b>: Art. 361 ZGB verlangt öffentliche Beurkundung <b>oder</b> vollständig eigenhändige Errichtung (von A–Z von Hand, datiert, unterzeichnet). «Nur» handschriftliches Datum und Unterschrift genügen bei der <b>Patientenverfügung</b> (Art. 371), nicht beim Vorsorgeauftrag.</p><p>Die KESB stellt die Ungültigkeit bei der <b>Validierung</b> (Art. 363) fest. Immerhin: Als Ehefrau mit gemeinsamem Haushalt hat sie das <b>gesetzliche Vertretungsrecht</b> nach Art. 374 ZGB — dieses ist aber auf Unterhaltsbedarf, ordentliche Verwaltung und Post beschränkt; für Weitergehendes braucht es eine Beistandschaft.</p>' },

/* ---------- THEMA 6: Die Patientenverfügung ---------- */
{ id: 'T6F1', thema: 6, stufe: 1, typ: 'mc',
  frage: 'Wer kann eine Patientenverfügung errichten?',
  optionen: [
    'Jede <b>urteilsfähige</b> Person — Handlungsfähigkeit ist nicht erforderlich',
    'Nur handlungsfähige Personen (volljährig und urteilsfähig)',

    'Nur Personen, die bereits in ärztlicher Behandlung sind'
  ],
  richtig: 0,
  artikel: ['Art. 370 ZGB', 'Art. 16 ZGB'],
  erklaerung: '<p><b>Art. 370 Abs. 1 ZGB:</b> Eine <b>urteilsfähige</b> Person kann in einer Patientenverfügung festlegen, welchen medizinischen Massnahmen sie im Fall ihrer Urteilsunfähigkeit zustimmt oder nicht zustimmt.</p><p>Anders als beim Vorsorgeauftrag (Art. 360: Handlungsfähigkeit) genügt die <b>Urteilsfähigkeit</b> — auch urteilsfähige Minderjährige oder verbeiständete Personen können eine Patientenverfügung errichten, denn es geht um höchstpersönliche Rechte.</p>' },

  optionen: [

  artikel: ['Art. 370 ZGB'],
  erklaerung: '<p><b>Art. 370 ZGB:</b></p><ul><li><b>Abs. 1:</b> Festlegung, welchen medizinischen Massnahmen die Person im Fall der Urteilsunfähigkeit <b>zustimmt oder nicht zustimmt</b> (z. B. lebensverlängernde Massnahmen, künstliche Ernährung, Reanimation).</li><li><b>Abs. 2:</b> Bezeichnung einer <b>natürlichen Person</b>, die mit dem Arzt die Massnahmen bespricht und entscheidet; ihr können Weisungen erteilt werden.</li><li><b>Abs. 3:</b> <b>Ersatzverfügungen</b> für den Fall, dass die bezeichnete Person ungeeignet ist, ablehnt oder kündigt.</li></ul>' },

{ id: 'T6F3', thema: 6, stufe: 3, typ: 'mc',
  frage: 'Welche Form muss die Patientenverfügung erfüllen (Art. 371 Abs. 1 ZGB)?',
  optionen: [
    'Einfache Schriftlichkeit: schriftlich errichtet, datiert und unterzeichnet — der Text darf vorgedruckt oder am Computer erstellt sein',

  artikel: ['Art. 371 ZGB'],
  erklaerung: '<p><b>Art. 371 Abs. 1 ZGB</b> verlangt einfache <b>Schriftlichkeit</b>: Die Patientenverfügung ist schriftlich zu errichten, zu <b>datieren</b> und zu <b>unterzeichnen</b>.</p><p>«Nur» Datum und Unterschrift müssen handschriftlich sein — der Text darf (anders als beim eigenhändigen Vorsorgeauftrag) vorgedruckt oder am Computer erstellt sein (z. B. Musterformulare von Pro Senectute/«Docupass» oder der KESB ZH).</p><p>Sie kann <b>jederzeit</b> widerrufen und abgeändert werden.</p>' },

{ id: 'T6F5', thema: 6, stufe: 5, typ: 'mc',

  richtig: 0,

  erklaerung: '<p><b>Art. 372 Abs. 2 ZGB:</b> Der Arzt entspricht der Patientenverfügung, <b>ausser</b></p><ul><li>sie verstösst gegen <b>gesetzliche Vorschriften</b> (z. B. Verlangen einer aktiven direkten Sterbehilfe) oder</li><li>es bestehen <b>begründete Zweifel</b>, dass sie auf <b>freiem Willen</b> beruht oder noch dem <b>mutmasslichen Willen</b> entspricht.</li></ul><p>Der Wille der Angehörigen und das Alter der Verfügung sind für sich allein keine Gründe. Die Verfügung ist <b>für Dritte bindend</b>.</p>' },

{ id: 'T6F6', thema: 6, stufe: 6, typ: 'mc',

  erklaerung: '<p><b>Art. 373 ZGB:</b> Jede der betroffenen Person <b>nahestehende Person</b> kann <b>schriftlich die KESB anrufen</b>, wenn</p><ul><li>der Patientenverfügung nicht entsprochen wird,</li><li>die Interessen der urteilsunfähigen Person gefährdet sind oder</li><li>die Patientenverfügung nicht auf freiem Willen beruht.</li></ul><p>Daneben können auch <b>Anordnungen für den Todesfall</b> getroffen werden (Bestattungswünsche, Sterbebegleitung, Organentnahme etc.) — diese sind im ZGB nicht als eigenes Institut des Erwachsenenschutzrechts geregelt, aber praktisch bedeutsam.</p>' },

/* ---------- THEMA 7: Gesetzliche Vertretung Urteilsunfähiger ---------- */
{ id: 'T7F1', thema: 7, stufe: 1, typ: 'mc',
  frage: 'Wann kommen die gesetzlichen Auffangregeln der Art. 374 ff. ZGB zum Zug?',
  optionen: [
    'Wenn eine urteilsunfähig gewordene Person weder einen Vorsorgeauftrag noch eine Patientenverfügung errichtet hat',

  ],
  richtig: 0,
  artikel: ['Art. 374 ZGB'],
  erklaerung: '<p>Hat eine urteilsunfähig gewordene Person <b>weder Vorsorgeauftrag noch Patientenverfügung</b> erlassen, greifen die gesetzlichen Auffangregeln:</p><ul><li>gesetzliches <b>Vertretungsrecht</b> des Ehegatten/eingetragenen Partners (Art. 374–376),</li><li>Vertretung bei <b>medizinischen Massnahmen</b> (Art. 377–381),</li><li>Regeln zum Aufenthalt in <b>Wohn- und Pflegeeinrichtungen</b> (Art. 382–387).</li></ul><p>Diese Massnahmen «von Gesetzes wegen» sind nicht behördlich — sie entstehen ohne Anordnung.</p>' },

{ id: 'T7F2', thema: 7, stufe: 2, typ: 'mc',
  frage: 'Wer hat das gesetzliche Vertretungsrecht nach Art. 374 ZGB?',
  optionen: [
    'Der Ehegatte oder eingetragene Partner, der mit der urteilsunfähigen Person einen gemeinsamen Haushalt führt <b>oder</b> ihr regelmässig und persönlich Beistand leistet',

  richtig: 0,
  artikel: ['Art. 374 ZGB'],
  erklaerung: '<p><b>Art. 374 Abs. 1 ZGB:</b> Das gesetzliche Vertretungsrecht hat, wer als <b>Ehegatte oder eingetragene Partnerin/Partner</b></p><ul><li>mit der urteilsunfähigen Person einen <b>gemeinsamen Haushalt</b> führt <b>oder</b></li><li>ihr <b>regelmässig und persönlich Beistand</b> leistet.</li></ul><p>Konkubinatspartner und Kinder haben dieses Vertretungsrecht <b>nicht</b> (sie kommen erst in der Kaskade von Art. 378 bei medizinischen Massnahmen zum Zug).</p>' },

{ id: 'T7F4', thema: 7, stufe: 4, typ: 'mc',
  frage: 'Wie und wann entsteht das gesetzliche Vertretungsrecht nach Art. 374 ZGB?',

  erklaerung: '<p><b>Art. 375 ZGB</b> verweist für die Ausübung des Vertretungsrechts sinngemäss auf die Bestimmungen über den <b>einfachen Auftrag (Art. 394–406 OR)</b>.</p><p>Das bedeutet: Der vertretende Ehegatte untersteht der <b>Sorgfalts- und Treuepflicht</b> (Art. 398 OR) sowie der <b>Rechenschafts- und Herausgabepflicht</b> (Art. 400 OR) — er muss im Interesse der urteilsunfähigen Person handeln und über seine Tätigkeit Rechenschaft ablegen können.</p><p><span class="hint">Hinweis: Die Kursfolie schrieb versehentlich «Art. 394–406 ZGB» — richtig ist OR, denn der einfache Auftrag ist im Obligationenrecht geregelt.</span></p>' },

{ id: 'T7F7', thema: 7, stufe: 7, typ: 'mc',
  sachverhalt: 'Frau T ist urteilsunfähig und leidet an einer schweren psychischen Störung. Sie wird zur Behandlung in eine psychiatrische Klinik eingewiesen. Ihr Ehemann verlangt, gestützt auf die Vertretungskaskade über die Medikation zu entscheiden — schliesslich stehe er an dritter Stelle der Kaskade.',
  frage: 'Kann der Ehemann über die Behandlung der psychischen Störung entscheiden?',
  optionen: [
    'Nein — die Behandlung einer psychischen Störung in einer psychiatrischen Klinik richtet sich nach den FU-Regeln (Art. 380 i.V.m. Art. 426 ff. ZGB); die Stellvertreterregeln kommen dort nicht zur Anwendung',
    'Ja — die Kaskade von Art. 378 ZGB gilt für alle medizinischen Massnahmen ohne Ausnahme',
    'Ja, aber nur zusammen mit den Nachkommen (Art. 378 Abs. 1 Ziff. 5 ZGB)',
    'Nein — bei psychischen Störungen entscheidet immer das Gericht (Art. 439 ZGB)'
  ],
  richtig: 0,
  artikel: ['Art. 380 ZGB', 'Art. 433 ZGB', 'Art. 378 ZGB'],
  erklaerung: '<p><b>Art. 380 ZGB:</b> Die Behandlung einer <b>psychischen Störung</b> einer urteilsunfähigen Person <b>in einer psychiatrischen Klinik</b> richtet sich nach den Bestimmungen über die <b>fürsorgerische Unterbringung</b> (Art. 426 ff., insb. Art. 433 ff. ZGB: Behandlungsplan).</p><p>Die gesetzliche Vertretungsregel (Kaskade Art. 378) gilt hier <b>nicht</b> — der Ehemann hat kein Entscheidungsrecht über die Psychiatrie-Behandlung. Er kann Frau T aber als <b>Vertrauensperson</b> (Art. 432) unterstützen.</p>' },

{ id: 'T8F7', thema: 8, stufe: 7, typ: 'mc',

/* ---------- THEMA 9: FU – Grundlagen & Voraussetzungen ---------- */

{ id: 'T9F2', thema: 9, stufe: 2, typ: 'multi',

  richtig: [0, 1, 2],
  artikel: ['Art. 426 ZGB'],
  erklaerung: '<p><b>Art. 426 Abs. 1 ZGB</b> nennt abschliessend drei Schwächezustände:</p><ul><li><b>psychische Störung</b>,</li><li><b>geistige Behinderung</b>,</li><li><b>schwere Verwahrlosung</b>.</li></ul><p>Urteilsunfähigkeit, Verschwendung oder Alter sind <b>keine</b> FU-Gründe. (Verschwendung war noch ein Entmündigungsgrund des alten Rechts.)</p>' },

{ id: 'T9F5', thema: 9, stufe: 5, typ: 'multi',

  return session[q.id];
}

/* Zufällige Anzeigereihenfolge der Antwortoptionen (pro Frage und Sitzung stabil) */
function permFuer(st, n) {
  if (!st.perm || st.perm.length !== n) {
    const a = Array.from({ length: n }, (_, i) => i);
    for (let i = n - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      const h = a[i]; a[i] = a[j]; a[j] = h;
    }
    st.perm = a;
  }
  return st.perm;
}

let ansicht = { seite: 'home', thema: 1, frage: 0 };

function fragenZu(nr) { return FRAGEN.filter(f => f.thema === nr); }
function statusVon(q) { return store.status[q.id] || null; }
function esc(t) { return String(t).replace(/&/g, '&amp;').replace(/</g, '&lt;'); }

function artBadges(liste) {
  if (!liste || !liste.length) return '';
  const b = liste.map(a => '<span class="art" title="' + esc(GESETZ[a] || '') + '">' + a + '</span>').join(' ');
  return '<div class="art-zeile"><span class="hint">Gesetzesartikel (mit Maus darüberfahren):</span> ' + b + '</div>';
}

function sterne(stufe) {
  let s = '';
  for (let i = 1; i <= 7; i++) s += i <= stufe ? '★' : '<span class="stern-leer">★</span>';
  return '<span class="stufe-sterne" title="Schwierigkeit ' + stufe + ' von 7">' + s + '</span>';

function oeffneThema(nr) {
  ansicht = { seite: 'thema', thema: nr, frage: 0 };
  const fs = fragenZu(nr);
  const erste = fs.findIndex(q => !statusVon(q));
  if (erste > 0) ansicht.frage = erste;
  render();
}

function allesZuruecksetzen() {
  if (!confirm('Ganzen Fortschritt löschen?')) return;
  store = { status: {} };
  speichern();
  Object.keys(session).forEach(k => delete session[k]);
  render();
}

/* ---------- Fragenansicht ---------- */
function renderThema() {
  const t = THEMEN[ansicht.thema - 1];
  const fs = fragenZu(t.nr);
  const q = fs[ansicht.frage];
  const st = sess(q);
  const gespeichert = statusVon(q);

  const nav = fs.map((f, i) => {
    const s = statusVon(f);
    const cls = ['fnav'];
    if (i === ansicht.frage) cls.push('f-aktiv');
    if (s === 'geloest') cls.push('f-geloest');
    if (s === 'hilfe') cls.push('f-hilfe');
    return '<button class="' + cls.join(' ') + '" onclick="geheZuFrage(' + i + ')" title="Frage ' + (i + 1) + '">' + (i + 1) + '</button>';
  }).join('');

  let inhalt = '';
  if (q.typ === 'mc') inhalt = uiMC(q, st);
  else if (q.typ === 'multi') inhalt = uiMulti(q, st);
  else if (q.typ === 'zuordnen') inhalt = uiZuordnen(q, st);
  else if (q.typ === 'reihenfolge') inhalt = uiReihenfolge(q, st);

  const fertig = st.korrekt || gespeichert;

  else if (gespeichert && !st.korrekt) feedback = '<div class="fb fb-info">Diese Frage hast du bereits ' + (gespeichert === 'geloest' ? 'selbständig gelöst' : 'mit Lösungshilfe gelöst') + '. Du kannst sie erneut bearbeiten.</div>';

    ? '<button class="btn btn-primary" onclick="geheZuFrage(' + (ansicht.frage + 1) + ')">Nächste Frage →</button>'

      '<button class="btn btn-ghost" onclick="zurUebersicht()">← Zur Übersicht</button>' +

      '<div class="thema-kopf"><h2>' + t.icon + ' Thema ' + t.nr + ': ' + t.titel + '</h2><span class="badge badge-thema">Frage ' + (ansicht.frage + 1) + ' von ' + fs.length + '</span></div>' +

    '</div>' +

      '<div class="frage-head">' +
        '<span><span class="frage-nrchip">Frage ' + (ansicht.frage + 1) + '</span> ' + sterne(q.stufe) + '</span>' +
        '<span class="typ-label">' + TYP_LABEL[q.typ] + '</span>' +

      (q.sachverhalt ? '<div class="sachverhalt"><div class="sachverhalt-titel">Sachverhalt</div>' + q.sachverhalt + '</div>' : '') +
      '<div class="frage-text">' + q.frage + '</div>' +

        (!st.korrekt ? '<button class="btn btn-primary" onclick="pruefen()">Prüfen</button>' : '') +
        (!st.loesungOffen ? '<button class="btn" onclick="zeigeLoesung()">Lösung anzeigen</button>' : '') +
        (!st.korrekt ? '<button class="btn btn-ghost" onclick="frageZuruecksetzen()">Eingaben zurücksetzen</button>' : '') +
        (fertig ? weiter : '') +
      '</div>' +

      loesung +
      artBadges(q.artikel) +

      (ansicht.frage > 0 ? '<button class="btn" onclick="geheZuFrage(' + (ansicht.frage - 1) + ')">← Vorherige</button>' : '<span></span>') +

function zurUebersicht() { ansicht = { seite: 'home', thema: 1, frage: 0 }; render(); }
function geheZuFrage(i) { ansicht.frage = i; render(); window.scrollTo(0, 0); }

/* ---------- UI-Bausteine pro Fragetyp ---------- */
function uiMC(q, st) {
  return '<div class="mc-liste">' + permFuer(st, q.optionen.length).map(i => {
    const o = q.optionen[i];
    const cls = ['mc-opt'];
    if (st.geprueft || st.korrekt) {
      if (st.korrekt && i === q.richtig) cls.push('mc-ok');
      else if (!st.korrekt && st.sel === i && i !== q.richtig) cls.push('mc-bad');
      else if (st.korrekt && i !== q.richtig) cls.push('mc-dim');
    }
    return '<label class="' + cls.join(' ') + '"><input type="radio" name="mc" ' + (st.sel === i ? 'checked' : '') + (st.korrekt ? ' disabled' : '') + ' onchange="waehleMC(' + i + ')"><span>' + o + '</span></label>';
  }).join('') + '</div>';
}
function waehleMC(i) { const q = aktuelleFrage(); const st = sess(q); st.sel = i; st.geprueft = false; }

function uiMulti(q, st) {
  return '<div class="check-grid">' + permFuer(st, q.optionen.length).map(i => {
    const o = q.optionen[i];
    const cls = ['check-chip'];
    if (st.geprueft || st.korrekt) {
      const soll = q.richtig.includes(i), ist = st.set.has(i);
      if (ist && soll) cls.push('chip-ok');
      else if (ist && !soll) cls.push('chip-bad');
      else if (!ist && soll && (st.korrekt || st.geprueft)) cls.push('chip-fehlt');
    }
    return '<label class="' + cls.join(' ') + '"><input type="checkbox" ' + (st.set.has(i) ? 'checked' : '') + (st.korrekt ? ' disabled' : '') + ' onchange="toggleMulti(' + i + ')"><span>' + o + '</span></label>';
  }).join('') + '</div><p class="hint" style="margin:8px 0 0">Alle zutreffenden Antworten anklicken.</p>';
}
function toggleMulti(i) { const q = aktuelleFrage(); const st = sess(q); if (st.set.has(i)) st.set.delete(i); else st.set.add(i); st.geprueft = false; }

function uiZuordnen(q, st) {
  const zeilen = q.zeilen.map((z, i) => {
    let cls = '';
    if (st.geprueft || st.korrekt) cls = (st.zuord[i] === z.rechts) ? 'row-ok' : 'row-bad';
    const opts = ['<option value="">– bitte wählen –</option>'].concat(
      q.optionen.map(o => '<option value="' + esc(o) + '" ' + (st.zuord[i] === o ? 'selected' : '') + '>' + o + '</option>')
    ).join('');
    return '<tr class="' + cls + '"><td class="zeile-links">' + z.links + '</td><td><select ' + (st.korrekt ? 'disabled' : '') + ' onchange="waehleZuord(' + i + ', this.value)">' + opts + '</select></td></tr>';
  }).join('');
  return '<table class="aufgabe-tabelle"><thead><tr><th>Aussage</th><th>Zuordnung</th></tr></thead><tbody>' + zeilen + '</tbody></table>';
}
function waehleZuord(i, v) { const q = aktuelleFrage(); const st = sess(q); st.zuord[i] = v; st.geprueft = false; }

function uiReihenfolge(q, st) {
  const anzeige = q.anzeige || q.items.map((_, i) => i);
  return '<p class="hint" style="margin:0 0 10px">Klicke die Einträge in der richtigen Reihenfolge an (1., 2., 3., …). Erneutes Klicken entfernt die Nummer.</p>' +
    '<div class="reihe-liste">' + anzeige.map(idx => {
      const pos = st.ordnung.indexOf(idx);
      const cls = ['reihe-item'];
      if (pos >= 0) cls.push('gewaehlt');
      if (st.geprueft || st.korrekt) {
        if (pos >= 0 && st.ordnung[pos] === idx && q.items[pos] === q.items[idx] && pos === idx) cls.push('reihe-ok');
        else if (pos >= 0) cls.push(pos === idx ? 'reihe-ok' : 'reihe-bad');
      }
      return '<button class="' + cls.join(' ') + '" ' + (st.korrekt ? 'disabled' : '') + ' onclick="klickReihe(' + idx + ')"><span class="reihe-num">' + (pos >= 0 ? (pos + 1) + '.' : '') + '</span><span>' + q.items[idx] + '</span></button>';
    }).join('') + '</div>';
}
function klickReihe(idx) {
  const q = aktuelleFrage(); const st = sess(q);
  const pos = st.ordnung.indexOf(idx);
  if (pos >= 0) st.ordnung.splice(pos, 1); else st.ordnung.push(idx);
  st.geprueft = false;
  render();
}

function aktuelleFrage() { return fragenZu(ansicht.thema)[ansicht.frage]; }

/* ---------- Prüfen & Lösung ---------- */
function pruefen() {
  const q = aktuelleFrage(); const st = sess(q);
  let ok = false;

  if (q.typ === 'mc') {
    if (st.sel === null) { st.fbText = 'wähle zuerst eine Antwort aus.'; st.geprueft = true; render(); return; }
    ok = st.sel === q.richtig;
    st.fbText = 'die gewählte Antwort stimmt nicht. Überlege nochmals oder schau die Lösung an.';
  } else if (q.typ === 'multi') {
    const soll = new Set(q.richtig);
    const richtigGewaehlt = [...st.set].filter(i => soll.has(i)).length;
    const falschGewaehlt = [...st.set].filter(i => !soll.has(i)).length;
    ok = richtigGewaehlt === soll.size && falschGewaehlt === 0;
    st.fbText = richtigGewaehlt + ' von ' + soll.size + ' richtigen Antworten gewählt' + (falschGewaehlt ? ', ' + falschGewaehlt + ' falsche dabei' : '') + '.';
  } else if (q.typ === 'zuordnen') {
    const treffer = q.zeilen.filter((z, i) => st.zuord[i] === z.rechts).length;
    ok = treffer === q.zeilen.length;
    st.fbText = treffer + ' von ' + q.zeilen.length + ' Zuordnungen stimmen.';
  } else if (q.typ === 'reihenfolge') {
    if (st.ordnung.length < q.items.length) { st.fbText = 'nummeriere zuerst alle Einträge (' + st.ordnung.length + ' von ' + q.items.length + ').'; st.geprueft = true; render(); return; }
    const treffer = st.ordnung.filter((idx, pos) => idx === pos).length;
    ok = treffer === q.items.length;
    st.fbText = treffer + ' von ' + q.items.length + ' Positionen stimmen.';
  }

  st.geprueft = true;
  if (ok) {
    st.korrekt = true;
    const neu = st.hilfe ? 'hilfe' : 'geloest';
    if (store.status[q.id] !== 'geloest' || neu === 'geloest') store.status[q.id] = neu;
    speichern();
  }
  render();
}

function zeigeLoesung() {
  const q = aktuelleFrage(); const st = sess(q);
  if (!st.korrekt) st.hilfe = true;
  st.loesungOffen = true;
  render();
}

function loesungsInhalt(q) {
  if (q.typ === 'mc') return '<p><b>Richtige Antwort:</b> ' + q.optionen[q.richtig] + '</p>';
  if (q.typ === 'multi') return '<p><b>Richtige Antworten:</b></p><ul>' + q.richtig.map(i => '<li>' + q.optionen[i] + '</li>').join('') + '</ul>';
  if (q.typ === 'zuordnen') return '<p><b>Richtige Zuordnung:</b></p><ul>' + q.zeilen.map(z => '<li>' + z.links + ' → <b>' + z.rechts + '</b></li>').join('') + '</ul>';
  if (q.typ === 'reihenfolge') return '<p><b>Richtige Reihenfolge:</b></p><ol>' + q.items.map(t => '<li>' + t + '</li>').join('') + '</ol>';
  return '';
}

function frageZuruecksetzen() {
  const q = aktuelleFrage();
  delete session[q.id];
  render();
}
